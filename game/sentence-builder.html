<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Builder Game</title>
    <style>
        /* ========== BRAND STYLES (Giữ từ game cũ) ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5deb3 0%, #fffacd 50%, #faebd7 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding-left: 20px;
            padding-right: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            min-height: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-title-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .game-title-logo img {
            height: 120px;
            width: auto;
            object-fit: contain;
        }

        /* ========== MODE SELECTION ========== */
        .mode-section {
            margin-bottom: 25px;
        }

        .mode-section h2 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 1.5em;
            text-align: center;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #555;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .mode-btn.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .mode-btn.solo {
            border-color: #27ae60;
        }

        .mode-btn.solo.selected {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .mode-btn.team {
            border-color: #3498db;
        }

        .mode-btn.team.selected {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        /* ========== DIFFICULTY SELECTION ========== */
        .difficulty-section {
            margin-bottom: 15px;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #555;
            min-width: 120px;
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .difficulty-btn.selected {
            transform: scale(1.05);
        }

        .difficulty-btn.easy {
            border-color: #27ae60;
        }

        .difficulty-btn.easy.selected {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
        }

        .difficulty-btn.normal {
            border-color: #3498db;
        }

        .difficulty-btn.normal.selected {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .difficulty-btn.hard {
            border-color: #e74c3c;
        }

        .difficulty-btn.hard.selected {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .mode-info {
            background: #f0f4ff;
            padding: 8px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        /* ========== VOCABULARY SECTION ========== */
        .vocabulary-section {
            margin: 10px 0;
            padding: 10px;
            text-align: center;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #3498db;
        }

        .vocab-controls {
            display: flex;
            gap: 15px;
            margin: 5px 0;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .vocab-select {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #3498db;
            border-radius: 8px;
            background: white;
            min-width: 180px;
            cursor: pointer;
        }

        .vocab-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========== BUTTONS BRAND STYLE ========== */
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-red {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-help {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }

        .btn-gift {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            animation: giftPulse 1.5s infinite;
        }

        /* ========== STATUS BOXES ========== */
        /* ========== VOCAB STATUS WRAPPER ========== */
.vocab-status-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;

}

        .vocab-status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-size: 14px;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .vocab-preview {
            background: #d4edda;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #155724;
            border: 1px solid #c3e6cb;
            text-align: center;
            display: none;
        }



        /* ========== GAME SECTION ========== */
        .game-section {
            display: none;
        }

        /* Header với Scoreboard và Timer - ĐÃ GIẢM KÍCH THƯỚC 70% */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .scoreboard {
            display: flex;
            gap: 15px;
            flex: 1;
            min-width: 300px;
            transform: scale(0.7);
            transform-origin: left center;
        }

        .team {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            min-width: 140px;
        }

        .team-red {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .team-blue {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .solo-score {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .team-score {
            font-size: 36px;
            margin-top: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .timer-section {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(0deg, #f5deb3 0%, #faebd7 100%);
            padding: 10px 20px;
            border-radius: 12px;
            color: #6b4ba2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            min-width: 180px;
            transform: scale(0.7);
            transform-origin: right center;
        }

        .timer {
            font-size: 32px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        .bonus-points {
            font-size: 16px;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .timer.warning {
            color: #f39c12;
            animation: timerPulse 1s infinite;
        }

        .timer.danger {
            color: #e74c3c;
            animation: timerPulse 0.5s infinite;
        }

        /* Game Info - ĐÃ TÁI CẤU TRÚC */
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            position: relative;
            min-height: 120px;
        }

        .game-info-left {
            flex: 1;
            min-width: 300px;
        }

        .game-info-right {
            flex: 1;
            min-width: 300px;
            text-align: right;
        }

        .progress {
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
            color: white;
        }

        .badge-normal {
            background: #f39c12;
        }

        /* Grammar Hint Box */
        .grammar-hint-box {
            background: #e8f6f3;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 5px solid #27ae60;
            display: inline-block;
        }

        .hint-label {
            color: #27ae60;
            font-weight: bold;
            margin-right: 10px;
        }

        /* Example Section */
        .example-section {
            background: #fff9e6;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #f39c12;
            display: inline-block;
            max-width: 400px;
        }

        .example-label {
            color: #f39c12;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            text-align: center;
        }

        .example-text {
            font-size: 18px;
            color: #333;
            font-style: italic;
        }

        /* ========== FEEDBACK OVERLAY (NEW) ========== */
        .feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            animation: popIn 0.5s ease-out;
            max-width: 90%;
        }

        .feedback-overlay.correct {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            border: 4px solid #229954;
        }

        .feedback-overlay.wrong {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: 4px solid #c0392b;
        }

        .feedback-overlay.skip {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: 4px solid #e67e22;
        }

        .feedback-overlay.timeup {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
            border: 4px solid #7f8c8d;
        }

        /* ========== WORD POOL (Từ để chọn) ========== */
        .word-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
            padding: 5px;
            background: #f1f8ff;
            border-radius: 15px;
            border: 2px dashed #3498db;
        }

        .word-tile {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
            /* FIX: Thêm touch-action để hỗ trợ di động */
            touch-action: manipulation;
        }

        .word-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .word-tile.selected {
            transform: scale(1.1);
            box-shadow: 0 0 0 3px white, 0 0 0 6px #667eea, 0 6px 12px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* Từ thêm vào đã có cùng màu với các từ khác */
        .word-tile.extra {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 1;
        }

        .word-tile.used {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .word-tile.used:hover {
            transform: none;
            box-shadow: none;
        }

        /* ========== SENTENCE BUILDER AREA ========== */
        .sentence-builder-area {
            background: #f8f9fa;
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 5px;
            margin: 5px 0;
            min-height: 80px;
            position: relative;
        }

        .sentence-slots {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 70px;
            padding: 5px;
        }

        .slot {
            width: 100px;
            height: 50px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            /* FIX: Thêm touch-action cho slot trên di động */
            touch-action: manipulation;
        }

        .slot.filled {
            border-color: #27ae60;
            background: #d4edda;
            transform: scale(1.05);
        }

        .slot.available {
            border-color: #3498db;
            background: #ebf5fb;
            transform: scale(1.05);
            animation: pulse-slot 1.5s infinite;
            cursor: pointer;
        }

        .slot:hover:not(.filled) {
            border-color: #3498db;
            background: #ebf5fb;
        }

        /* ĐÃ LOẠI BỎ PHẦN HIỂN THỊ CÂU ĐANG GHÉP */

        /* ========== GAME CONTROLS ========== */
        .buttons-section {
            position: relative;
            margin: 25px 0;
            min-height: 20px;
        }

        .team-buttons, .solo-buttons {
            display: none;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
        }

        /* Floating Controls - CHỈNH SỬA: Sắp xếp 3 nút ngang hàng */
        .floating-controls {
            position: relative;
            display: flex;
            justify-content: center; /* Căn giữa các nút */
            align-items: center; /* Căn giữa theo chiều dọc */
            gap: 15px; /* Khoảng cách giữa các nút */
            width: 100%;
            margin-top: 20px;
            flex-wrap: nowrap; /* Đảm bảo các nút không bị xuống dòng */
        }

        /* Check Button - Kích thước bằng với các nút khác */
        .btn-check-large {
            padding: 15px 30px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%) !important;
            color: white !important;
            border-radius: 12px !important;
            border: none !important;
            box-shadow: 0 8px 15px rgba(39, 174, 96, 0.3) !important;
            transition: all 0.3s !important;
            min-width: 150px;
            animation: pulse-green 2s infinite;
        }

        /* Hint và Skip Buttons - Kích thước tương tự Check */
        .btn-help-small, .btn-warning-small {
            padding: 15px 30px !important;
            font-size: 18px !important;
            min-width: 150px;
            height: auto;
        }

        /* Mobile icon-only buttons */
        .mobile-icon {
            display: none;
            font-size: 20px;
        }

        /* ========== NEXT BUTTON OVERLAY ========== */
        .next-button-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .big-next-button {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: pulse 1.5s infinite;
        }

        /* ========== SHOW ANSWER EFFECT ========== */
        .answer-reveal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(52, 152, 219, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 15px;
            animation: flash 2s forwards;
        }

        .reveal-text {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
        }

        /* ========== MODALS ========== */
        .gift-modal, .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .gift-content, .winner-content {
            background: white;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: bounce 1s;
        }

        /* ========== WORD LIST IN WINNER MODAL ========== */
        .sentence-list-container {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }

        .sentence-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sentence-item.correct {
            background: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }

        .sentence-item.incorrect {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }

        .sentence-number {
            font-weight: bold;
            margin-right: 15px;
            min-width: 30px;
        }

        .sentence-text {
            flex-grow: 1;
            font-family: monospace;
        }

        .sentence-points {
            font-weight: bold;
            min-width: 80px;
            text-align: right;
        }

        /* ========== LOGO CORNER ========== */
        .logo-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 999;
            animation: swing 3s ease-in-out infinite;
        }

        .logo-container img {
            width: 120px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes giftPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes flash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        @keyframes pulse-slot {
            0%, 100% { transform: scale(1.05); }
            50% { transform: scale(1.1); }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            70% {
                opacity: 1;

    <script>
        // ========== GAME VARIABLES ==========
        let sentences = [];

        let currentCorrectSentence = '';

        let blueTeamScore = 0;
        let soloScore = 0;

        let currentPoints = 0;

        let timeLeft = 60;
        let timerInterval = null;
        let bonusPoints = 0;
        let selectedTeam = '';
        let giftType = '';
        
        // Variables for vocabulary
        let vocabularyData = "";
        let selectedLevel = "";
        let selectedUnit = "";
        let vocabularyLoaded = false;
        let vocabularyStructure = {};
        
        // Game results tracking
        let gameResults = [];
        
        // Word selection variables
        let selectedWord = null;
        let slots = [];
        let usedWords = new Set();
        
        // Thêm biến để theo dõi trạng thái câu hỏi
        let questionAnswered = false;
        
        // Audio elements
        const rightSound = new Audio('right.mp3');
        const wrongSound = new Audio('wrong.mp3');
        const winSound = new Audio('win.mp3');

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabularyFile();
            setupEventListeners();
            setupWordSelection(); // Đồng bộ cơ chế chọn từ cho tất cả thiết bị
        });

        // ========== SETUP WORD SELECTION (CHO TẤT CẢ THIẾT BỊ) ==========
        function setupWordSelection() {
            // Sự kiện sẽ được gắn khi tải từ mới
        }

        function attachWordSelectionEvents() {
            const wordTiles = document.querySelectorAll('.word-tile');
            const slots = document.querySelectorAll('.slot');
            
            // 1. Nhấn vào từ để chọn
            wordTiles.forEach(tile => {
                // Xóa event listeners cũ
                tile.removeEventListener('click', handleWordClick);
                // Thêm event listener mới
                tile.addEventListener('click', handleWordClick);
            });
            
            // 2. Nhấn vào slot để đặt từ
            slots.forEach(slot => {
                // Xóa event listeners cũ
                slot.removeEventListener('click', handleSlotClick);
                // Thêm event listener mới
                slot.addEventListener('click', handleSlotClick);
            });
        }

        function handleWordClick(e) {
            const tile = e.currentTarget;
            if (tile.classList.contains('used')) return;
            
            // Bỏ chọn từ cũ
            document.querySelectorAll('.word-tile.selected').forEach(w => {
                w.classList.remove('selected');
            });
            
            // Chọn từ mới
            tile.classList.add('selected');
            selectedWord = tile;
            
            // Highlight các slot trống
            document.querySelectorAll('.slot').forEach(slot => {
                if (!slot.classList.contains('filled')) {
                    slot.classList.add('available');
                }
            });
            
            // Ngăn sự kiện click lan ra
            e.stopPropagation();
        }

        function handleSlotClick(e) {
            const slot = e.currentTarget;
            
            // Nếu slot đã có từ và không có từ nào đang được chọn -> xóa từ
            if (slot.classList.contains('filled') && !selectedWord) {
                removeWordFromSlot(slot);
                e.stopPropagation();
                return;
            }
            
            // Nếu có từ được chọn và slot trống -> đặt từ
            if (selectedWord && !slot.classList.contains('filled')) {
                // Đặt từ vào slot
                const word = selectedWord.dataset.word;
                slot.textContent = word;
                slot.dataset.word = word;
                slot.classList.add('filled');
                slot.classList.remove('available');
                
                // Đánh dấu từ đã dùng
                selectedWord.classList.add('used');
                selectedWord.classList.remove('selected');
                selectedWord.style.cursor = 'not-allowed';
                usedWords.add(selectedWord.id);
                
                // Reset selection
                selectedWord = null;
                
                // Xóa highlight khỏi các slot
                document.querySelectorAll('.slot').forEach(s => {
                    s.classList.remove('available');
                });
                
                e.stopPropagation();
            }
        }

        // ========== SHOW FEEDBACK OVERLAY ==========
        function showFeedback(message, type) {
            const feedbackOverlay = document.getElementById('feedbackOverlay');
            feedbackOverlay.textContent = message;
            feedbackOverlay.className = `feedback-overlay ${type}`;
            feedbackOverlay.style.display = 'block';
            
            // Tự động ẩn sau 3 giây
            setTimeout(() => {
                feedbackOverlay.style.display = 'none';
            }, 3000);
        }

        // ========== REMOVE WORD FROM SLOT ==========
        function removeWordFromSlot(slot) {
            const word = slot.dataset.word;
            
            // Clear slot
            slot.textContent = '';
            slot.dataset.word = '';
            slot.classList.remove('filled');
            
            // Find the word tile and mark it as unused
            const wordTiles = document.querySelectorAll('.word-tile');
            wordTiles.forEach(tile => {
                if (tile.dataset.word === word && tile.classList.contains('used')) {
                    tile.classList.remove('used');
                    tile.style.cursor = 'pointer';
                    
                    // Remove from usedWords set
                    usedWords.delete(tile.id);
                    return;
                }
            });
        }

        // ========== NẠP CÂU THEO ĐÚNG BÀI ĐANG CHỌN ==========
        let baiHienTai = null;

        function tenSach(sach) {
            return "Super Minds " + String(sach || "").replace(/\D/g, "");
        }
        function boNgoac(s) {
            return String(s || "").replace(/[()]/g, "").replace(/\s+/g, " ").trim();
        }
        function dongTuBai(bai) {
            const m = {};
            ((bai && bai.tu) || []).forEach(function (x) {
                const k = String((x && x[0]) || "").toLowerCase().replace(/[^a-z0-9' ]/g, "").trim();
                if (k && x[1]) m[k] = x[1];
            });
            return m;
        }
        function nghiaCau(cau, tuMap) {
            const words = String(cau || "").split(" ").filter(Boolean);
            if (!words.length) return "";
            let khop = 0;
            const ra = words.map(function (w) {
                const k = w.toLowerCase().replace(/[^a-z0-9' ]/g, "").trim();
                if (tuMap[k]) { khop++; return tuMap[k]; }
                return w;
            });
            return khop / words.length >= 0.5 ? ra.join(" ") : "";
        }
        function themCau(ds, daCo, obj) {
            const cau = String(obj.correctSentence || "").replace(/\s+/g, " ").trim();
            if (!cau) return;
            if (cau.split(" ").filter(Boolean).length < 2) return;
            const key = cau.toLowerCase();
            if (daCo[key]) return;
            daCo[key] = true;
            obj.words = cau;
            obj.correctSentence = cau;
            ds.push(obj);
        }

        // câu của đúng bài trong game/reading.json (id dạng SM1_Unit7)
        async function cauTuReading(bai) {
            try {
                const r = await fetch('reading.json');
                if (!r.ok) return [];
                const ds = await r.json();
                const id = String(bai.sach) + "_Unit" + bai.unit;
                const baiDoc = (ds || []).find(function (x) { return x && x.id === id; });
                if (!baiDoc || !baiDoc.sentences) return [];
                return baiDoc.sentences.map(function (w) { return w.join(" "); });
            } catch (e) { return []; }
        }

        // câu của đúng Sách + Unit trong sentences.txt (dự phòng khi bài chưa có trong reading.json)
        async function cauTuSentencesTxt(bai) {
            try {
                const r = await fetch('sentences.txt');
                if (!r.ok) return [];
                const noiDung = await r.text();
                const ra = [];
                const soSach = String(bai.sach || "").replace(/\D/g, "");
                let sachNay = false, unitNay = false;
                for (let dong of noiDung.split("\n")) {
                    dong = dong.trim();
                    if (!dong) continue;
                    if (dong.startsWith("===") && dong.endsWith("===")) {
                        const so = (dong.replace(/=/g, "").match(/(\d+)/) || [])[1] || "";
                        sachNay = so === soSach;
                        unitNay = false;
                        continue;
                    }
                    if (dong.startsWith("[") && dong.endsWith("]")) {
                        const mUnit = dong.slice(1, -1).match(/^U(\d+)/i);
                        unitNay = !!mUnit && Number(mUnit[1]) === Number(bai.unit);
                        continue;
                    }
                    if (!sachNay || !unitNay || dong.indexOf("|") < 0) continue;
                    const phan = dong.split("|").map(function (s) { return s.trim(); });
                    if (phan.length >= 2 && phan[0] && phan[1]) {
                        ra.push({ words: phan[0], correctSentence: phan[1], formula: phan[2] || "S + V + O", example: phan[3] || "" });
                    }
                }
                return ra;
            } catch (e) { return []; }
        }

        // Ghép danh sách câu: khuôn của Unit → reading.json → sentences.txt (đủ tối thiểu 5 câu)
        async function dungCauTuBai(bai) {
            const ds = [], daCo = {};
            const tuMap = dongTuBai(bai);
            const ten = tenSach(bai.sach);
            const nhanBai = bai.ten ? ("Bài: " + bai.ten) : (ten + " · Unit " + bai.unit);

            // 1) câu mẫu (khuôn) của đúng Unit
            ((bai && bai.khuon) || []).forEach(function (k) {
                if (!k) return;
                if (k.indexOf("/") >= 0 || k.indexOf("...") >= 0) return; // bỏ khuôn có phương án chọn / chỗ trống
                themCau(ds, daCo, {
                    formula: String(k).trim(),
                    example: nghiaCau(boNgoac(k), tuMap) || nhanBai,
                    correctSentence: boNgoac(k)
                });
            });

            // 2) bổ sung câu đọc của đúng bài trong reading.json
            if (ds.length < 5) {
                const cauDoc = await cauTuReading(bai);
                cauDoc.forEach(function (c) {
                    const nghia = nghiaCau(c, tuMap);
                    themCau(ds, daCo, { formula: "Câu trong bài đọc", example: nghia || nhanBai, correctSentence: c });
                });
            }

            // 3) còn thiếu thì lấy câu của đúng Unit trong sentences.txt
            if (ds.length < 5) {
                const cauFile = await cauTuSentencesTxt(bai);
                cauFile.forEach(function (o) { themCau(ds, daCo, o); });
            }

            return ds.slice(0, 10);
        }

        // ========== PARSE VOCABULARY STRUCTURE ==========
        function parseVocabularyStructure() {
            vocabularyStructure = {};
            const lines = vocabularyData.split('\n');
            let currentLevel = '';
            let currentUnit = '';
            
            for (let line of lines) {
                line = line.trim();
                
                // Find new level
                if (line.startsWith('===') && line.endsWith('===')) {
                    currentLevel = line.replace(/===/g, '').trim();
                    vocabularyStructure[currentLevel] = {};
                    currentUnit = '';
                }
                // Find new unit
                else if (line.startsWith('[') && line.endsWith(']') && currentLevel) {
                    currentUnit = line.slice(1, -1).trim();
                    vocabularyStructure[currentLevel][currentUnit] = [];
                }
                // Add sentence
                else if (line.includes('|') && currentLevel && currentUnit) {
                    vocabularyStructure[currentLevel][currentUnit].push(line);
                }
            }
        }

        // ========== LOAD SENTENCES ==========
        function loadSentences() {
            const level = document.getElementById('levelSelect').value;
            const unit = document.getElementById('unitSelect').value;
            const startBtn = document.getElementById('startBtn');
            const preview = document.getElementById('sentencePreview');
            
            if (!level || !unit) {
                alert('Please select both Level and Unit');
                return;
            }
            
            // Save selected level and unit
            selectedLevel = level;
            selectedUnit = unit;
            
            // Get sentences from structure
            const sentenceList = vocabularyStructure[level][unit];
            
            if (!sentenceList || sentenceList.length === 0) {
                alert(`No sentences found for ${level} - ${unit}`);
                return;
            }
            
            // Parse sentences
            sentences = [];
            for (let line of sentenceList) {
                const parts = line.split('|').map(s => s.trim());
                if (parts.length >= 4 && parts[0] && parts[1]) {
                    sentences.push({
                        words: parts[0],
                        correctSentence: parts[1],
                        formula: parts[2] || 'S + V + O',
                        example: parts[3] || 'Example sentence'
                    });
                }
            }
            
            if (sentences.length === 0) {
                alert('No valid sentences found!');
                return;
            }
            
            // Reset game results
            gameResults = [];
            
            // Show preview
            preview.style.display = 'block';
            preview.textContent = `✅ ${sentences.length} sentences`;
            
            // Enable start button
            startBtn.disabled = false;
            
            // Scroll to start button
            startBtn.scrollIntoView({ behavior: 'smooth' });
        }

        // ========== PREPARE WORD POOL ==========
        function prepareWordPool() {
    const wordPool = document.getElementById('wordPool');
    wordPool.innerHTML = '';
    
    // Tạo mảng từ từ phần 1 (có thể có từ thừa)
    let wordsFromPart1 = currentSentence.words.split(' ');
    let wordsToShow = [...wordsFromPart1];
    
    // Adjust based on difficulty
    if (difficulty === 'hard') {
        // Add 3 extra random words for hard difficulty
        extraWords = ['the', 'a', 'an', 'some', 'my', 'your', 'his', 'her', 'very', 'really', 'always', 'sometimes', 'never', 'can', 'will', 'do', 'does', 'is', 'am', 'are'];
        const numExtra = 3;
        
        for (let i = 0; i < numExtra; i++) {
            const randomExtra = extraWords[Math.floor(Math.random() * extraWords.length)];
            // Kiểm tra xem từ đã có trong mảng chưa
            const exists = wordsToShow.some(w => w.toLowerCase() === randomExtra.toLowerCase());
            if (!exists) {
                wordsToShow.push(randomExtra);
            }
        }
    }
    
    // Shuffle the words
    wordsToShow = shuffleArray(wordsToShow);
    
    // Create word tiles
    wordsToShow.forEach((word, index) => {
        const wordTile = document.createElement('div');
        wordTile.className = 'word-tile';
        wordTile.textContent = word;
        wordTile.dataset.word = word;
        wordTile.dataset.index = index;
        wordTile.id = `word-${index}`;
        
        // Mark extra words (for hard mode hoặc từ thừa trong phần 1)
        const isCorrectWord = currentWords.some(w => w === word);
        const isExtra = !isCorrectWord;
        
        if (isExtra) {
            wordTile.classList.add('extra');
        }
        
        wordPool.appendChild(wordTile);
    });
}

// ========== PREPARE SENTENCE SLOTS ==========
function prepareSentenceSlots() {
    const sentenceSlots = document.getElementById('sentenceSlots');
    sentenceSlots.innerHTML = '';
    slots = [];
    
    // Lấy số từ trong CÂU ĐÚNG
    const numSlots = currentWords.length;  // Đã sửa thành currentWords từ câu đúng
    
    // Create slots cho mỗi từ trong câu đúng
    for (let i = 0; i < numSlots; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.index = i;
        slot.dataset.word = '';
        slot.id = `slot-${i}`;
        
        sentenceSlots.appendChild(slot);
        slots.push(slot);
    }
    
    // For easy difficulty, auto-fill first 2 slots
    if (difficulty === 'easy' && currentWords.length >= 2) {
        // Find the first two CORRECT words in the word pool
        const wordTiles = document.querySelectorAll('.word-tile');
        const firstCorrectWord = currentWords[0];
        const secondCorrectWord = currentWords[1];
        
        let firstTile = null;
        let secondTile = null;
        
        // Find the tiles (so sánh chính xác)
        wordTiles.forEach(tile => {
            if (tile.dataset.word === firstCorrectWord && !firstTile) {
                firstTile = tile;
            }
            if (tile.dataset.word === secondCorrectWord && !secondTile) {
                secondTile = tile;
            }
        });
        
        // Auto-fill first slot
        if (firstTile && slots[0]) {
            slots[0].textContent = firstCorrectWord;
            slots[0].dataset.word = firstCorrectWord;
            slots[0].classList.add('filled');
            firstTile.classList.add('used');
            firstTile.style.cursor = 'not-allowed';
            usedWords.add(firstTile.id);
        }
        
        // Auto-fill second slot
        if (secondTile && slots[1]) {
            slots[1].textContent = secondCorrectWord;
            slots[1].dataset.word = secondCorrectWord;
            slots[1].classList.add('filled');
            secondTile.classList.add('used');
            secondTile.style.cursor = 'not-allowed';
            usedWords.add(secondTile.id);
        }
    }
}

        // ========== TIMER FUNCTIONS ==========
        function startTimer() {
            // Clear any existing timer
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeUp();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerDiv = document.getElementById('timer');
            if (!timerDiv) return;
            
            timerDiv.textContent = timeLeft;
            
            // Remove all classes
            timerDiv.classList.remove('warning', 'danger');
            
            // Add appropriate class based on time
            if (timeLeft <= 10) {
                timerDiv.classList.add('danger');
            } else if (timeLeft <= 20) {
                timerDiv.classList.add('warning');
            }
            
            // Calculate bonus points (1 point per 15 seconds remaining)
            if (timeLeft > 0) {
                bonusPoints = Math.floor(timeLeft / 15);
                if (bonusPoints > 0 && correctAnswer) {
                    document.getElementById('bonusPoints').textContent = `+${bonusPoints} bonus!`;
                } else {
                    document.getElementById('bonusPoints').textContent = '';
                }
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function timeUp() {
            showFeedback('⏰ TIME\'S UP!', 'timeup');
            
            // Kiểm tra xem câu hỏi đã được trả lời chưa
            if (!questionAnswered) {
                // Record result as incorrect
                gameResults.push({
                    sentence: currentCorrectSentence,
                    formula: currentSentence.formula,
                    correct: false,
                    points: 0
                });
            }
            
            // Ẩn 3 nút CHECK, HINT, SKIP
            document.getElementById('floatingControls').style.display = 'none';
            
            // Show next button
            showNextButton();
        }

        // ========== CHECK SENTENCE ==========
        function checkSentence() {
    // Nếu câu hỏi đã được trả lời rồi, không làm gì cả
    if (questionAnswered) return;
    
    const filledSlots = document.querySelectorAll('.slot.filled');
    
    // Check if all slots are filled
    if (filledSlots.length !== currentWords.length) {
        showFeedback('❌ Please fill all slots!', 'wrong');
        return;
    }
    
    // Build user's sentence
    let userSentence = '';
    filledSlots.forEach(slot => {
        userSentence += slot.dataset.word + ' ';
    });
    userSentence = userSentence.trim();
    
    // Stop timer
    stopTimer();
    
    // Check if correct
    if (userSentence === currentCorrectSentence) {
        // Correct answer
        correctAnswer = true;
        questionAnswered = true;
        
        // Calculate total points
        const totalPoints = currentPoints + bonusPoints;
        
        // Show success feedback
        showFeedback(`✅ PERFECT! +${totalPoints} points`, 'correct');
        
        // Play sound
        rightSound.play().catch(e => console.log('Audio play failed:', e));
        
        // Show team/solo buttons
        if (gameMode === 'team') {
            document.getElementById('teamButtons').style.display = 'flex';
        } else {
            document.getElementById('soloButtons').style.display = 'flex';
        }
        
        // ẨN 3 NÚT CHECK, HINT, SKIP
        document.getElementById('floatingControls').style.display = 'none';
        
        // Record result
        gameResults.push({
            sentence: currentCorrectSentence,
            formula: currentSentence.formula,
            correct: true,
            points: totalPoints
        });
        try { GAME.ghi({tu: currentCorrectSentence, ok:true}); } catch(e){}
        
    } else {
        // Wrong answer
        showFeedback('❌ Not quite right. Try again!', 'wrong');
        
        // Play sound
        wrongSound.play().catch(e => console.log('Audio play failed:', e));
    }
}

                if (lastResult && lastResult.correct) {
                    lastResult.points = pointsToAdd;
                }
            }
            
            showNextButton();
        }

        // ========== END GAME ==========
        function endGame() {
            try { GAME.ketThuc({soCau: (typeof sentences != "undefined" ? sentences.length : 0), soDung: (gameResults || []).filter(r => r.correct).length}); } catch(e){}
            stopTimer();
            
            const modal = document.getElementById('winnerModal');
            const winnerTeam = document.getElementById('winnerTeam');
            const finalScores = document.getElementById('finalScores');
            const difficultyInfoDisplay = document.getElementById('difficultyInfoDisplay');
            const finalLevel = document.getElementById('finalLevel');
            const finalUnit = document.getElementById('finalUnit');
            const sentenceListContainer = document.getElementById('sentenceListContainer');
            
            // Display level and unit info
            if (selectedLevel && selectedUnit) {
                finalLevel.textContent = selectedLevel;
                finalUnit.textContent = selectedUnit;
            }
            
            // Hiển thị thông tin độ khó
            difficultyInfoDisplay.innerHTML = `<strong>Difficulty:</strong> ${difficulty.toUpperCase()}`;
            
            // Display sentence list
            displaySentenceList(sentenceListContainer);
            
            // Determine winner
            let winner = '';
            let winnerColor = '';
            
            // Cập nhật hiển thị điểm
            if (gameMode === 'team') {
                if (redTeamScore > blueTeamScore) {
                    winner = '🔴 RED TEAM WINS! 🔴';
                    winnerColor = '#e74c3c';
                } else if (blueTeamScore > redTeamScore) {
                    winner = '🔵 BLUE TEAM WINS! 🔵';
                    winnerColor = '#3498db';
                } else {
                    winner = '🤝 IT\'S A DRAW! 🤝';
                    winnerColor = '#f39c12';
                }
                
                // Hiển thị điểm trên cùng một hàng
                finalScores.innerHTML = `
                    <div style="display: flex; justify-content: center; gap: 30px; margin: 15px 0;">
                        <div style="text-align: center;">
                            <div style="color: #e74c3c; font-weight: bold;">🔴 Red Team</div>
                            <div style="font-size: 18px; font-weight: bold;">${redTeamScore} points</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="color: #3498db; font-weight: bold;">🔵 Blue Team</div>
                            <div style="font-size: 18px; font-weight: bold;">${blueTeamScore} points</div>
                        </div>
                    </div>
                    <div style="margin-top: 15px; text-align: center;">
                        <div>Total sentences: <strong>${sentences.length}</strong></div>
                        <div>Correct sentences: <strong>${gameResults.filter(r => r.correct).length}</strong></div>
                        <div>Accuracy: <strong>${Math.round((gameResults.filter(r => r.correct).length / sentences.length) * 100)}%</strong></div>
                    </div>
                `;
            } else {
                winner = '🏆 WELL DONE! 🏆';
                winnerColor = '#27ae60';
                finalScores.innerHTML = `
                    <div style="text-align: center; margin-bottom: 15px;">
                        <div style="font-size: 18px; font-weight: bold; color: #27ae60;">🎯 Your Final Score: ${soloScore} points</div>
                    </div>
                    <div style="margin-top: 20px; text-align: center;">
                        <div>Total sentences: <strong>${sentences.length}</strong></div>
                        <div>Correct sentences: <strong>${gameResults.filter(r => r.correct).length}</strong></div>
                        <div>Accuracy: <strong>${Math.round((gameResults.filter(r => r.correct).length / sentences.length) * 100)}%</strong></div>
                    </div>
                `;
            }
            
            winnerTeam.textContent = winner;
            winnerTeam.style.color = winnerColor;
            winnerTeam.style.fontSize = '24px';
            winnerTeam.style.margin = '15px 0';
            
            modal.style.display = 'flex';
            
            // Play win sound
            winSound.play().catch(e => console.log('Audio play failed:', e));
        }

        // ========== DISPLAY SENTENCE LIST ==========
        function displaySentenceList(container) {
            container.innerHTML = '';
            
            if (gameResults.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6c757d;">No sentences were attempted.</p>';
                return;
            }
            
            gameResults.forEach((result, index) => {
                const sentenceItem = document.createElement('div');
                sentenceItem.className = `sentence-item ${result.correct ? 'correct' : 'incorrect'}`;
                
                sentenceItem.innerHTML = `
                    <div style="display: flex; align-items: center; width: 100%;">
                        <div class="sentence-number">${index + 1}</div>
                        <div style="flex-grow: 1;">
                            <div class="sentence-text"><strong>"${result.sentence}"</strong></div>
                            <div style="font-size: 12px; color: #6c757d;">${result.formula}</div>
                        </div>
                        <div class="sentence-points">
                            ${result.correct ? `✅ +${result.points} pts` : '❌ 0 pts'}
                        </div>
                    </div>
                `;
                
                container.appendChild(sentenceItem);
            });
        }

        // ========== UTILITY FUNCTIONS ==========
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // ========== PLAY AGAIN ==========
        function playAgain() {
            location.reload();
        }
    </script>
</body>
</html>
