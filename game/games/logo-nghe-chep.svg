<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Logo Nghe – chép chính tả: chim đội tai nghe">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#FFEFC9"/>
    </linearGradient>
    <linearGradient id="than" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FD6C8"/>
      <stop offset="1" stop-color="#43B7AB"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="104" fill="url(#nen)" stroke="#F0DCAE" stroke-width="4"/>

  <!-- thân chim -->
  <ellipse cx="110" cy="122" rx="56" ry="50" fill="url(#than)"/>
  <ellipse cx="110" cy="136" rx="34" ry="28" fill="#FFF6E2" opacity=".92"/>

  <!-- mắt -->
  <circle cx="89" cy="106" r="15" fill="#fff"/>
  <circle cx="131" cy="106" r="15" fill="#fff"/>
  <circle cx="92" cy="108" r="7.5" fill="#2B2A26"/>
  <circle cx="134" cy="108" r="7.5" fill="#2B2A26"/>
  <circle cx="94.5" cy="105" r="2.4" fill="#fff"/>
  <circle cx="136.5" cy="105" r="2.4" fill="#fff"/>

  <!-- má -->
  <ellipse cx="74" cy="124" rx="9" ry="6" fill="#F6A6A6" opacity=".55"/>
  <ellipse cx="146" cy="124" rx="9" ry="6" fill="#F6A6A6" opacity=".55"/>

  <!-- mỏ -->
  <path d="M99 126 L121 126 L110 141 Z" fill="#F0B429" stroke="#D99A12" stroke-width="2" stroke-linejoin="round"/>

  <!-- tai nghe -->
  <path d="M50 108 C50 56 170 56 170 108" fill="none" stroke="#2B2A26" stroke-width="13" stroke-linecap="round"/>
  <rect x="31" y="96" width="28" height="48" rx="14" fill="#2B2A26"/>
  <rect x="161" y="96" width="28" height="48" rx="14" fill="#2B2A26"/>
  <rect x="37" y="104" width="16" height="32" rx="8" fill="#F0B429"/>
  <rect x="167" y="104" width="16" height="32" rx="8" fill="#F0B429"/>

  <!-- nốt nhạc -->
  <g fill="#F0B429" opacity=".95">
    <circle cx="176" cy="70" r="6"/>
    <rect x="180" y="46" width="3.2" height="25" rx="1.6"/>
    <path d="M183 46 q10 4 10 12 q-4 -6 -10 -7 Z"/>
  </g>
</svg>
