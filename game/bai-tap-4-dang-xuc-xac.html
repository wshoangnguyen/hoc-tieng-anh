<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài tập 4 dạng · Lớp 1 (Units 1–9)</title>
<style>
  :root{--bg:#FFFBF0;--card:#fff;--ink:#2B2118;--phu:#8A7561;--tim:#6C5CE7;--cam:#FF7A59;
        --xanh:#00B8A9;--vang:#FFC93C;--vien:#EADFC8;--dung:#2FA36B;--sai:#E0503C}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 "Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}
  header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--vien);
         padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .chip{background:#FFF4DE;border:1px solid var(--vien);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
  .chip b{color:var(--tim)}
  .chip.diem b{color:var(--cam)}
  header .reset{margin-left:auto;border:1px solid var(--vien);background:#fff;border-radius:12px;padding:8px 14px;
                font:inherit;font-weight:600;color:var(--phu);cursor:pointer}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .ds-cau{display:grid;grid-template-columns:1fr;gap:0 26px}
  @media(min-width:900px){.ds-cau{grid-template-columns:1fr 1fr}}
  .bt{background:var(--card);border:1px solid var(--vien);border-radius:20px;padding:16px 18px 18px;
      margin-bottom:18px;box-shadow:0 2px 0 #F1E6D2}
  .bt h2{font-size:19px;margin:0 0 2px}
  .bt .mota{color:var(--phu);font-size:14px;margin:0 0 12px}
  .q{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px dashed #F0E6D2}
  .q:first-of-type{border-top:0}
  @media(min-width:900px){.ds-cau>.q:nth-child(2){border-top:0}}
  .so{flex:0 0 30px;height:30px;border-radius:50%;background:#FFF4DE;color:#B49A6E;font-weight:800;
      display:flex;align-items:center;justify-content:center;font-size:14px}
  .than{flex:1;min-width:0}
  .lua{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .lua button{border:1.5px solid var(--vien);background:#fff;border-radius:14px;cursor:pointer;padding:8px;
              display:flex;align-items:center;justify-content:center;transition:.12s}
  .lua button:hover{background:#FFF7E6;transform:translateY(-1px)}
  .lua button img{width:78px;height:78px;object-fit:contain;display:block}
  .lua button.to{width:58px;height:58px;font-size:26px;font-weight:800;color:var(--tim)}
  .lua button.nghe{width:52px;height:52px;font-size:22px;background:#F3F0FF;border-color:#DCD4FF}
  .lua button.dung{border-color:var(--dung);background:#EAF7F0;box-shadow:0 0 0 3px #CDEEDD inset}
  .lua button.sai{border-color:var(--sai);background:#FDEDEA;opacity:.75}
  .chu{font-size:22px;font-weight:700;margin-bottom:8px}
  .viet{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .viet input{width:74px;height:52px;text-align:center;font:inherit;font-size:24px;font-weight:800;
              border:1.5px solid var(--vien);border-radius:12px;color:var(--tim);text-transform:lowercase}
  .viet input:focus{outline:none;border-color:var(--tim);box-shadow:0 0 0 3px #EDE9FF}
  .viet .kt{border:0;background:var(--tim);color:#fff;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
  .kq{font-size:20px;font-weight:700;margin-left:4px}
  .kq.ok{color:var(--dung)} .kq.no{color:var(--sai)}
  .diemcuoi{color:var(--phu);font-size:14px;margin-top:10px}
  .diemcuoi b{color:var(--tim)}

  /* xúc xắc */
  #san{position:fixed;inset:0;pointer-events:none;z-index:50}
  .xuc{position:fixed;left:50%;bottom:26px;width:94px;height:94px;border-radius:20px;background:#fff;
       border:3px solid #E4D9C3;box-shadow:0 14px 30px rgba(43,33,24,.22);
       display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:3px;
       transform:translate(-50%,0) scale(.5);opacity:0;transition:opacity .12s,transform .18s;z-index:60}
  .xuc.hien{opacity:1;transform:translate(-50%,0) scale(1)}
  .xuc.roll{animation:lat .3s linear infinite}
  @keyframes lat{
    0%{transform:translate(-50%,0) rotate(-13deg) scale(1)}
    50%{transform:translate(-50%,-12px) rotate(10deg) scale(1.05)}
    100%{transform:translate(-50%,0) rotate(-7deg) scale(1)}}
  .pip{width:100%;height:100%;border-radius:50%;background:transparent}
  .pip.on{background:var(--tim);box-shadow:inset 0 -1px 2px rgba(0,0,0,.15)}
  .them{position:fixed;font-size:34px;font-weight:900;color:var(--cam);transform:translate(-50%,-50%);
        animation:bay 1.4s ease-out forwards;text-shadow:0 2px 0 #fff;z-index:61}
  @keyframes bay{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}
                 25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}
                 100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
  @media (max-width:520px){
    .lua button img{width:68px;height:68px}
    .chu{font-size:19px}
    .xuc{width:80px;height:80px}
  }
</style>
</head>
<body>
<header>
  <h1>Bài tập · Lớp 1</h1>
  <span class="chip">Đúng <b id="cDung">0</b>/<span id="cTong">0</span></span>
  <span class="chip diem">Điểm xúc xắc <b id="cDiem">0</b></span>
  <button class="reset" id="btnReset">Chơi lại</button>
</header>
<main id="wrap"></main>
<div id="san"></div>

/* ---------- giọng nữ tiếng Anh ---------- */
function giongNu(){
  const ds = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang));
  const may = ds.filter(v => v.localService);
  const uu = [/Zira/i, /Aria/i, /Jenny/i, /Michelle/i, /Samantha/i, /Female/i, /Google UK English Female/i, /Google US English/i];
  for (const nhom of [may, ds]) for (const re of uu) { const v = nhom.find(x => re.test(x.name) || re.test(x.voiceURI)); if (v) return v; }
  return may[0] || ds[0] || null;
}
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
function noi(cau, cham){
  if (!window.speechSynthesis || !cau) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cau);
    const v = giongNu(); if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = cham ? .78 : .9; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- âm thanh ---------- */
let ac = null;
const audio = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
function tiengDice(){
  try{
    const a = audio(), t0 = a.currentTime;
    for (let i = 0; i < 7; i++){
      const t = t0 + i * .075 + Math.random() * .02;
      const buf = a.createBuffer(1, a.sampleRate * .05, a.sampleRate), d = buf.getChannelData(0);
      for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 3);
      const src = a.createBufferSource(); src.buffer = buf;
      const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1200; f.Q.value = 1.2;
      const g = a.createGain(); g.gain.value = .28;
      src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
    }
  }catch(e){}
}
function tiengDung(){
  try{
    const a = audio(), t = a.currentTime;
    [660, 880, 1180].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.001, t + i * .07);
      g.gain.exponentialRampToValueAtTime(.18, t + i * .07 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + i * .07 + .3);
      o.connect(g); g.connect(a.destination); o.start(t + i * .07); o.stop(t + i * .07 + .32);
    });
  }catch(e){}
}

/* ---------- xúc xắc ---------- */
const SAN = $('#san');
const MAT = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function matXuc(n){
  const o = MAT[n];
  return Array.from({length:9}, (_, i) => `<div class="pip${o.includes(i+1) ? ' on' : ''}"></div>`).join('');
}
function tungXuc(n){
  document.querySelectorAll('.xuc,.them').forEach(el => el.remove());
  const d = el('div', 'xuc hien roll', matXuc(1 + (Math.random() * 6 | 0)));
  SAN.appendChild(d);
  tiengDice();
  let i = 0;
  const quay = setInterval(() => { d.innerHTML = matXuc(1 + (Math.random() * 6 | 0)); }, 70);
  setTimeout(() => {
    clearInterval(quay);
    d.classList.remove('roll');
    d.innerHTML = matXuc(n);
    tiengDung();
    const t = el('div', 'them', '+' + n);
    SAN.appendChild(t);
    setTimeout(() => { d.classList.remove('hien'); setTimeout(() => d.remove(), 300); }, 1400);
    setTimeout(() => t.remove(), 1400);
  }, 720);
}

/* ---------- điểm ---------- */
function capNhat(){
  const td = DUNG.reduce((a, b) => a + b, 0), tp = DIEM.reduce((a, b) => a + b, 0);
  $('#cDung').textContent = td; $('#cDiem').textContent = tp;
  $('#cTong').textContent = BT.reduce((a, b) => a + b.cau.length, 0);
  BT.forEach((b, i) => {
    const s = document.querySelector(`.bt[data-bt="${i}"] .diemcuoi`);
    if (s) s.innerHTML = `Đúng <b>${DUNG[i]}</b>/${b.cau.length} · Điểm xúc xắc <b>${DIEM[i]}</b>`;
  });
}

/* ---------- vẽ ---------- */
function ve(){
  const wrap = $('#wrap');
  wrap.innerHTML = '';
  BT.forEach((b, i) => {
    const box = el('section', 'bt');
    box.dataset.bt = i;
    box.appendChild(el('h2', null, b.ten));
    box.appendChild(el('p', 'mota', b.mo));
    const luoi = el('div', 'ds-cau');
    b.cau.forEach((c, j) => luoi.appendChild(cauUI(b, c, i, j)));
    box.appendChild(luoi);
    box.appendChild(el('div', 'diemcuoi'));
    wrap.appendChild(box);
  });
  capNhat();
}

function cauUI(b, c, i, j){
  const q = el('div', 'q'); q.dataset.i = i; q.dataset.j = j;
  q.appendChild(el('div', 'so', j + 1));
  const than = el('div', 'than');
  const lua = el('div', 'lua');

  if (b.kieu === 'am'){
    const nut = el('button', 'nghe', '🔊'); nut.onclick = () => noi(c.noi);
    lua.appendChild(nut);
    tron(c.lua).forEach(ch => {
      const t = el('button', 'to', ch);
      t.dataset.lua = ch;
      t.onclick = () => traLoi(q, t, ch === c.dung, 'Listen: ' + c.noi, i, j, c.dung);
      lua.appendChild(t);
    });
  } else if (b.kieu === 'nghe'){
    const nut = el('button', 'nghe', '🔊'); nut.onclick = () => noi(c.noi);
    lua.appendChild(nut);
    tron(c.lua).forEach(k => {
      const t = el('button', null, `<img src="${MAP[k].img}" alt="">`);
      t.dataset.lua = k;
      t.onclick = () => traLoi(q, t, k === c.dung, c.noi, i, j, c.dung);
      lua.appendChild(t);
    });
  } else if (b.kieu === 'doc'){
    than.appendChild(el('div', 'chu', c.chu));
    tron(c.lua).forEach(k => {
      const t = el('button', null, `<img src="${MAP[k].img}" alt="">`);
      t.dataset.lua = k;
      t.onclick = () => traLoi(q, t, k === c.dung, c.chu, i, j, c.dung);
      lua.appendChild(t);
    });
  } else {
    const hang = el('div', 'viet');
    hang.innerHTML = `<img src="${MAP[c.anh].img}" alt="" style="width:88px;height:88px;object-fit:contain">
      <span class="chu" style="margin:0">${c.chu}</span>`;
    const inp = el('input'); inp.maxLength = 2; inp.placeholder = '?';
    const nut = el('button', 'kt', 'Kiểm tra');
    const kq = el('span', 'kq');
    const kiem = () => {
      const v = inp.value.trim().toLowerCase();
      if (!v || q.dataset.xong) return;
      q.dataset.xong = '1';
      const ok = v === c.dung;
      kq.textContent = ok ? '✅' : '❌ ' + c.dung;
      kq.className = 'kq ' + (ok ? 'ok' : 'no');
      inp.disabled = true;
      if (ok) thuong(q, i, j); else noi('Listen: ' + MAP[c.anh].w);
    };
    nut.onclick = kiem;
    inp.onkeydown = e => { if (e.key === 'Enter') kiem(); };
    hang.appendChild(inp); hang.appendChild(nut); hang.appendChild(kq);
    than.appendChild(hang);
    q.appendChild(than);
    return q;
  }
  than.appendChild(lua);
  q.appendChild(than);
  return q;
}

function thuong(q, i, j){
  if (q.dataset.tinh) return;
  q.dataset.tinh = '1';
  const n = 1 + (Math.random() * 6 | 0);
  DIEM[i] += n; DUNG[i] += 1; capNhat();
  tungXuc(n);
  noi(['Good job!', 'Well done!', 'Excellent!', 'Great!'][Math.random() * 4 | 0]);
}

function traLoi(q, nut, ok, cauDung, i, j, dungKey){
  if (q.dataset.xong) return;
  q.dataset.xong = '1';
  nut.classList.add(ok ? 'dung' : 'sai');
  if (!ok){
    q.querySelectorAll('[data-lua]').forEach(x => {
      if (dungKey && x.dataset.lua === dungKey) x.classList.add('dung');
      else if (!dungKey && x.textContent.trim() === cauDung) x.classList.add('dung');
    });
    noi(cauDung);
  } else {
    thuong(q, i, j);
  }
}

$('#btnReset').onclick = () => {
  if (!confirm('Chơi lại từ đầu? Điểm sẽ về 0.')) return;
  DIEM.fill(0); DUNG.fill(0); ve(); window.scrollTo({top: 0, behavior: 'smooth'});
};

ve();
</script>
</body>
</html>
