<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint — điều khiển chú chó</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#4a3a26;
    background:linear-gradient(180deg,#fffaf0 0%,#ffeed2 55%,#ffe3b8 100%);
    overflow:hidden;
  }
  .mat-dat{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#f3dcb6,#e8c795)}
  .mat-dat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#dcb987}

  .may{position:absolute;border-radius:50%;background:#fff;opacity:.72;filter:blur(1px)}
  .may.a{width:120px;height:44px;top:16%;left:12%}
  .may.b{width:86px;height:32px;top:10%;left:58%}
  .may.c{width:150px;height:52px;top:22%;left:76%}

  .duong-chay{position:absolute;left:0;right:0;bottom:22%;height:58%}

  #chay{position:absolute;left:0;bottom:-1.8%;width:clamp(170px,26vw,300px);will-change:transform;transform-origin:50% 80%}
  #sprite{position:relative;z-index:2}
  #sprite svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 8px rgba(120,70,20,.16))}
  #sprite img{display:block;width:100%}

  .gio{position:absolute;left:-16%;top:34%;width:38%;height:52%;z-index:1}
  .gio i{position:absolute;display:block;height:7px;border-radius:4px;background:#d8b184;opacity:0}
  .gio i:nth-child(1){top:8%;width:70%}
  .gio i:nth-child(2){top:34%;width:46%;left:-6%}
  .gio i:nth-child(3){top:62%;width:58%;left:4%}
  body.dang-chay .gio i{animation:tan .62s linear infinite}
  body.dang-chay .gio i:nth-child(2){animation-delay:.16s}
  body.dang-chay .gio i:nth-child(3){animation-delay:.32s}
  @keyframes tan{0%{opacity:0;transform:translateX(10px)}35%{opacity:.55}100%{opacity:0;transform:translateX(-26px)}}

  .bui{position:absolute;left:0;bottom:-2%;width:34%;height:60%;z-index:0}
  .bui span{position:absolute;bottom:0;border-radius:50%;background:#e6c79a;opacity:0}
  .bui span:nth-child(1){left:8%;width:14px;height:14px}
  .bui span:nth-child(2){left:20%;width:20px;height:20px}
  .bui span:nth-child(3){left:2%;width:10px;height:10px}
  body.dang-chay .bui span{animation:bui .8s ease-out infinite}
  body.dang-chay .bui span:nth-child(2){animation-delay:.22s}
  body.dang-chay .bui span:nth-child(3){animation-delay:.44s}
  @keyframes bui{0%{opacity:.5;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-40px,-14px) scale(1.6)}}

  .tieu-de{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none}
  .tieu-de b{font-size:clamp(20px,3.2vw,28px);letter-spacing:.4px}
  .tieu-de p{margin:5px 0 0;font-size:clamp(12px,1.6vw,14px);color:#8a7355}

  .dieu-khien{position:absolute;top:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw;z-index:5}
  button{font:inherit;font-size:14px;padding:9px 14px;border-radius:11px;border:1px solid #e2c69b;
         background:#fffdf7;color:#5b4628;cursor:pointer;box-shadow:0 2px 0 #e6cfae}
  button:active{transform:translateY(1px);box-shadow:none}
  button.chinh{background:#fff1cf;border-color:#e0b46a}

  .ghi-chu{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:11px;color:#a48d6d}
  @media (max-width:700px){
    .dieu-khien{top:auto;bottom:10px;left:8px;right:8px;max-width:none;justify-content:center;gap:6px}
    button{font-size:13px;padding:11px 11px;border-radius:10px}
    .tieu-de{top:14px}
    #chay{width:clamp(200px,46vw,300px)}
    .ghi-chu{display:none}
  }
</style>
</head>
<body>
  <div class="may a"></div><div class="may b"></div><div class="may c"></div>
  <div class="mat-dat"></div>

  <div class="tieu-de"><b>Sprint</b><p>Bấm nút để điều khiển chú chó</p></div>

  <div class="dieu-khien">
    <button id="btnDi" class="chinh">Đi</button>
    <button id="btnChieu">Đổi chiều</button>
    <button id="btnNhanh">Tốc độ ×1</button>
    <button id="btnSua">Sủa</button>
    <button id="btnGiua">Ra giữa</button>
  </div>

  <div class="duong-chay">
    <div id="chay">
      <div class="gio"><i></i><i></i><i></i></div>
      <div id="sprite"></div>
      <div class="bui"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="ghi-chu">8 khung SVG (6 chạy + 2 đứng) · JS điều khiển · tiếng sủa 0,5 giây</div>

<audio id="tiengSua" src="audio/sua.mp3" preload="auto"></audio>
<script>
(function(){
  var sprite = document.getElementById('sprite');
  var chay   = document.getElementById('chay');
  var tieng  = document.getElementById('tiengSua');
  var KHUNG  = 6, NHIP = 130;

  var x = 0, huong = 1, tocDo = 260, dangChay = false;
  var khung = 0, dem = 0, sua = 0, lanCuoi = 0, rongAnh = 300;
  var dsKhung = [];

  function hien(i){
    for(var k=0;k<dsKhung.length;k++) dsKhung[k].style.display = (k===i) ? '' : 'none';
  }
  function hienTheoTen(ten){
    for(var k=0;k<dsKhung.length;k++){
      dsKhung[k].style.display = dsKhung[k].classList.contains(ten) ? '' : 'none';
    }
  }
  function ve(){
    chay.style.transform = 'translateX(' + x.toFixed(1) + 'px) scaleX(' + huong + ')';
  }
  function datNut(){
    var b = document.getElementById('btnDi');
    b.textContent = dangChay ? 'Dừng' : 'Đi';
    document.body.classList.toggle('dang-chay', dangChay);
  }

  function buoc(ts){
    if(!lanCuoi) lanCuoi = ts;
    var dt = Math.min(60, ts - lanCuoi) / 1000;
    lanCuoi = ts;

    if(dangChay){
      x += huong * tocDo * dt;
      var rongMan = window.innerWidth;
      if(huong === 1 && x > rongMan + 20) x = -rongAnh - 20;
      if(huong === -1 && x < -rongAnh - 20) x = rongMan + 20;
      dem += dt * 1000 * (tocDo / 260);
      if(dem >= NHIP){ dem = 0; khung = (khung + 1) % KHUNG; }
    }

    if(sua > 0){
      sua -= dt * 1000;
      if(dangChay){ hien(khung); }
      else { hienTheoTen((Math.floor((600 - sua) / 110) % 2) ? 'k8' : 'k7'); }
    } else if(dsKhung.length){
      if(dangChay) hien(khung); else hienTheoTen('k7');
    }
    ve();
    requestAnimationFrame(buoc);
  }

  fetch('sprint-chay.svg').then(function(r){ return r.text(); }).then(function(txt){
    var doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
    var st = doc.querySelector('style'); if(st) st.remove();
    var svg = doc.documentElement;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    sprite.appendChild(document.importNode(svg, true));
    dsKhung = sprite.querySelectorAll('g.khung');
    for(var k=0;k<dsKhung.length;k++) dsKhung[k].style.animation = 'none';
    rongAnh = Math.max(200, chay.getBoundingClientRect().width);
    x = Math.round(window.innerWidth * 0.08);
    hienTheoTen('k7'); ve();
  }).catch(function(){
    sprite.innerHTML = '<img src="sprint-chay.svg" alt="Sprint">';
  });

  document.getElementById('btnDi').onclick = function(){
    dangChay = !dangChay;
    if(dangChay){ dem = 0; } else { hienTheoTen('k7'); }
    datNut();
  };

  document.getElementById('btnChieu').onclick = function(){ huong = -huong; ve(); };

  document.getElementById('btnNhanh').onclick = function(){
    var bac = [260, 420, 620], ten = ['×1','×1.6','×2.4'];
    var i = bac.indexOf(tocDo); i = (i + 1) % bac.length;
    tocDo = bac[i]; this.textContent = 'Tốc độ ' + ten[i];
  };

  document.getElementById('btnSua').onclick = function(){
    sua = 600;
    try{ tieng.currentTime = 0; tieng.play(); }catch(e){}
  };

  document.getElementById('btnGiua').onclick = function(){
    x = Math.max(0, (window.innerWidth - rongAnh) / 2); ve();
  };

  window.addEventListener('resize', function(){
    rongAnh = Math.max(200, chay.getBoundingClientRect().width);
  });

  requestAnimationFrame(buoc);
})();
</script>
</body>
</html>
