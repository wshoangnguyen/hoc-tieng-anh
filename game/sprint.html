<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint trong công viên</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#4a3a26;
       background:#a9dcf0;user-select:none;-webkit-tap-highlight-color:transparent}

  /* nền: trời, đồi, đường — luôn ở dưới */
  #nen{position:absolute;inset:0;overflow:hidden;cursor:crosshair;z-index:0}
  #nen svg{position:absolute;left:0;top:0;width:100%;height:100%}

  /* vật thể có độ xa: xếp lớp bằng z-index */
  .vat{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:none;will-change:transform,width}
  .vat img{display:block;width:100%;height:auto}

  #chay{position:absolute;left:0;top:0;width:300px;transform-origin:50% 100%;
        will-change:transform,left,top;pointer-events:none}
  #sprite svg,#sprite img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 4px rgba(60,40,10,.14))}
  #bong{position:absolute;left:50%;bottom:0;width:78%;height:15px;transform:translateX(-50%);
        background:radial-gradient(ellipse at center,rgba(56,38,12,.30),rgba(56,38,12,0) 72%);
        border-radius:50%;z-index:-1}

  .gio{position:absolute;left:-14%;top:36%;width:36%;height:50%;z-index:1;opacity:0}
  .gio i{position:absolute;display:block;height:6px;border-radius:3px;background:#c9a877;opacity:0}
  .gio i:nth-child(1){top:8%;width:70%}
  .gio i:nth-child(2){top:34%;width:46%;left:-6%}
  .gio i:nth-child(3){top:62%;width:58%;left:4%}
  body.dang-chay .gio{opacity:1}
  body.dang-chay .gio i{animation:tan .62s linear infinite}
  body.dang-chay .gio i:nth-child(2){animation-delay:.16s}
  body.dang-chay .gio i:nth-child(3){animation-delay:.32s}
  @keyframes tan{0%{opacity:0;transform:translateX(8px)}35%{opacity:.5}100%{opacity:0;transform:translateX(-22px)}}

  .bui{position:absolute;left:2%;bottom:-1%;width:32%;height:50%;z-index:0}
  .bui span{position:absolute;bottom:0;border-radius:50%;background:#dcc79f;opacity:0}
  .bui span:nth-child(1){left:8%;width:13px;height:13px}
  .bui span:nth-child(2){left:20%;width:18px;height:18px}
  .bui span:nth-child(3){left:2%;width:9px;height:9px}
  body.dang-chay .bui span{animation:bui .8s ease-out infinite}
  body.dang-chay .bui span:nth-child(2){animation-delay:.22s}
  body.dang-chay .bui span:nth-child(3){animation-delay:.44s}
  @keyframes bui{0%{opacity:.45;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-34px,-12px) scale(1.5)}}

  .tieu-de{position:absolute;top:14px;left:18px;z-index:900;pointer-events:none;
            background:rgba(255,253,247,.82);border-radius:14px;padding:8px 14px;box-shadow:0 2px 10px rgba(80,60,20,.12)}
  .tieu-de b{font-size:18px;letter-spacing:.3px}
  .tieu-de p{margin:2px 0 0;font-size:12.5px;color:#7a6446}

  .dieu-khien{position:absolute;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:64vw;z-index:901}
  button{font:inherit;font-size:14px;padding:9px 13px;border-radius:11px;border:1px solid #e2c69b;
         background:rgba(255,253,247,.94);color:#5b4628;cursor:pointer;box-shadow:0 2px 0 #e6cfae}
  button:active{transform:translateY(1px);box-shadow:none}
  button.chinh{background:#fff1cf;border-color:#e0b46a}

  .ghi-chu{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11.5px;color:#3f5c28;
            z-index:902;text-shadow:0 1px 0 rgba(255,255,255,.55)}

  @media (max-width:760px){
    .dieu-khien{top:auto;bottom:24px;left:8px;right:8px;max-width:none;justify-content:center;gap:6px}
    button{font-size:12.5px;padding:10px 9px;border-radius:10px}
    .tieu-de{top:10px;left:10px;padding:6px 11px}
    .tieu-de b{font-size:15px}
    .tieu-de p{font-size:11px}
    .ghi-chu{display:none}
  }
</style>
</head>
<body>
  <div id="nen"></div>
  <div id="vat-the"></div>

  <div class="tieu-de"><b>Sprint</b><p>Chạm vào công viên để chó đi tới</p></div>

  <div class="dieu-khien">
    <button id="btnDi" class="chinh">Đi</button>
    <button id="btnChieu">Đổi chiều</button>
    <button id="btnNhanh">Tốc độ ×1</button>
    <button id="btnSua">Sủa</button>
    <button id="btnGiua">Ra giữa</button>
  </div>

  <div id="chay">
    <div class="gio"><i></i><i></i><i></i></div>
    <div id="bong"></div>
    <div id="sprite"></div>
    <div class="bui"><span></span><span></span><span></span></div>
  </div>

  <div class="ghi-chu">Đi lên = xa (nhỏ lại, bị cây và ghế che) · đi xuống = lại gần · phím mũi tên cũng đi được</div>

  <audio id="tiengSua" src="audio/sua.mp3" preload="auto"></audio>

<script>
(function(){
  var nen    = document.getElementById('nen');
  var khuVat = document.getElementById('vat-the');
  var sprite = document.getElementById('sprite');
  var chay   = document.getElementById('chay');
  var tieng  = document.getElementById('tiengSua');
  var KHUNG  = 6, NHIP = 130;

  // ---- hệ toạ độ 2,5 chiều ------------------------------------------------
  // wx: 0..1 theo bề ngang · wz: 0 = xa (chân trời), 1 = sát người xem
  var WXMIN = 0.04, WXMAX = 0.96, ZMIN = 0.02, ZMAX = 1.0;
  var Y0 = 0.60, Y1 = 0.94;

  // dùng kích thước khung nhìn CSS (ổn định hơn innerWidth/innerHeight trên điện thoại)
  function W(){ return document.documentElement.clientWidth; }
  function H(){ return document.documentElement.clientHeight; }
  function K(){ return Math.min(1.25, Math.max(0.62, W() / 1280)); }
  function doXa(z){ return 0.50 + 0.80 * z; }
  function toaDoY(z){ return H() * (Y0 + (Y1 - Y0) * z); }
  function zTuY(y){ return (y / H() - Y0) / (Y1 - Y0); }

  // ---- vật thể có độ xa ---------------------------------------------------
  var VAT = [
    {src:'vat-the/cay-le.svg',  wx:0.835, wz:0.574, base:391, rx:0.044, rz:0.038},
    {src:'vat-the/ghe-go.svg',  wx:0.290, wz:0.530, base:192, rx:0.090, rz:0.030},
    {src:'vat-the/bui-cay.svg', wx:0.559, wz:0.053, base:136, rx:0.050, rz:0.030}
  ];

  var x = 0, y = 0, tx = 0, ty = 0;
  var huong = 1, tocDo = 1, dangDi = false, tuDong = false, biKet = 0;
  var khung = 0, dem = 0, sua = 0, lanCuoi = 0;
  var tiLeHien = 0.8;                 // 0.8 khi đứng · 0.65 khi chạy
  var dsKhung = [];

  function hien(i){
    for(var k=0;k<dsKhung.length;k++) dsKhung[k].style.display = (k===i) ? '' : 'none';
  }
  function hienTen(ten){
    for(var k=0;k<dsKhung.length;k++)
      dsKhung[k].style.display = dsKhung[k].classList.contains(ten) ? '' : 'none';
  }
  function datNut(){
    document.getElementById('btnDi').textContent = tuDong ? 'Dừng' : 'Đi';
  }

  // vẽ vật thể: một lần, và mỗi khi đổi cỡ màn hình
  function datVat(){
    var k = K();
    for(var i=0;i<VAT.length;i++){
      var p = VAT[i];
      if(!p.el){
        p.el = document.createElement('div');
        p.el.className = 'vat';
        p.el.style.zIndex = Math.round(p.wz * 1000);
        var im = document.createElement('img');
        im.src = p.src; im.alt = '';
        p.el.appendChild(im);
        khuVat.appendChild(p.el);
      }
      p.el.style.width = (p.base * k * doXa(p.wz)).toFixed(1) + 'px';
      p.el.style.left  = (p.wx * W()).toFixed(1) + 'px';
      p.el.style.top   = toaDoY(p.wz).toFixed(1) + 'px';
      p.el.style.transform = 'translate(-50%,-100%)';
    }
  }

  // va chạm: ellipse trên mặt đất, chỉ tính khi cùng độ xa
  function biChan(px, pz){
    for(var i=0;i<VAT.length;i++){
      var p = VAT[i];
      var dx = (px / W() - p.wx) / p.rx, dz = (pz - p.wz) / p.rz;
      if(dx*dx + dz*dz < 1) return true;
    }
    return false;
  }

  function ve(){
    var s = doXa(zTuY(y));
    chay.style.width = (300 * K() * tiLeHien).toFixed(1) + 'px';
    chay.style.left = x.toFixed(1) + 'px';
    chay.style.top  = y.toFixed(1) + 'px';
    chay.style.transform = 'translate(-50%,-100%) scale(' + (s*huong).toFixed(3) + ',' + s.toFixed(3) + ')';
    chay.style.zIndex = Math.round(zTuY(y) * 1000);
  }

  function dayToiDa(){
    // trên điện thoại chừa chỗ cho hàng nút ở đáy
    return (W() <= 760) ? Math.min(toaDoY(ZMAX), H() - 96) : toaDoY(ZMAX);
  }
  function datDiem(px, py){
    var day = dayToiDa();
    tx = Math.min(W()*WXMAX, Math.max(W()*WXMIN, px));
    ty = Math.min(day, Math.max(toaDoY(ZMIN), py));
  }

  function buoc(ts){
    if(!lanCuoi) lanCuoi = ts;
    var dt = Math.min(60, ts - lanCuoi) / 1000;
    lanCuoi = ts;

    if(y > dayToiDa()){ y = dayToiDa(); }
    if(ty > dayToiDa()){ ty = dayToiDa(); }

    var dx = tx - x, dy = ty - y, d = Math.sqrt(dx*dx + dy*dy);
    var s = doXa(zTuY(y));
    var vanToc = (170 + 240*s) * tocDo;

    if(d > 3){
      var buocDi = Math.min(d, vanToc * dt);
      var nx = x + dx/d*buocDi, ny = y + dy/d*buocDi;
      if(!biChan(nx, zTuY(ny))){ x = nx; y = ny; biKet = 0; }
      else if(!biChan(nx, zTuY(y))){ x = nx; biKet = 0; }
      else if(!biChan(x, zTuY(ny))){ y = ny; biKet = 0; }
      else {
        if(biKet === 0){                 // vừa đụng: bật ngược lại một chút rồi dừng
          var lui = 18;
          x = Math.min(W()*WXMAX, Math.max(W()*WXMIN, x - dx/d*lui));
          y = Math.min(dayToiDa(), Math.max(toaDoY(ZMIN), y - dy/d*lui*0.8));
          tx = x; ty = y;
        }
        biKet += dt;
      }

      dangDi = (biKet < 0.25);
      if(Math.abs(dx) > 2) huong = dx > 0 ? 1 : -1;
      dem += dt * 1000 * tocDo;
      if(dem >= NHIP){ dem = 0; khung = (khung + 1) % KHUNG; }

      if(biKet > 0.25 && tuDong){
        huong = -huong; biKet = 0;
        datDiem(huong > 0 ? W()*WXMAX : W()*WXMIN, y);
      }
    } else {
      dangDi = false; biKet = 0;
      if(tuDong) datDiem(huong > 0 ? W()*WXMAX : W()*WXMIN, y);
    }

    var tiLeDich = dangDi ? 0.65 : 0.80;
    tiLeHien += (tiLeDich - tiLeHien) * Math.min(1, dt * 9);

    document.body.classList.toggle('dang-chay', dangDi);

    if(sua > 0){
      sua -= dt * 1000;
      if(dangDi) hien(khung);
      else hienTen((Math.floor((600 - sua) / 110) % 2) ? 'k8' : 'k7');
    } else if(dsKhung.length){
      if(dangDi) hien(khung); else hienTen('k7');
    }
    ve();
    requestAnimationFrame(buoc);
  }

  fetch('nen-cong-vien.svg').then(function(r){ return r.text(); }).then(function(txt){
    nen.innerHTML = txt;
    var svg = nen.querySelector('svg');
    if(svg){
      // innerHTML làm mất thuộc tính phân biệt hoa-thường → đặt lại để nền phủ kín màn hình
      svg.setAttribute('preserveAspectRatio','xMidYMid slice');
      svg.removeAttribute('width'); svg.removeAttribute('height');
    }
  }).catch(function(){});

  fetch('sprint-chay.svg').then(function(r){ return r.text(); }).then(function(txt){
    var doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
    var st = doc.querySelector('style'); if(st) st.remove();
    var svg = doc.documentElement;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    sprite.appendChild(document.importNode(svg, true));
    dsKhung = sprite.querySelectorAll('g.khung');
    for(var k=0;k<dsKhung.length;k++) dsKhung[k].style.animation = 'none';

    x = W()*0.30; y = Math.min(toaDoY(0.78), dayToiDa());
    datDiem(x, y);
    hienTen('k7'); ve();
  }).catch(function(){
    sprite.innerHTML = '<img src="sprint-chay.svg" alt="Sprint">';
  });

  function bam(e){
    var p = e.touches ? e.touches[0] : e;
    datDiem(p.clientX, p.clientY);
    tuDong = false; datNut();
  }
  nen.addEventListener('click', bam);
  nen.addEventListener('touchstart', function(e){ bam(e); }, {passive:true});

  document.addEventListener('keydown', function(e){
    var k = e.key, b = 0.07;
    if(k === 'ArrowUp' || k === 'w'){ datDiem(x, y - H()*b); tuDong = false; datNut(); e.preventDefault(); }
    if(k === 'ArrowDown' || k === 's'){ datDiem(x, y + H()*b); tuDong = false; datNut(); e.preventDefault(); }
    if(k === 'ArrowLeft' || k === 'a'){ datDiem(x - W()*b, y); tuDong = false; datNut(); e.preventDefault(); }
    if(k === 'ArrowRight' || k === 'd'){ datDiem(x + W()*b, y); tuDong = false; datNut(); e.preventDefault(); }
    if(k === ' '){ document.getElementById('btnSua').click(); e.preventDefault(); }
  });

  document.getElementById('btnDi').onclick = function(){
    tuDong = !tuDong;
    if(tuDong) datDiem((x < W()*0.5) ? W()*WXMAX : W()*WXMIN, y);
    else { tx = x; ty = y; }            // bấm Dừng là đứng lại ngay
    datNut();
  };

  document.getElementById('btnChieu').onclick = function(){
    huong = -huong;
    datDiem(x + huong * W()*0.12, y);
  };

  document.getElementById('btnNhanh').onclick = function(){
    var bac = [1, 1.8, 2.6], ten = ['×1','×1.8','×2.6'];
    var i = bac.indexOf(tocDo); i = (i + 1) % bac.length;
    tocDo = bac[i]; this.textContent = 'Tốc độ ' + ten[i];
  };

  document.getElementById('btnSua').onclick = function(){
    sua = 600;
    try{ tieng.currentTime = 0; tieng.play(); }catch(err){}
  };

  document.getElementById('btnGiua').onclick = function(){
    tuDong = false; datNut();
    datDiem(W()*0.5, toaDoY(0.72));
  };

  window.addEventListener('resize', function(){
    y = Math.min(toaDoY(ZMAX), Math.max(toaDoY(ZMIN), y));
    x = Math.min(W()*WXMAX, Math.max(W()*WXMIN, x));
    datDiem(x, y); datVat(); ve();
  });

  datVat();
  requestAnimationFrame(buoc);
})();
</script>
</body>
</html>
