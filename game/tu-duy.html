<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 5 · Tư duy — Học tiếng Anh dễ lắm</title>
<link rel="stylesheet" href="core.css">
<script src="core.js"></script>
<script src="ho-so.js"></script>
<style>
  :root{--blue:#1f6feb;--green:#16a34a;--red:#dc2626;--line:#e5e7eb;--dim:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f8fb;color:#111827}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
  h1{font-size:21px;margin:8px 0 2px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .cau{font-size:19px;line-height:1.55;margin:2px 0 14px}
  .cau u{text-decoration:none;border-bottom:2px dashed var(--blue);padding:0 22px;font-weight:700;color:var(--blue)}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);color:#111827;font-weight:600;padding:13px 14px;border-radius:12px;margin-bottom:9px;font-size:16px}
  .opt:hover{border-color:var(--blue)}
  .opt.dung{border-color:var(--green);background:#eafaf0}
  .opt.sai{border-color:var(--red);background:#fdeceb}
  .thanh{height:8px;background:#e9eef6;border-radius:6px;overflow:hidden;margin:4px 0 12px}
  .thanh>i{display:block;height:100%;background:#7c3aed;width:0;transition:width .25s}
  .hint{color:var(--dim);font-size:13.5px}
  .fb{font-size:15px;margin-top:6px;min-height:22px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
  /* thanh chọn sách/unit */
  .hs-hang{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
  .hs-hang label{font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:4px;font-weight:600}
  .hs-hang select,.hs-hang input{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:120px}
  .hs-hang input{width:130px;text-transform:uppercase}
  .hs-nhac{font-size:13px;color:#6b7280;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
  .hs-nhac.dung{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
  .hs-nhac.sai{color:#b45309;background:#fffbeb;border-color:#fde68a}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 Level 5 · Tư duy</h1>
  <p class="sub">Chọn sách và Unit con vừa học. Làm 8 câu: loại từ khác nhóm và chọn từ đúng điền vào câu.</p>

  <div class="card" style="margin-bottom:12px">
    <div id="hsBar"></div>
  </div>

  <div class="card" id="the">
    <div class="row" style="justify-content:space-between">
      <span class="hint" id="dem">Đang chuẩn bị…</span>
      <span class="hint" id="kieu"></span>
    </div>
    <div class="thanh"><i id="tiLe"></i></div>
    <div id="noiDung"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const xao = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chon1 = (a) => a[Math.floor(Math.random() * a.length)];

let SACH = "SM3", UNIT = 1, CAU = [], I = 0, DUNG = 0, BAR = null;

function tuCua(sach, unit) {
  const b = HS.bank(sach, unit);
  return b ? b.tu.filter((w) => /^[A-Za-z][A-Za-z' -]*$/.test(w)) : [];
}
function tuNoiKhac(sach, unit) {
  const ds = [];
  HS.sachCo().forEach((s) => HS.units(s).forEach((u) => {
    if (s === sach && Number(u) === Number(unit)) return;
    tuCua(s, u).forEach((w) => ds.push(w));
  }));
  return ds;
}

/* 1. Từ nào không thuộc Unit này */
function cauKhacNhom() {
  const tu = tuCua(SACH, UNIT);
  if (tu.length < 3) return null;
  const ba = xao(tu.slice()).slice(0, 3);
  const ngoai = xao(tuNoiKhac(SACH, UNIT)).find((w) => !tu.some((x) => x.toLowerCase() === w.toLowerCase()));
  if (!ngoai) return null;
  return {
    kieu: "Từ khác nhóm",
    hoi: `<b>Unit ${UNIT}</b> — từ nào <b>không thuộc</b> bài này?`,
    chon: xao([...ba, ngoai]),
    dapAn: ngoai,
    viSao: `“${ngoai}” không có trong Unit ${UNIT}${HS.bank(SACH, UNIT) && HS.bank(SACH, UNIT).ten ? " (" + HS.bank(SACH, UNIT).ten + ")" : ""}.`,
  };
}

/* 2. Điền từ vào câu mẫu của unit */
function cauDienTu() {
  const b = HS.bank(SACH, UNIT);
  if (!b) return null;
  const cauDS = (b.cau || []).filter((c) => c.length < 110);
  const tu = tuCua(SACH, UNIT).filter((w) => w.indexOf(" ") < 0);
  if (!cauDS.length || tu.length < 3) return null;
  for (let lan = 0; lan < 30; lan++) {
    const cau = chon1(cauDS);
    const tuTrongCau = cau.split(/\s+/);
    const vitri = [];
    tuTrongCau.forEach((t, i) => {
      const s = t.replace(/[^A-Za-z']/g, "").toLowerCase();
      if (s && tu.some((w) => w.toLowerCase() === s)) vitri.push(i);
    });
    if (!vitri.length) continue;
    const i = chon1(vitri);
    const dung = tuTrongCau[i].replace(/[^A-Za-z']/g, "");
    let nhieu = tu.filter((w) => w.toLowerCase() !== dung.toLowerCase());
    if (nhieu.length < 3) continue;
    nhieu = xao(nhieu).slice(0, 3);
    const hien = tuTrongCau.slice();
    hien[i] = "<u>____</u>";
    return {
      kieu: "Điền từ vào câu",
      hoi: hien.join(" "),
      chon: xao([dung, ...nhieu]),
      dapAn: dung,
      viSao: `Câu đầy đủ: “${cau}”`,
    };
  }
  return null;
}

function taoBoCau() {
  const ds = [], daCo = new Set();
  const them = (c) => {
    if (!c) return;
    const k = c.hoi + "|" + c.dapAn;
    if (daCo.has(k)) return;
    daCo.add(k); ds.push(c);
  };
  for (let lan = 0; lan < 60 && ds.length < 8; lan++) {
    them(lan % 2 === 0 ? cauKhacNhom() : cauDienTu());
  }
  return xao(ds).slice(0, 8);
}

function veCau() {
  if (I >= CAU.length) return ketThuc();
  const c = CAU[I];
  $("#dem").textContent = `Câu ${I + 1}/${CAU.length}`;
  $("#kieu").textContent = c.kieu;
  $("#tiLe").style.width = Math.round((I / CAU.length) * 100) + "%";
  $("#noiDung").innerHTML = `
    <div class="cau">${c.hoi}</div>
    ${c.chon.map((x) => `<button class="opt" data-x="${esc(x)}">${esc(x)}</button>`).join("")}
    <div class="fb" id="fb"></div>`;
  $("#noiDung").querySelectorAll(".opt").forEach((b) => { b.onclick = () => chon(b, b.dataset.x === c.dapAn, c); });
}

function chon(btn, dung, c) {
  $("#noiDung").querySelectorAll(".opt").forEach((b) => { b.disabled = true; if (b.dataset.x === c.dapAn) b.classList.add("dung"); });
  if (!dung) btn.classList.add("sai");
  $("#fb").innerHTML = (dung ? "✅ Đúng! " : "❌ Chưa đúng. ") + `<span class="hint">${esc(c.viSao)}</span>`;
  if (dung) DUNG++;
  try { GAME.ghi({ tu: c.dapAn, ok: dung }); } catch (e) {}
  I++;
  setTimeout(() => { if (I >= CAU.length) ketThuc(); else veCau(); }, dung ? 900 : 2000);
}

async function ketThuc() {
  $("#tiLe").style.width = "100%";
  $("#dem").textContent = `Xong ${CAU.length} câu`;
  $("#noiDung").innerHTML = `<div class="hint">Đang ghi kết quả…</div>`;
  if (HS.khopBai() !== false) { try { await GAME.ketThuc(); } catch (e) {} }
  const dat = DUNG >= Math.ceil(CAU.length * 0.6);
  const khop = HS.khopBai();
  const loiNhac = khop === false
    ? "Con đang chơi khác Unit đang học nên lần này <b>không cộng điểm</b>. Chọn đúng Unit ở trên rồi làm lại nhé."
    : (khop === null ? "Chưa xác định được bài đang học — điểm được tính theo Unit con đã chọn." : "Đúng bài đang học — điểm đã cộng.");
  $("#noiDung").innerHTML = `
    <div style="font-size:18px;font-weight:700;margin-bottom:6px">Level 5 hoàn tất: đúng ${DUNG}/${CAU.length}</div>
    <div class="hint" style="margin-bottom:12px">${dat ? loiNhac : "Chưa đạt 60% — làm lại để lấy điểm nấc này nhé."}</div>
    <div class="row">
      <button class="ghost" id="lai">Làm bộ khác</button>
      <button class="ghost" id="doi">Đổi Unit</button>
      <button class="ghost" id="ve">Về sảnh game</button>
    </div>`;
  if (dat) { try { GAME.phaoHoa(5); } catch (e) {} }
  $("#lai").onclick = () => batDauLai();
  $("#doi").onclick = () => location.reload();
  $("#ve").onclick = () => { location.href = "sanh.html"; };
}

function batDauLai() {
  CAU = taoBoCau();
  I = 0; DUNG = 0;
  if (!CAU.length) {
    $("#noiDung").innerHTML = '<div class="hint">Unit này chưa đủ từ để làm câu đố. Chọn Unit khác nhé.</div>';
    return;
  }
  try {
    GAME.batDau({ game: "tu-duy", sach: SACH, unit: UNIT, soCau: CAU.length, nac: 5, khoaNac: true });
    const c = document.querySelector(".gcore-nac"); if (c) c.value = "5";
  } catch (e) {}
  veCau();
}

(async () => {
  await HS.nap();
  BAR = HS.thanh($("#hsBar"), { onChange: (s, u) => { SACH = s; UNIT = u; batDauLai(); } });
  SACH = BAR.sach(); UNIT = BAR.unit();
  const c = HS.chonTruoc(); if (c.sach) { SACH = c.sach; UNIT = c.unit; }
  batDauLai();
})();
</script>
</body>
</html>
