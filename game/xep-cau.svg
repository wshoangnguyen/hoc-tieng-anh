<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Máy xếp câu">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffd07a"/>
      <stop offset="42%" stop-color="#fba53c"/>
      <stop offset="100%" stop-color="#ef7d22"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="70%" stop-color="#fff4e0"/>
      <stop offset="100%" stop-color="#f6e3c4"/>
    </linearGradient>
    <linearGradient id="vang" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="35%" stop-color="#ffcf4d"/>
      <stop offset="100%" stop-color="#e39a09"/>
    </linearGradient>
    <linearGradient id="hong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d8a"/>
      <stop offset="100%" stop-color="#dc5340"/>
    </linearGradient>
    <linearGradient id="xanh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd8c4"/>
      <stop offset="100%" stop-color="#2f9b7e"/>
    </linearGradient>
    <linearGradient id="tim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9b6f5"/>
      <stop offset="100%" stop-color="#5a6ad4"/>
    </linearGradient>
    <radialGradient id="sang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bong" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.5" flood-color="#8a4310" flood-opacity=".4"/>
    </filter>
    <filter id="bongNho" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#8a4310" flood-opacity=".35"/>
    </filter>
    <filter id="mem" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <clipPath id="catThe"><rect x="3" y="3" width="90" height="90" rx="23"/></clipPath>
    <clipPath id="catSlot1"><rect x="13" y="15" width="19" height="54" rx="8"/></clipPath>
    <clipPath id="catSlot2"><rect x="38" y="15" width="19" height="54" rx="8"/></clipPath>
    <clipPath id="catSlot3"><rect x="63" y="15" width="19" height="54" rx="8"/></clipPath>
  </defs>

  <!-- nền cam -->
  <rect x="3" y="3" width="90" height="90" rx="23" fill="url(#bg)"/>
  <g clip-path="url(#catThe)">
    <ellipse cx="30" cy="10" rx="38" ry="18" fill="url(#sang)" filter="url(#mem)"/>
    <ellipse cx="70" cy="96" rx="34" ry="16" fill="#8a3f0c" opacity=".28" filter="url(#mem)"/>
  </g>
  <rect x="4.2" y="4.2" width="87.6" height="87.6" rx="22" fill="none" stroke="#fff3d8" stroke-width="1.2" opacity=".5"/>

  <!-- ba ống chứa từ -->
  <g filter="url(#bongNho)">
    <rect x="13" y="15" width="19" height="54" rx="8" fill="url(#slot)"/>
    <rect x="38" y="15" width="19" height="54" rx="8" fill="url(#slot)"/>
    <rect x="63" y="15" width="19" height="54" rx="8" fill="url(#slot)"/>
  </g>

  <!-- các khối từ bên trong -->
  <g clip-path="url(#catSlot1)">
    <rect x="16.5" y="19.0" width="12" height="7.5" rx="3" fill="url(#hong)"/>
    <rect x="16.5" y="28.6" width="12" height="7.5" rx="3" fill="url(#xanh)"/>
    <rect x="16.5" y="38.1" width="12" height="7.5" rx="3" fill="url(#tim)"/>
    <rect x="16.5" y="47.7" width="12" height="7.5" rx="3" fill="#c9b795" opacity=".65"/>
    <rect x="16.5" y="57.3" width="12" height="7.5" rx="3" fill="#c9b795" opacity=".35"/>
  </g>
  <g clip-path="url(#catSlot2)">
    <rect x="41.5" y="23.4" width="12" height="7.5" rx="3" fill="#c9b795" opacity=".45"/>
    <rect x="41.5" y="32.9" width="12" height="7.5" rx="3" fill="url(#vang)"/>
    <rect x="41.5" y="42.5" width="12" height="7.5" rx="3" fill="url(#hong)"/>
    <rect x="41.5" y="52.1" width="12" height="7.5" rx="3" fill="url(#xanh)"/>
  </g>
  <g clip-path="url(#catSlot3)">
    <rect x="66.5" y="19.0" width="12" height="7.5" rx="3" fill="url(#tim)"/>
    <rect x="66.5" y="28.6" width="12" height="7.5" rx="3" fill="#c9b795" opacity=".4"/>
    <rect x="66.5" y="38.1" width="12" height="7.5" rx="3" fill="url(#hong)"/>
    <rect x="66.5" y="47.7" width="12" height="7.5" rx="3" fill="url(#vang)"/>
  </g>

  <!-- khối vàng bật ra, đang được xếp vào câu -->
  <g transform="rotate(-3.5 50 78)" filter="url(#bong)">
    <rect x="26" y="72.5" width="44" height="11.5" rx="5.2" fill="url(#vang)" stroke="#c98704" stroke-width=".7"/>
    <rect x="27.8" y="74" width="40.4" height="3.6" rx="1.8" fill="#fffbe8" opacity=".72"/>
    <rect x="27.8" y="81.4" width="40.4" height="1.6" rx=".8" fill="#a96c02" opacity=".3"/>
  </g>

  <!-- tia -->
  <g fill="#fff3c9">
    <path d="M86 12l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" opacity=".9"/>
  </g>
</svg>
