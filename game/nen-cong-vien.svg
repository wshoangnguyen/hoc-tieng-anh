    <g><circle cx="500" cy="450" r="28"/><circle cx="536" cy="442" r="32"/><circle cx="572" cy="454" r="24"/></g>
    <g><circle cx="828" cy="448" r="24"/><circle cx="860" cy="440" r="28"/><circle cx="892" cy="452" r="20"/></g>
    <g><circle cx="1178" cy="450" r="28"/><circle cx="1214" cy="442" r="32"/><circle cx="1250" cy="454" r="24"/></g>
