  <g class="dieu">
    <path d="M390 70 L438 120 L390 190 L342 120 Z" fill="#E4572E"/>
    <path d="M390 70 L438 120 L390 120 Z" fill="#F2C14E"/>
    <path d="M390 120 L438 120 L390 190 Z" fill="#3D7EA6"/>
    <path d="M390 70 L390 120 L342 120 Z" fill="#F2C14E" opacity=".92"/>
    <path d="M390 190 C 402 226 366 244 382 278 C 396 308 360 322 374 352" fill="none" stroke="#7A5C3E" stroke-width="3" stroke-linecap="round"/>
    <path d="M394 210 l 13 -7 l 3 15 z" fill="#E4572E"/>
    <path d="M374 258 l 13 -7 l 3 15 z" fill="#F2C14E"/>
    <path d="M378 310 l 13 -7 l 3 15 z" fill="#3D7EA6"/>
