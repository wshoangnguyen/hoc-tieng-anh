<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Công viên: trời xanh, mây trôi, đồi cỏ, đường đất uốn, cây lê, ghế gỗ">
  <defs>
    <linearGradient id="troi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78C2E8"/>
      <stop offset="58%" stop-color="#A6DAF0"/>
      <stop offset="100%" stop-color="#DDF2F8"/>
    </linearGradient>
    <linearGradient id="coXa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BCE294"/><stop offset="100%" stop-color="#A6D478"/>
    </linearGradient>
    <linearGradient id="coGiua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD06C"/><stop offset="100%" stop-color="#89C45B"/>
    </linearGradient>
    <linearGradient id="coGan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84C257"/><stop offset="100%" stop-color="#6BAA43"/>
    </linearGradient>
    <linearGradient id="duong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DEB8"/><stop offset="100%" stop-color="#D9BD8C"/>
    </linearGradient>
    <linearGradient id="than" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4E2E"/><stop offset="40%" stop-color="#94603B"/><stop offset="100%" stop-color="#5F3A22"/>
    </linearGradient>
    <radialGradient id="nang" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8D2" stop-opacity=".85"/><stop offset="100%" stop-color="#FFF8D2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m1{animation:troi 130s linear infinite}
      .m2{animation:troi 92s linear infinite;animation-delay:-34s}
      .m3{animation:troi 70s linear infinite;animation-delay:-52s}
      .m4{animation:troi 165s linear infinite;animation-delay:-96s}
      .dieu{animation:luon 5.5s ease-in-out infinite;transform-origin:390px 120px}
      @keyframes troi{from{transform:translateX(-470px)}to{transform:translateX(2070px)}}
      @keyframes luon{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(7px,-11px) rotate(3deg)}}
      @media (prefers-reduced-motion: reduce){.m1,.m2,.m3,.m4,.dieu{animation:none}}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#troi)"/>
  <circle cx="1430" cy="86" r="150" fill="url(#nang)"/>
  <circle cx="1430" cy="86" r="96" fill="#FFF6C6" opacity=".55"/><circle cx="1430" cy="86" r="46" fill="#FFF6C6" opacity=".8"/>

  <!-- ===== mây (khung ngoài giữ vị trí, khung trong chạy ngang) ===== -->
  <g transform="translate(300,150) scale(1.1)"><g class="m1" fill="#FFFFFF">
    <ellipse cx="0" cy="30" rx="88" ry="20" fill="#D9EDF7"/>
    <circle cx="-50" cy="2" r="36"/><circle cx="-4" cy="-20" r="46"/><circle cx="44" cy="-6" r="38"/>
    <circle cx="74" cy="14" r="26"/><circle cx="-82" cy="16" r="24"/>
    <rect x="-94" y="6" width="180" height="32" rx="16"/>
  </g></g>

  <g transform="translate(60,268) scale(.8)"><g class="m2" fill="#FFFFFF">
    <ellipse cx="0" cy="26" rx="80" ry="17" fill="#D9EDF7"/>
    <circle cx="-42" cy="0" r="30"/><circle cx="0" cy="-16" r="38"/><circle cx="40" cy="-2" r="30"/>
    <rect x="-76" y="6" width="150" height="26" rx="13"/>
  </g></g>

  <g transform="translate(120,84) scale(.62)"><g class="m3" fill="#FFFFFF">
    <ellipse cx="0" cy="22" rx="74" ry="15" fill="#D9EDF7"/>
    <circle cx="-34" cy="0" r="26"/><circle cx="2" cy="-15" r="34"/><circle cx="36" cy="-2" r="26"/>
    <rect x="-66" y="6" width="132" height="24" rx="12"/>
