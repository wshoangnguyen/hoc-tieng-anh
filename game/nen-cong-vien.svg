  <g transform="translate(700,320) scale(.55)"><g class="m4" fill="#FFFFFF">
    <ellipse cx="0" cy="20" rx="70" ry="14" fill="#D9EDF7"/>
    <circle cx="-28" cy="0" r="23"/><circle cx="6" cy="-13" r="30"/><circle cx="36" cy="0" r="22"/>
    <rect x="-58" y="6" width="118" height="22" rx="11"/>
  </g></g>

