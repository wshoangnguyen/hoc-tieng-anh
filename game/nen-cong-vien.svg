  <path d="M280 900 C 380 782 618 662 878 524" fill="none" stroke="#CDB183" stroke-width="3.5" opacity=".65"/>
  <path d="M984 524 C 764 654 560 792 700 900" fill="none" stroke="#CDB183" stroke-width="3.5" opacity=".35"/>
