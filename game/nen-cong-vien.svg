    <g transform="translate(632,714)"><circle r="6.5" fill="#FFFFFF"/><circle cx="9" cy="6" r="6.5" fill="#FFFFFF"/><circle cx="-9" cy="6" r="6.5" fill="#FFFFFF"/><circle cx="0" cy="-9" r="6.5" fill="#FFFFFF"/><circle r="3.6" fill="#FFD166"/></g>
    <g transform="translate(946,676)"><circle r="7.5" fill="#FFD166"/><circle cx="10" cy="6" r="7.5" fill="#FFD166"/><circle cx="-10" cy="6" r="7.5" fill="#FFD166"/><circle cx="0" cy="-10" r="7.5" fill="#FFD166"/><circle r="4.2" fill="#F08A3C"/></g>
    <g transform="translate(274,728)"><circle r="6.5" fill="#FF8FA3"/><circle cx="9" cy="6" r="6.5" fill="#FF8FA3"/><circle cx="-9" cy="6" r="6.5" fill="#FF8FA3"/><circle cx="0" cy="-9" r="6.5" fill="#FF8FA3"/><circle r="3.6" fill="#FFD166"/></g>
    <g transform="translate(1164,726)"><circle r="7" fill="#FFFFFF"/><circle cx="10" cy="6" r="7" fill="#FFFFFF"/><circle cx="-10" cy="6" r="7" fill="#FFFFFF"/><circle cx="0" cy="-10" r="7" fill="#FFFFFF"/><circle r="3.8" fill="#FFD166"/></g>
    <g transform="translate(1460,694)"><circle r="6.5" fill="#FFB0C4"/><circle cx="9" cy="6" r="6.5" fill="#FFB0C4"/><circle cx="-9" cy="6" r="6.5" fill="#FFB0C4"/><circle cx="0" cy="-9" r="6.5" fill="#FFB0C4"/><circle r="3.6" fill="#FFD166"/></g>
