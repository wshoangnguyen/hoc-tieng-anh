<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chó đuổi — gọi tên học viên</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#4a3a26;
       background:#a9dcf0;user-select:none;-webkit-tap-highlight-color:transparent}

  #nen{position:absolute;inset:0;overflow:hidden;z-index:0}
  #nen svg{position:absolute;left:0;top:0;width:100%;height:100%}

  .vat{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:none;will-change:transform}
  .vat img{display:block;width:100%;height:auto}

  .nguoi{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:none;will-change:transform}
  .nguoi .sp{height:100%;width:auto}
  .nguoi .sp svg{display:block;height:100%;width:auto;filter:drop-shadow(0 4px 3px rgba(60,40,10,.16))}
  .nguoi .bong{position:absolute;left:50%;bottom:-2px;width:64%;height:9px;transform:translateX(-50%);
        background:radial-gradient(ellipse at center,rgba(56,38,12,.26),rgba(56,38,12,0) 72%);border-radius:50%;z-index:-1}
  .ten{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:1px;
       font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;padding:2px 8px;border-radius:9px;
       background:rgba(60,44,20,.72);text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .nguoi.bi-bat .ten{background:#d8602f;box-shadow:0 0 0 3px rgba(255,255,255,.65)}
  .nguoi.bi-bat .sp{animation:nghieng .45s ease-in-out}
  @keyframes nghieng{0%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}100%{transform:rotate(0)}}

  #dog{position:absolute;left:0;top:0;width:240px;transform-origin:50% 100%;
       will-change:transform,left,top;pointer-events:none}
  #sprite svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 4px rgba(60,40,10,.14))}
  #bong2{position:absolute;left:50%;bottom:0;width:74%;height:13px;transform:translateX(-50%);
        background:radial-gradient(ellipse at center,rgba(56,38,12,.28),rgba(56,38,12,0) 72%);border-radius:50%;z-index:-1}

  .tieu-de{position:absolute;top:12px;left:14px;z-index:900;pointer-events:none;
            background:rgba(255,253,247,.85);border-radius:14px;padding:8px 14px;box-shadow:0 2px 10px rgba(80,60,20,.14)}
  #logoGoc{position:absolute;top:54px;right:12px;z-index:890;pointer-events:none;
           background:#fff;border-radius:12px;padding:4px 8px;box-shadow:0 3px 10px rgba(60,40,10,.18);opacity:.95}
  #logoGoc img{display:block;width:126px;height:auto}
  .tieu-de b{font-size:17px}
  .tieu-de p{margin:2px 0 0;font-size:12.5px;color:#7a6446}

  .dieu-khien{position:absolute;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;
              justify-content:flex-end;max-width:62vw;z-index:901}
  button{font:inherit;font-size:14px;padding:9px 13px;border-radius:11px;border:1px solid #e2c69b;
         background:rgba(255,253,247,.94);color:#5b4628;cursor:pointer;box-shadow:0 2px 0 #e6cfae}
  button:active{transform:translateY(1px);box-shadow:none}
  button.chinh{background:#fff1cf;border-color:#e0b46a}

  #banner{position:absolute;left:50%;top:15%;transform:translate(-50%,-8px) scale(.94);z-index:950;
          background:rgba(255,252,243,.96);border:3px solid #f0c873;border-radius:20px;
          padding:13px 26px;text-align:center;box-shadow:0 10px 30px rgba(90,60,10,.22);
          opacity:0;pointer-events:none;transition:.28s}
  #banner.hien{opacity:1;transform:translate(-50%,0) scale(1)}
  #banner .nho{font-size:13px;color:#a07a3c;letter-spacing:.4px}
  #banner .to{font-size:33px;font-weight:800;color:#c4602a;line-height:1.1;margin:2px 0 3px}
  #banner .cuoi{font-size:13px;color:#8a6a44}

  #hopTen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:960;
          background:rgba(255,253,247,.98);border-radius:18px;padding:16px 18px;width:min(430px,92vw);
          box-shadow:0 16px 44px rgba(60,40,10,.28);display:none;max-height:88vh;overflow:auto}
  #hopTen.mo{display:block}
  #hopTen h3{margin:0 0 10px;font-size:16px}
  #hopTen .luoi{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  #hopTen label{display:block;font-size:12px;color:#7a6446;margin:0 0 2px}
  #hopTen input{width:100%;font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid #e2c69b;
                border-radius:9px;background:#fffdf8;color:#4a3a26}
  #hopTen .dong{margin:0 0 8px}
  #hopTen .hang{display:flex;gap:6px;align-items:center}
  #hopTen .hang input{flex:1}
  #hopTen .xoa{flex:0 0 auto;width:34px;padding:7px 0;font-size:13px;line-height:1;
               background:#fde8e4;color:#b4452f;border:1px solid #f3c3b8;border-radius:9px}
  #hopTen .gioi{flex:0 0 auto;width:36px;padding:6px 0;font-size:15px;line-height:1;
                background:#eef6ff;border:1px solid #c8ddf3;border-radius:9px;cursor:pointer}
  #hopTen .thay-dong{grid-column:1/-1;margin:8px 0 0;padding-top:12px;border-top:1px dashed #e6d5b6}
  #hopTen .thay-dong .chon{display:flex;align-items:center;gap:7px;font-size:13.5px;color:#5c4a30;
                font-weight:600;margin-bottom:6px;cursor:pointer}
  #hopTen .thay-dong input[type=checkbox]{width:17px;height:17px;accent-color:#c98a2b}
  #hopTen .xoa:disabled{opacity:.35}
  #hopTen .them{grid-column:1/-1;width:100%;margin:6px 0 0;padding:9px 0;border:1px dashed #d9bd8e;
                background:#fffaf0;color:#8a6a3c;font-weight:600}
  #hopTen .them:disabled{opacity:.4}
  #hopTen .ghi{grid-column:1/-1;font-size:11px;color:#96794f;margin-top:8px;text-align:center}
  #hopTen .nut{display:flex;gap:8px;margin-top:12px}
  #hopTen .nut button{flex:1}

  @media (max-width:760px){
    .dieu-khien{top:auto;bottom:16px;left:8px;right:8px;max-width:none;justify-content:center;gap:6px}
    button{font-size:12.5px;padding:10px 10px}
    .tieu-de{top:8px;left:8px;padding:6px 11px}
    #logoGoc{top:8px;right:8px;padding:3px 6px;border-radius:10px}
    #logoGoc img{width:86px}
    .tieu-de b{font-size:13.5px} .tieu-de p{font-size:10.5px}
    .ten{font-size:11px;padding:2px 6px}
    #banner{padding:10px 14px;max-width:86vw}
    #banner .to{font-size:22px} #banner .nhan{font-size:10px} #banner .nho{font-size:11px}
    #banner .to span{font-size:26px}
    #hopTen .luoi{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <div id="nen"></div>
  <div id="logoGoc"><img src="../logo.png" alt="Học Tiếng Anh Dễ Làm"></div>
  <div id="vat-the"></div>

  <div class="tieu-de"><b>Chó đuổi — gọi tên</b><p>Các bạn chạy trốn, chó vừa chạy vừa sủa</p></div>

  <div class="dieu-khien">
    <button id="btnDuoi" class="chinh">Bắt đầu đuổi</button>
    <button id="btnTen">Đổi tên</button>
  </div>

  <div id="banner"><div class="nho">CHÓ ĐÃ BẮT ĐƯỢC</div><div class="to" id="bTen">—</div>
    <div class="cuoi">Mời bạn đứng lên trả lời nhé!</div></div>

  <div id="hopTen">
    <h3>Tên các bạn trong lớp</h3>
    <div class="luoi" id="luoiTen"></div>
    <div class="nut"><button id="btnLuu" class="chinh">Lưu</button><button id="btnHuy">Đóng</button></div>
  </div>

  <div id="dog"><div id="bong2"></div><div id="sprite"></div></div>

  <audio id="tiengSua" src="audio/sua.mp3" preload="auto"></audio>

<script>
(function(){
  var nen=document.getElementById('nen'), khuVat=document.getElementById('vat-the');
  var dog=document.getElementById('dog'), sprite=document.getElementById('sprite');
  var tieng=document.getElementById('tiengSua');

  var WXMIN=0.05, WXMAX=0.95, ZMIN=0.30, ZMAX=0.97, Y0=0.60, Y1=0.94;
  function W(){ return document.documentElement.clientWidth; }
  function H(){ return document.documentElement.clientHeight; }
  function K(){ return Math.min(1.25, Math.max(0.62, W()/1280)); }
  function doXa(z){ return 0.50 + 0.80*z; }
  function toaDoY(z){ return H()*(Y0+(Y1-Y0)*z); }
  function zTuY(y){ return (y/H()-Y0)/(Y1-Y0); }
  function dayToiDa(){ return (W()<=760) ? Math.min(toaDoY(ZMAX), H()-104) : toaDoY(ZMAX); }

  var VAT=[
    {src:'vat-the/cay-le.svg', wx:0.835, wz:0.574, base:391, rx:0.044, rz:0.038},
    {src:'vat-the/ghe-go.svg', wx:0.290, wz:0.530, base:192, rx:0.090, rz:0.030},
    {src:'vat-the/bui-cay.svg', wx:0.559, wz:0.053, base:136, rx:0.050, rz:0.030}
  ];
  function biChan(px,pz){
    for(var i=0;i<VAT.length;i++){
      var p=VAT[i], dx=(px/W()-p.wx)/p.rx, dz=(pz-p.wz)/p.rz;
      if(dx*dx+dz*dz<1) return true;
    }
    return false;
  }
  function datVat(){
    var k=K();
    for(var i=0;i<VAT.length;i++){
      var p=VAT[i];
      if(!p.el){
        p.el=document.createElement('div'); p.el.className='vat';
        p.el.style.zIndex=Math.round(p.wz*1000);
        var im=document.createElement('img'); im.src=p.src; im.alt='';
        p.el.appendChild(im); khuVat.appendChild(p.el);
      }
      p.el.style.width=(p.base*k*doXa(p.wz)).toFixed(1)+'px';
      p.el.style.left=(p.wx*W()).toFixed(1)+'px';
      p.el.style.top=toaDoY(p.wz).toFixed(1)+'px';
      p.el.style.transform='translate(-50%,-100%)';
    }
  }

  // ---------- 6 bạn nhỏ (3 trai + 3 gái) ----------
  var TEN_MAC_DINH=['Bạn 1','Bạn 2','Bạn 3','Bạn 4','Bạn 5','Bạn 6'];
  var SRC_NAM=['vat-the/tre1.svg','vat-the/tre2.svg','vat-the/tre3.svg'];
  var SRC_NU=['vat-the/nu1.svg','vat-the/nu2.svg','vat-the/nu3.svg'];
  var SRC_THAY_NAM='vat-the/thay.svg', SRC_THAY_NU='vat-the/co-giao.svg';
  var TOI_DA=6, TOI_THIEU=2, tuLop=false;
  var thamSo=new URLSearchParams(location.search);
  var dsBe=[], coThay=true, thayNu=true, tenThay='Teacher';

  (function napDuLieu(){
    var cu=null;
    try{ cu=JSON.parse(localStorage.getItem('ds-be')||'null'); }catch(e){}
    if(cu && cu.ds && cu.ds.length){
      dsBe=cu.ds.slice(0,TOI_DA).map(function(x){return {ten:String(x.ten||'Bạn'), nu:!!x.nu};});
      coThay=(typeof cu.thay==='boolean')?cu.thay:true;
      thayNu=(typeof cu.thayNu==='boolean')?cu.thayNu:true;
    } else {
      var t0=null, n0=6;
      try{ t0=JSON.parse(localStorage.getItem('ten-be')||'null'); }catch(e){}
      n0=parseInt(localStorage.getItem('so-be')||'6',10); if(!(n0>=TOI_THIEU&&n0<=TOI_DA)) n0=6;
      for(var i=0;i<n0;i++) dsBe.push({ten:(t0&&t0[i])||TEN_MAC_DINH[i], nu:(i%2===1)});
    }
    if(thamSo.get('ten')){
      var t1=thamSo.get('ten').split('|').map(function(x){return x.trim();}).filter(Boolean).slice(0,TOI_DA);
      if(t1.length>=1){
        dsBe=t1.map(function(v,i){return {ten:v, nu:(i%2===1)};});
        if(dsBe.length<TOI_THIEU) dsBe.push({ten:TEN_MAC_DINH[1], nu:true});
        tuLop=true;
      }
    }
    if(thamSo.has('thay')){
      var gt=(thamSo.get('thay')||'').toLowerCase();
      coThay = gt!=='0';
      thayNu = gt!=='thay';                 // 'thay' = thầy nam, còn lại là cô giáo
    }
    if(dsBe.length<TOI_THIEU){ dsBe=[]; for(var j=0;j<TOI_THIEU;j++) dsBe.push({ten:TEN_MAC_DINH[j], nu:j===1}); }
  })();

  var BE=[], CAO_BE=128;

  function taoBe(i,src,tenBe,laThay){
    var d=document.createElement('div'); d.className='nguoi'+(laThay?' la-thay':'');
    d.innerHTML='<div class="bong"></div><span class="ten"></span><div class="sp"></div>';
    khuVat.appendChild(d);
    var o={i:i, el:d, sp:d.querySelector('.sp'), nhan:d.querySelector('.ten'),
           ten:tenBe, laThay:!!laThay, src:src,
           frames:[], khung:0, dem:0, x:0,y:0,tx:0,ty:0,huong:1,cho:0,biBat:false,vx:0,vy:0,quay:0,hetQuay:0,chan:0};
    o.nhan.textContent=tenBe;
    BE.push(o);
    return fetch(src).then(function(r){return r.text();}).then(function(txt){
      var doc=new DOMParser().parseFromString(txt,'image/svg+xml');
      var svg=doc.documentElement;
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      o.sp.appendChild(document.importNode(svg,true));
      o.frames=o.sp.querySelectorAll('g.khung');
    }).catch(function(){});
  }

  function hienKhung(o,k){
    if(o.khung===k && o.frames.length) return;
    o.khung=k;
    for(var i=0;i<o.frames.length;i++) o.frames[i].style.display=(i===k)?'':'none';
  }
  function mucTieuMoi(o){
    o.tx=W()*(WXMIN+0.06+Math.random()*(WXMAX-WXMIN-0.12));
    o.ty=toaDoY(ZMIN+0.06+Math.random()*(ZMAX-ZMIN-0.12));
    o.cho=performance.now()+1400+Math.random()*2200;
  }
  function veBe(o){
    var z=zTuY(o.y), s=doXa(z)*o.huong;
    o.el.style.height=(CAO_BE*(o.laThay?1.28:1)*K()*doXa(z)*Math.min(1,Math.max(0.62,W()/880))).toFixed(1)+'px';
    o.el.style.left=o.x.toFixed(1)+'px';
    o.el.style.top=o.y.toFixed(1)+'px';
    o.el.style.transform='translate(-50%,-100%) scale('+s.toFixed(3)+',1)';
    o.el.style.zIndex=Math.round(z*1000);
    o.nhan.style.transform='translateX(-50%) scaleX('+(o.huong<0?-1:1)+')';
  }

  // mỗi bạn chọn MỘT điểm đến rồi đi tới đó (không cộng lực từng khung -> không lắc)
  function diemTrongBien(x,y){
    return [Math.min(W()*WXMAX, Math.max(W()*WXMIN, x)),
            Math.min(dayToiDa()-6, Math.max(toaDoY(ZMIN)+10, y))];
  }
  function chonDiem(o,ts){
    var dDog=Math.sqrt((o.x-cx)*(o.x-cx)+(o.y-cy)*(o.y-cy))||1;
    var dangDuoi=(trangThai==='duoi'||trangThai==='tangtoc');
    var tot=null, diem=-1e9;
    for(var thu=0;thu<10;thu++){
      var x,y;
      if(o.quay){                                  // quay lại phía chó một đoạn ngắn
        var lx=Math.min(115,W()*0.10), ly=Math.min(75,H()*0.09);
        x=o.x+(cx-o.x)/dDog*lx; y=o.y+(cy-o.y)/dDog*ly;
      } else if(dangDuoi && dDog<340){             // chạy ngược hướng chó
        var ux=(o.x-cx)/dDog, uy=(o.y-cy)/dDog;
        var lech=(o.i-2.5)*0.42+(Math.random()-0.5)*0.5;
        var ca=Math.cos(lech), sa=Math.sin(lech);
        var bx=Math.min(235,W()*0.22), by=Math.min(140,H()*0.20);
        x=o.x+(ux*ca-uy*sa)*bx; y=o.y+(ux*sa+uy*ca)*by;
      } else {                                     // lang thang
        x=W()*(WXMIN+0.05+Math.random()*(WXMAX-WXMIN-0.10));
        y=toaDoY(ZMIN+0.10+Math.random()*(ZMAX-ZMIN-0.20));
      }
      var q=diemTrongBien(x,y);
      if(Math.sqrt((q[0]-o.x)*(q[0]-o.x)+(q[1]-o.y)*(q[1]-o.y))<70) continue;   // quá gần chỗ đang đứng
      var xaCho=Math.sqrt((q[0]-cx)*(q[0]-cx)+(q[1]-cy)*(q[1]-cy));
      if(dangDuoi && !o.quay && xaCho<dDog+30) continue;   // không chọn điểm gần chó hơn
      var ganBan=false;
      for(var i=0;i<BE.length;i++){
        var k=BE[i]; if(k===o) continue;
        if(Math.sqrt((q[0]-k.x)*(q[0]-k.x)+(q[1]-k.y)*(q[1]-k.y))<Math.min(150,W()*0.15)){ ganBan=true; break; }
      }
      var diemNay=xaCho-(ganBan?180:0);
      if(diemNay>diem){ diem=diemNay; tot=q; }
    }
    if(!tot){
      tot=diemTrongBien(W()*(0.25+0.5*Math.random()), toaDoY(0.45+0.35*Math.random()));
    }
    o.tx=tot[0]; o.ty=tot[1];
    o.cho=ts+(dDog<210?420:760)+Math.random()*480;
  }

  function buocBe(o,dt,ts){
    if(o.biBat){ veBe(o); return; }
    var dDog=Math.sqrt((o.x-cx)*(o.x-cx)+(o.y-cy)*(o.y-cy))||1;
    var dangDuoi=(trangThai==='duoi'||trangThai==='tangtoc');

    if(dangDuoi && !o.quay && dDog>430 && ts>(o.hetQuay||0)){ o.quay=ts+1200; o.cho=0; }
    if(o.quay && (ts>o.quay || dDog<150)){ o.quay=0; o.hetQuay=ts+1900; o.cho=0; }

    var conLai=Math.sqrt((o.tx-o.x)*(o.tx-o.x)+(o.ty-o.y)*(o.ty-o.y));
    if(ts>o.cho || conLai<16) chonDiem(o,ts);

    var dx=o.tx-o.x, dy=o.ty-o.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    var s0=doXa(zTuY(o.y));
    var vt=(90+52*s0)*(o.quay?0.9:1.0);
    // giữ khoảng cách: bạn nào sát quá thì chạy chậm lại (không đổi hướng -> không lắc)
    var chen=0;
    for(var q=0;q<BE.length;q++){
      var b2=BE[q]; if(b2===o||b2.biBat) continue;
      var dd2=Math.sqrt((o.x-b2.x)*(o.x-b2.x)+(o.y-b2.y)*(o.y-b2.y));
      var r0=Math.min(80,W()*0.09);
      if(dd2<r0) chen+=(r0-dd2)/r0;
    }
    vt*=Math.max(0.40, 1-0.6*chen);
    var k1=Math.min(1, dt*5);
    o.vx+=(dx/d*vt-o.vx)*k1;
    o.vy+=(dy/d*vt-o.vy)*k1;

    var sp=Math.sqrt(o.vx*o.vx+o.vy*o.vy);
    if(sp>8){
      var nx=o.x+o.vx*dt, ny=o.y+o.vy*dt;
      if(nx<W()*WXMIN) nx=W()*WXMIN;
      if(nx>W()*WXMAX) nx=W()*WXMAX;
      if(ny>dayToiDa()) ny=dayToiDa();
      if(ny<toaDoY(ZMIN)+8) ny=toaDoY(ZMIN)+8;
      if(!biChan(nx,zTuY(ny))){ o.x=nx; o.y=ny; }
      else if(!biChan(nx,zTuY(o.y))){ o.x=nx; }
      else if(!biChan(o.x,zTuY(ny))){ o.y=ny; }
      else { o.cho=0; o.vx*=0.3; o.vy*=0.3; }
      if(o.vx>38) o.huong=1; else if(o.vx<-38) o.huong=-1;
      o.dem+=dt*1000*Math.min(1.6, sp/110);
      if(o.dem>112){ o.dem=0; hienKhung(o,(o.khung+1)%(o.frames.length||4)); }
    }
    veBe(o);
  }

  // ---------- con chó ----------
  var dsKhung=[];
  var cx=0, cy=0, cHuong=1, cKhung=0, cDem=0;
  var trangThai='nghi', demPha=0, dich=null, demSua=0, daSua=false, demSan=0;

  function datChay(){
    var z=zTuY(cy), s=doXa(z);
    dog.style.width=(300*K()*0.52*s).toFixed(1)+'px';
    dog.style.left=cx.toFixed(1)+'px';
    dog.style.top=cy.toFixed(1)+'px';
    dog.style.transform='translate(-50%,-100%) scale('+(cHuong*s).toFixed(3)+','+s.toFixed(3)+')';
    dog.style.zIndex=Math.round(z*1000)+1;
  }
  function hienDog(k){
    for(var i=0;i<dsKhung.length;i++)
      dsKhung[i].style.display = dsKhung[i].classList.contains(k) ? '' : 'none';
  }
  function sua1(){
    demSua=700; hienDog('k8');
    try{ tieng.currentTime=0; tieng.play(); }catch(e){}
  }

  var lanCuoi=0;
  function buoc(ts){
    if(!lanCuoi) lanCuoi=ts;
    var dt=Math.min(60, ts-lanCuoi)/1000; lanCuoi=ts;

    for(var i=0;i<BE.length;i++) buocBe(BE[i], dt, ts);

    var dangChay=false;
    if(trangThai==='duoi' || trangThai==='tangtoc'){
      demPha+=dt;
      if(trangThai==='duoi'){
        // 3 giây đầu: chạy 1s -> đứng sủa 1 cái (0,6s) -> chạy tiếp; hết 3s thì tăng tốc
        if(demPha<1.0){ dangChay=true; }
        else if(demPha<1.6){ if(!daSua){ daSua=true; sua1(); } }
        else if(demPha<3.0){ dangChay=true; }
        else { dich=BE[Math.floor(Math.random()*BE.length)]; trangThai='tangtoc'; demPha=0; demSan=0; dangChay=true; }
      } else { dangChay=true; demSan+=dt; }

      var z=dich?dich:BE[0];
      var dx=z.x-cx, dy=z.y-cy, d=Math.sqrt(dx*dx+dy*dy);
      var s=doXa(zTuY(cy));
      var vanToc=118+66*s;   // một tốc độ duy nhất: chốt xong vẫn chạy y như lúc đầu
      if(trangThai==='duoi' && d<115) vanToc=0;
      if(dangChay && vanToc>0 && d>2){
        var b=Math.min(d, vanToc*dt), nx=cx+dx/d*b, ny=cy+dy/d*b;
        if(!biChan(nx,zTuY(ny))){ cx=nx; cy=ny; }
        else if(!biChan(nx,zTuY(cy))){ cx=nx; }
        else if(!biChan(cx,zTuY(ny))){ cy=ny; }
        if(Math.abs(dx)>1.5) cHuong = dx>0?1:-1;
        cDem+=dt*1000;
        if(cDem>105){ cDem=0; cKhung=(cKhung%6)+1; }
        hienDog('k'+cKhung);
      }
      if(!dangChay && demSua<=0) hienDog('k7');

      var that=Math.sqrt((z.x-cx)*(z.x-cx)+(z.y-cy)*(z.y-cy));
      if(trangThai==='tangtoc' && (that<54 || demSan>12)){
        trangThai='bat'; demSua=700;
        cx-=dx/d*48; cy-=dy/d*28;
        sua1();
        z.biBat=true;                                   // bạn bị bắt đứng lại
        // bước ra phía trước một bước để không bị cây/ghế che mất
        z.y=Math.min(dayToiDa(), z.y+55);
        var thu=0;
        while(biChan(z.x,zTuY(z.y)) && thu<12){ z.y=Math.max(toaDoY(ZMIN)+10, z.y-10); thu++; }
        z.el.classList.add('bi-bat');
        hienKhung(z,0);
        document.getElementById('bTen').textContent=z.ten;
        var b2=document.getElementById('banner'); b2.classList.add('hien');
        setTimeout(function(){ b2.classList.remove('hien'); }, 6000);
        document.getElementById('btnDuoi').textContent='Đuổi tiếp';
      }
    } else {
      if(demSua<=0) hienDog('k7');
    }
    if(demSua>0){ demSua-=dt*1000; if(demSua<=0 && trangThai!=='duoi') hienDog('k7'); }

    datChay();
    requestAnimationFrame(buoc);
  }

  // ---------- khởi động ----------
  fetch('nen-cong-vien.svg').then(function(r){return r.text();}).then(function(txt){
    nen.innerHTML=txt;
    var svg=nen.querySelector('svg');
    if(svg){ svg.setAttribute('preserveAspectRatio','xMidYMid slice');
             svg.removeAttribute('width'); svg.removeAttribute('height'); }
  }).catch(function(){});

  fetch('sprint-chay.svg').then(function(r){return r.text();}).then(function(txt){
    var doc=new DOMParser().parseFromString(txt,'image/svg+xml');
    var st=doc.querySelector('style'); if(st) st.remove();
    var svg=doc.documentElement;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    sprite.appendChild(document.importNode(svg,true));
    dsKhung=sprite.querySelectorAll('g.khung');
    for(var k=0;k<dsKhung.length;k++) dsKhung[k].style.animation='none';
    cx=W()*0.5; cy=toaDoY(0.80); hienDog('k7'); datChay();
  }).catch(function(){});

  var viTri=[[0.16,0.72],[0.36,0.90],[0.56,0.66],[0.78,0.86],[0.30,0.60],[0.70,0.58],[0.90,0.72]];
  function dungBe(){
    for(var i=0;i<BE.length;i++) if(BE[i].el.parentNode) BE[i].el.parentNode.removeChild(BE[i].el);
    BE=[];
    var namD=0, nuD=0;
    for(var i=0;i<dsBe.length;i++){
      var b=dsBe[i];
      var src=b.nu ? SRC_NU[(nuD++)%3] : SRC_NAM[(namD++)%3];
      taoBe(i, src, b.ten, false);
    }
    if(coThay) taoBe(dsBe.length, thayNu?SRC_THAY_NU:SRC_THAY_NAM, tenThay, true);
    for(var i=0;i<BE.length;i++){
      var o=BE[i], p=viTri[i%viTri.length];
      o.x=W()*p[0]; o.y=toaDoY(p[1]); o.tx=o.x; o.ty=o.y; o.cho=performance.now()+800;
      veBe(o);
    }
  }
  dungBe();

  document.getElementById('btnDuoi').onclick=function(){
    if(trangThai==='duoi' || trangThai==='tangtoc'){
      trangThai='nghi'; dich=null; demPha=0; daSua=false;
      this.textContent='Bắt đầu đuổi'; return;
    }
    for(var i=0;i<BE.length;i++){ BE[i].biBat=false; BE[i].el.classList.remove('bi-bat'); }
    dich=BE[Math.floor(Math.random()*BE.length)];
    trangThai='duoi'; demPha=0; daSua=false;
    this.textContent='Dừng';
  };

  // bảng nhập tên + thêm/bớt bạn + đổi nam/nữ + thầy chạy cùng
  var luoi=document.getElementById('luoiTen');
  var hop=document.getElementById('hopTen');

  function docTen(){
    for(var j=0;j<dsBe.length;j++){
      var el=document.getElementById('t'+j);
      if(el) dsBe[j].ten=el.value.trim()||TEN_MAC_DINH[j];
    }
    var ct=document.getElementById('coThay');
    if(ct) coThay=ct.checked;
  }

  function veBangTen(){
    luoi.innerHTML='';
    for(var j=0;j<dsBe.length;j++){
      var w=document.createElement('div'); w.className='dong';
      var lb=document.createElement('label'); lb.textContent='Bạn '+(j+1);
      var hang=document.createElement('div'); hang.className='hang';
      var inp=document.createElement('input');
      inp.id='t'+j; inp.maxLength=18; inp.placeholder='Nhập tên'; inp.value=dsBe[j].ten||'';
      var gioi=document.createElement('button');
      gioi.className='gioi'; gioi.type='button';
      gioi.textContent=dsBe[j].nu?'👧':'👦';
      gioi.title=dsBe[j].nu?'Đang là bạn gái — bấm để đổi thành bạn trai':'Đang là bạn trai — bấm để đổi thành bạn gái';
      gioi.onclick=function(idx){ return function(){ docTen(); dsBe[idx].nu=!dsBe[idx].nu; veBangTen(); }; }(j);
      var xoa=document.createElement('button');
      xoa.className='xoa'; xoa.type='button'; xoa.textContent='✕'; xoa.title='Bớt bạn này';
      xoa.disabled=(dsBe.length<=TOI_THIEU);
      xoa.onclick=function(idx){ return function(){ docTen(); if(dsBe.length>TOI_THIEU){ dsBe.splice(idx,1); veBangTen(); } }; }(j);
      hang.appendChild(inp); hang.appendChild(gioi); hang.appendChild(xoa);
      w.appendChild(lb); w.appendChild(hang); luoi.appendChild(w);
    }
    var them=document.createElement('button');
    them.className='them'; them.type='button'; them.textContent='+ Thêm bạn';
    them.disabled=(dsBe.length>=TOI_DA);
    them.onclick=function(){ docTen(); if(dsBe.length<TOI_DA){
      var nuMoi=dsBe.length%2===1;
      dsBe.push({ten:TEN_MAC_DINH[dsBe.length]||('Bạn '+(dsBe.length+1)), nu:nuMoi}); veBangTen(); } };
    luoi.appendChild(them);

    // hàng giáo viên: bật/tắt + chọn cô hay thầy
    var hangThay=document.createElement('div'); hangThay.className='dong thay-dong';
    var nhan=document.createElement('label'); nhan.className='chon';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.id='coThay'; cb.checked=coThay;
    nhan.appendChild(cb); nhan.appendChild(document.createTextNode(' Teacher chạy cùng'));
    var hang2=document.createElement('div'); hang2.className='hang';
    var gvGioi=document.createElement('button');
    gvGioi.className='gioi'; gvGioi.type='button';
    gvGioi.textContent=thayNu?'👩':'👨';
    gvGioi.title=thayNu?'Đang là cô giáo — bấm để đổi thành thầy giáo':'Đang là thầy giáo — bấm để đổi thành cô giáo';
    gvGioi.disabled=!coThay;
    gvGioi.onclick=function(){ docTen(); thayNu=!thayNu; veBangTen(); };
    hang2.appendChild(gvGioi);
    hangThay.appendChild(nhan); hangThay.appendChild(hang2); luoi.appendChild(hangThay);

    var ghi=document.createElement('div'); ghi.className='ghi';
    ghi.textContent='Từ '+TOI_THIEU+' đến '+TOI_DA+' bạn · bấm 👦/👧 để đổi nam nữ';
    luoi.appendChild(ghi);
  }

  document.getElementById('btnTen').onclick=function(){ veBangTen(); hop.classList.add('mo'); };
  document.getElementById('btnHuy').onclick=function(){ hop.classList.remove('mo'); };
  document.getElementById('btnLuu').onclick=function(){
    docTen();
    if(dsBe.length<TOI_THIEU){ dsBe.push({ten:TEN_MAC_DINH[1], nu:true}); }
    if(!tuLop) localStorage.setItem('ds-be', JSON.stringify({ds:dsBe, thay:coThay, thayNu:thayNu}));
    trangThai='nghi'; dich=null; demPha=0; demSan=0;
    document.getElementById('btnDuoi').textContent='Bắt đầu đuổi';
    document.getElementById('banner').classList.remove('hien');
    dungBe();
    hop.classList.remove('mo');
  };

  window.addEventListener('resize', function(){
    datVat();
    for(var i=0;i<BE.length;i++){
      var o=BE[i];
      o.x=Math.min(W()*WXMAX, Math.max(W()*WXMIN, o.x));
      o.y=Math.min(dayToiDa(), Math.max(toaDoY(ZMIN), o.y));
      veBe(o);
    }
    datChay();
  });

  datVat();
  requestAnimationFrame(buoc);
  if(thamSo.get('tu')==='1'){
    setTimeout(function(){ var b=document.getElementById('btnDuoi'); if(b) b.click(); }, 1400);
  }
})();
</script>
</body>
</html>
