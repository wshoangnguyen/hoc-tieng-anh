<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>English Flashcards - Học tiếng Anh cho bé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #f5deb3 0%, #fffacd 50%, #faebd7 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            padding: 30px 20px 50px;
        }

        .flashcard-app {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header với menu game */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .title-section h1 {
            text-align: left;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .title-section .sub {
            text-align: left;
            margin-bottom: 0;
        }

        /* Game Menu Dropdown */
        .game-menu {
            position: relative;
            display: inline-block;
        }

        .game-btn {
            background: linear-gradient(135deg, #ffb347, #ff8c1a);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            min-width: 220px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 100;
            overflow: hidden;
            margin-top: 10px;
        }

        .game-menu.active .dropdown-content {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-content a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            text-decoration: none;
            color: #1e5a7a;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 1px solid #eee;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background: #fff3e0;
            padding-left: 28px;
        }

        .dropdown-content a .game-icon {
            font-size: 1.3rem;
        }

        .dropdown-content a .game-info {
            flex: 1;
        }

        .dropdown-content a .game-name {
            font-weight: bold;
        }

        .dropdown-content a .game-desc {
            font-size: 0.7rem;
            color: #888;
        }

        /* Logo nổi*/
        .brand-logo-float {
            position: fixed;
            bottom: 20px;
            right: 25px;
            z-index: 150;
            height: auto;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            transition: transform 0.2s ease;
            animation: gentleSwing 3s ease-in-out infinite;
        }

        .brand-logo-float img {
            width: 150px;
            object-fit: contain;
        }


@keyframes gentleSwing {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(6deg); }
    75% { transform: rotate(-6deg); }
}

/* Phiên bản cho điện thoại */
@media (max-width: 700px) {
    .brand-logo-float {
        width: 55px;
        top: 12px;
        right: 12px;
        bottom: auto;
    }
}

        .status-bar {
            background: #ffb347;
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #ffefcf;
            font-weight: 500;
        }

        .status-bar.success {
            background: #ffb347;
        }

        .status-bar.error {
            background: #a1422f;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: #f0f3f8;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #1e5a7a;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .filter-btn.active {
            background: #ffb347;
            color: white;
            transform: scale(1.02);
        }

        .filter-btn:hover {
            background: #ffc107;
            transform: translateY(-2px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 220px));
            justify-content: center;
            gap: 15px;
        }

        @media (max-width: 620px) {
            .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
            .flashcard { aspect-ratio: 1 / 1; }
            .flashcard .front, .flashcard .back { font-size: 13px; padding: 6px; }
        }

        .flashcard {
            background: transparent;
            width: 100%;
            aspect-ratio: 3 / 4;
            perspective: 1400px;
            cursor: pointer;
        }

        .inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 28px;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.4);
        }

        .flashcard.flipped .inner {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .front {
            background: linear-gradient(135deg, #fff5e6, #ffe8d4);
            
        }

        .front img {
            max-width: 85%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: white;
            padding: 8px;
        }

        .click-hint {
            margin-top: 12px;
            font-size: 0.75rem;
            background: #ffedd5;
            padding: 5px 12px;
            border-radius: 40px;
            color: #b45f2b;
            font-weight: 500;
        }

        .back {
            background: #ffb347;
            color: white;
            transform: rotateY(180deg);
            gap: 12px;
            padding: 20px;
            justify-content: center;
        }

        .back .word {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: capitalize;
            background: rgba(255,255,240,0.2);
            padding: 6px 16px;
            border-radius: 50px;
            letter-spacing: 1px;
        }

        .back .pronounce {
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 40px;
            color: #ffdd99;
        }

        .back .meaning {
            font-size: 1.2rem;
            font-weight: 600;
            background: #f4a261;
            padding: 8px 18px;
            border-radius: 50px;
            color: #1f2c33;
            margin-top: 8px;
        }

        .back .sound-icon {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            background: rgba(44, 78, 98, 0.8);
            border-radius: 40px;
            padding: 50px;
            color: #ffefcf;
        }

        .footer-note {
            margin-top: 45px;
            color: #cfecf0;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,200,0.3);
            padding-top: 20px;
        }

        @media (max-width: 650px) {
            .back .word { font-size: 1.3rem; }
            .back .meaning { font-size: 1rem; }
            .cards-grid { gap: 20px; }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .title-section h1, .title-section .sub {
                text-align: center;
            }
            .dropdown-content {
                right: auto;
                left: 0;
            }
        }
    
        /* --- mobile: chữ vừa trong thẻ, không tràn (31/10/2026) --- */
        @media (max-width: 620px) {
            .cards-grid { gap: 10px; }
            .inner, .front, .back { border-radius: 16px !important; }
            .front, .back { overflow: hidden; }
            .front img { max-width: 92%; max-height: 64%; padding: 4px; border-radius: 10px; }
            .click-hint { font-size: 10px; margin-top: 6px; padding: 3px 8px; line-height: 1.2; text-align: center; }
            .back { padding: 8px 6px !important; gap: 6px !important; }
            .back .word { font-size: clamp(11px, 5vw, 21px) !important; padding: 3px 9px !important;
                border-radius: 10px !important; letter-spacing: 0 !important; line-height: 1.15;
                max-width: 96%; text-align: center; overflow-wrap: anywhere; white-space: normal; }
            .back .meaning { font-size: clamp(10px, 3.9vw, 17px) !important; padding: 3px 8px !important;
                border-radius: 10px !important; margin-top: 2px !important; line-height: 1.2;
                max-width: 96%; text-align: center; overflow-wrap: anywhere; white-space: normal; }
            .back .pronounce { font-size: clamp(9px, 2.9vw, 13px) !important; padding: 2px 7px !important;
                max-width: 96%; overflow-wrap: anywhere; }
            .back .sound-icon { font-size: 9px !important; margin-top: 2px !important; }
            .chu-lon { font-size: clamp(12px, 5vw, 32px) !important; line-height: 1.15; }
        }
        @media (max-width: 430px) {
            .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        }
    </style>
    <script src="am-thanh.js?v=20261031c"></script>
  <link rel="stylesheet" href="core.css">
  <script src="core.js?v=20261031b"></script>
</head>
<body>

    <div class="brand-logo-float" id="brandLogoFloat">
    <img src="https://lh3.googleusercontent.com/d/1e7uth2SJ0qoL0cHXBizZunjscTiJ9Da9=s400" alt="English Logo" onerror="this.src='https://via.placeholder.com/70?text=LOGO'">
</div>

<div class="flashcard-app">
    <div class="header">
        <div class="title-section">
            <img src="flashcard.png" alt="English Flashcards" style="max-width: 280px; width: 100%;">
            <div class="sub">✨ Nhấn vào thẻ → lật mặt + nghe phát âm ✨</div>
        </div>
        
        
    </div>

    <div class="status-bar" id="statusBar">
        ⏳ Đang tải dữ liệu từ vocabulary.json...
    </div>

    <div class="filter-bar" id="filterBar" style="display: none;">
        <button class="filter-btn active" data-filter="all">📚 Tất cả</button>
        <button class="filter-btn" data-filter="animal">🐾 Động vật</button>
        <button class="filter-btn" data-filter="nature">🌿 Thiên nhiên</button>
        <button class="filter-btn" data-filter="other">⭐ Khác</button>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <div class="empty-state">📂 Đang chuẩn bị...</div>
    </div>
    <div class="footer-note">
        🎯 Mẹo: Chọn danh mục từ vựng ở trên để lọc thẻ học. Nhấp vào thẻ để lật và nghe phát âm!
    </div>
</div>

<script>
(function(){
  const IMAGE_BASE_PATH = "pic/";
  let vocabulary = [];
  let daLat = new Set();
  let daCongDiem = false;

  const statusBar = document.getElementById('statusBar');
  const cardsGrid = document.getElementById('cardsGrid');
  const filterBar = document.getElementById('filterBar');
  if (filterBar) filterBar.style.display = "none";

  function escapeHtml(str){
    return String(str || "").replace(/[&<>]/g, function(m){
      return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
    });
  }

  function noiTu(w){
    if (window.NOI && NOI.tu) return NOI.tu(w);
    if (window.GAME && GAME.noi) return GAME.noi(w);
  }

  function capNhatDem(){
    const n = vocabulary.length, d = daLat.size;
    statusBar.className = "status-bar";
    statusBar.textContent = `🃏 ${d}/${n} thẻ đã lật · lật hết cả unit để nhận điểm`;
    if (d >= n && n) statusBar.classList.add("success");
  }

  function chamDiem(){
    if (daCongDiem || !window.GAME) return;
    daCongDiem = true;
    const b = GAME.bai ? GAME.bai() : null;
    try {
      GAME.batDau({ game: "flashcard", sach: b ? b.sach : null, unit: b ? b.unit : null,
                    soCau: vocabulary.length, nac: 1 });
      GAME.ketThuc({ soCau: vocabulary.length, soDung: vocabulary.length });
    } catch(e){}
  }

  function createFlashcard(item){
    const card = document.createElement('div');
    card.className = 'flashcard';
    card.setAttribute('data-word', item.word.toLowerCase());
    const anh = IMAGE_BASE_PATH + encodeURIComponent(item.word.toLowerCase());
    card.innerHTML = `
      <div class="inner">
        <div class="front">
          <img class="flash-img" src="${anh}.jpg" alt="${escapeHtml(item.word)}"
               onerror="this.onerror=null;this.style.display='none';this.parentNode.querySelector('.chu-lon').style.display='block';"
               style="max-width:85%;max-height:70%;object-fit:contain;border-radius:20px;">
          <div class="chu-lon" style="display:none;font-size:34px;font-weight:800;color:#3a2a00;text-align:center;padding:0 10px">${escapeHtml(item.word)}</div>
          <div class="click-hint">🎵 nhấn để nghe + lật thẻ</div>
        </div>
        <div class="back">
          <div class="word">${escapeHtml(item.word)}</div>
          <div class="meaning">${escapeHtml(item.meaning)}</div>
          <div class="sound-icon">🔊 nghe lại</div>
        </div>
      </div>`;
    card.addEventListener('click', function(e){
      e.stopPropagation();
      card.classList.toggle('flipped');
      noiTu(item.word);
      if (!daLat.has(item.word)) { daLat.add(item.word); capNhatDem(); }
      if (daLat.size >= vocabulary.length) chamDiem();
    });
    return card;
  }

  function renderCards(){
    cardsGrid.innerHTML = '';
    if (!vocabulary.length){
      cardsGrid.innerHTML = '<div class="empty-state">Unit này chưa có từ vựng.</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    vocabulary.forEach(function(it){ frag.appendChild(createFlashcard(it)); });
    cardsGrid.appendChild(frag);
  }

  function dungSai(){
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.remove(); });
    statusBar.className = "status-bar error";
    statusBar.textContent = "🃏 Trò thẻ từ chỉ dùng cho SM1 và SM2. Bạn chọn lại sách ở thanh trên nhé.";
    cardsGrid.innerHTML = '<div class="empty-state">Chọn SM1 hoặc SM2 ở góc trên để học thẻ từ.</div>';
  }

  function chay(){
    if (!window.GAME || !GAME.sanSang){
      statusBar.textContent = "Chưa nạp được bộ khung trò chơi (core.js).";
      return;
    }
    GAME.sanSang().then(function(b){
      if (!b){ statusBar.textContent = "Chưa tải được dữ liệu từ vựng."; return; }
      if (b.sach !== "SM1" && b.sach !== "SM2"){ dungSai(); return; }
      vocabulary = (b.tu || []).map(function(x){
        return { word: x[0], meaning: x[1] || "", category: "unit" };
      });
      statusBar.className = "status-bar success";
      statusBar.textContent = `📚 ${b.sach} · Unit ${b.unit}${b.ten ? " — " + b.ten : ""} · ${vocabulary.length} từ`;
      capNhatDem();
      renderCards();
    }).catch(function(){
      statusBar.textContent = "Có lỗi khi tải dữ liệu.";
    });
  }

  chay();
})();
</script>

</body>
</html>
