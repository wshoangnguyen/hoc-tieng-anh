<style>
  :root{--line:#eadfc9;--dim:#6b7280;--tim:#7c3aed;--tim-nhat:#f5f0ff;--green:#16a34a;--red:#dc2626;--be:#fdf6e8}
  *{box-sizing:border-box}
  body{margin:0;font-family:Quicksand,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#fffdf7,#fdf3e2 45%,#f8e7c9);color:#2c2416}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .top a{font-size:14px;color:#6b5b3e;text-decoration:none}
  h1{font-size:21px;margin:6px 0 2px}
  .sub{color:#6b5b3e;font-size:14px;margin:0 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .hs-hang{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
  .hs-hang label{font-size:12.5px;color:#6b5b3e;display:flex;flex-direction:column;gap:4px;font-weight:700}
  .hs-hang select,.hs-hang input{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:120px;font-family:inherit}
  .hs-hang input{width:130px;text-transform:uppercase}
  .hs-nhac{font-size:13px;color:#6b7280;background:#fdfaf3;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
  .hs-nhac.dung{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
  .hs-nhac.sai{color:#b45309;background:#fffbeb;border-color:#fde68a}

  .thanh{height:8px;background:#efe7fb;border-radius:6px;overflow:hidden;margin:6px 0 14px}
  .thanh>i{display:block;height:100%;background:var(--tim);width:0;transition:width .25s}
  .hang{display:flex;justify-content:space-between;font-size:13.5px;color:#6b5b3e;font-weight:700}

  .chat{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px;max-height:min(58vh,560px);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
  .vi{font-size:13px;color:#7a5a00;background:#fff8e6;border:1px dashed #f0d9a8;border-radius:9px;padding:6px 9px;margin-top:7px;line-height:1.4;font-weight:600}
  .bong{max-width:88%;padding:12px 14px;border-radius:16px;font-size:16.5px;line-height:1.45;white-space:pre-wrap}
  .ai{align-self:flex-start;background:var(--tim-nhat);border:1px solid #e6dcfb;border-bottom-left-radius:5px}
  .hs{align-self:flex-end;background:#2c2416;color:#fff;border-bottom-right-radius:5px}
  .ai .nhan{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#6d28d9;margin-bottom:5px}
  .av{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #e6dcfb;display:grid;place-items:center;font-size:14px;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .phan{display:inline-block;font-size:11.5px;font-weight:800;color:#7c4a03;background:#fdf0d3;border:1px solid #f3dfae;border-radius:999px;padding:2px 9px;margin-bottom:7px}
  .meo{font-size:12.5px;color:#8a6d3b;background:#fffaee;border:1px solid #f3e6c8;border-radius:10px;padding:7px 10px;margin-top:8px}

  .fb{margin:2px 0 10px;font-size:15px;line-height:1.5}
  .fb .ok{color:var(--green);font-weight:800}
  .fb .loi{color:var(--red);font-weight:800}
  .fb .sua{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px 10px;margin-top:7px}
  .fb .sua b{color:#15803d}

  textarea{width:100%;min-height:64px;font-size:16.5px;padding:12px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;resize:vertical;background:#fffdf8}
  textarea:focus{outline:none;border-color:var(--tim)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .nut{background:var(--tim);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .nut:disabled{opacity:.5;cursor:default}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;font-family:inherit}
  .hint{font-size:13px;color:#6b7280}
  .ketqua{font-size:18px;font-weight:800;margin-bottom:6px}
</style>

<body>
<div class="wrap">
  <div class="top"><a href="sanh.html">← Sảnh trò chơi</a></div>
  <h1>💬 Level 6 · Nói chuyện với AI</h1>
  <p class="sub">Bạn nói chuyện với bạn AI bằng tiếng Anh, 6 lượt cho mỗi Unit. Mỗi câu trả lời được chấm ngay: đúng thì đi tiếp, chưa đúng thì AI chỉ đúng chỗ cần sửa.</p>

  <div class="card" style="margin-bottom:12px"><div id="hsBar"></div></div>

  <div class="card">
    <div class="hang"><span id="dem">Đang chuẩn bị…</span><span id="diem">Đúng 0/6</span></div>
    <div class="thanh"><i id="tiLe"></i></div>
    <div class="chat" id="chat"></div>
    <div id="vungTraLoi">
      <textarea id="ta" placeholder="Trả lời bằng tiếng Anh…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      <div class="row">
        <button class="nut" id="gui">Gửi câu trả lời</button>
        <button class="ghost" id="bo">Bỏ qua lượt này</button>
        <span class="hint" id="goiY">Enter để gửi · Shift+Enter để xuống dòng</span>
      </div>
    </div>
    <div id="ketThuc"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const API = "https://vm-4-15-ubuntu.tailcfa324.ts.net:8443/cham";

let SACH = "SM1", UNIT = 1, BAR = null, VONG = [], I = 0, DUNG = 0, DA_THU = false, DANG_CHO = false;
/* sách nhỏ (SM1–SM3): câu hỏi tiếng Anh có kèm một dòng gợi ý tiếng Việt */
const coGoiYVi = () => /^SM[123]$/i.test(String(SACH || ""));

/* ---------- kịch bản: 6 lượt, mỗi lượt gắn một phần của bài ---------- */
function phanCuaBai(b, i) {
  const p = (b.phan || []).filter(Boolean);
  const mac = ["Từ vựng", "Từ vựng", "Ngữ pháp", "Truyện / Project", "Kỹ năng", "Sáng tạo câu"];
  return p.length ? (p[i] || mac[i]) : mac[i];
}

const KHONG_DEM = new Set(("upstairs downstairs inside outside around behind between under near far home school park "+
  "beach city morning evening night today tomorrow yesterday always never sometimes often good bad big small "+
  "happy sad tired hungry thirsty fast slow quiet loud beautiful ugly fun boring easy difficult here there "+
  "hello goodbye please sorry thanks yes no very really too also again now then").split(" "));

function laTuDem(w) {
  const x = String(w || "").toLowerCase().trim();
  if (x.length < 3 || KHONG_DEM.has(x) || /ly$/.test(x)) return false;
  if (/s$/.test(x) && !/^(bus|glass|dress|class|grass)$/.test(x)) return false;
  return true;
}
function mangA(w) { return /^[aeiou]/i.test(w) ? "an " + w : "a " + w; }

/* thang đo năng lực: mỗi level một kiểu câu hỏi riêng, độ khó tăng dần */
function bacCuaSach() {
  const s = String(SACH || "").toUpperCase();
  const m = /^SM\s*-?\s*(\d)/.exec(s);
  if (m) { const n = +m[1]; return n <= 2 ? 1 : n <= 4 ? 2 : 3; }
  if (/^A2|^OWA2/.test(s)) return 4;
  if (/^B1|^OWB1/.test(s)) return 5;
  return 3;
}

function taoKichBan(b) {
  const tuAll = (b.tu || []).filter((w) => w && String(w).length > 1);
  if (!tuAll.length) return [];
  const tuDem = tuAll.filter(laTuDem);
  const coDanhTu = tuDem.length >= 2;
  const dung = coDanhTu ? tuDem : tuAll;
  const khuon0 = (b.khuon || [])[0] || "";
  const khuon = (khuon0.split(/\s+/).length >= 4 && !/^(connectors?|vocabulary|grammar|pronunciation)$/i.test(khuon0.trim())) ? khuon0.trim() : "";
  const t = (i) => dung[i % dung.length];
  const ten = (b.ten || "").trim();
  const chu = (w) => String(w || "").toLowerCase();
  const A = (w) => mangA(w);
  const bac = bacCuaSach();
  let ds = [];

  if (bac === 1) {
    /* SM1–SM2: câu ngắn, trả lời 1 từ hoặc Yes/No, có gợi ý tiếng Việt */
    ds = [
      { hoi: `Hi! I'm Buddy. What's your name?`,
        vi: "Chào bạn! Mình là Buddy. Bạn tên là gì? (My name is ...)",
        tu: [], loai: "tra_loi",
        meo: "Nghe câu hỏi “What's your name?” thì trả lời “My name is …”." },
      { hoi: `Do you know the word “${t(0)}”? Yes or No.`,
        vi: `Bạn có biết từ “${t(0)}” không? Trả lời Yes hoặc No.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "Trả lời ngắn: Yes, I do. / No, I don't." },
      { hoi: `Which one do you like: “${t(1)}” or “${t(2)}”?`,
        vi: `Bạn thích cái nào hơn: “${t(1)}” hay “${t(2)}”?`,
        tu: [t(1), t(2)], loai: "tra_loi",
        meo: "Trả lời: I like … (chỉ cần một từ hoặc một câu ngắn)." },
      { hoi: `Say a short sentence with “${t(2)}”. For example: I like ${chu(t(2))}.`,
        vi: `Nói một câu ngắn có từ “${t(2)}”. Ví dụ: I like ${chu(t(2))}.`,
        tu: [t(2)], loai: "tra_loi",
        meo: "Câu ngắn cũng được: I like … / This is … / Look at …" },
      { hoi: `Do you like this unit? Yes or No.`,
        vi: "Bạn có thích bài này không? Yes hoặc No.",
        tu: [t(3)], loai: "tra_loi",
        meo: "Trả lời ngắn: Yes, I do. / No, I don't." },
      { hoi: `Now you ask me: “${t(4)}”?`,
        vi: `Giờ bạn hỏi lại mình một câu có từ “${t(4)}”, nhớ dấu hỏi.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Hỏi thì phải có dấu ? ở cuối câu." },
    ];
  } else if (bac === 2) {
    /* SM3–SM4: câu đơn hoàn chỉnh, giới từ, thì hiện tại */
    ds = [
      { hoi: `Hi! I'm Buddy. What's your name, and how are you today?`,
        vi: "Chào bạn! Bạn tên gì, hôm nay bạn thế nào? (I'm fine, thank you.)",
        tu: [], loai: "tra_loi",
        meo: "Trả lời hai ý: tên + “I'm fine, thank you.”" },
      { hoi: `Where can you see “${t(0)}”? Answer with in, on or at.`,
        vi: `Bạn có thể thấy “${t(0)}” ở đâu? Trả lời dùng in / on / at.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "in the classroom · on the table · at school." },
      { hoi: khuon ? `Use the structure from your book: “${khuon}”. Write your own sentence.`
                  : `Write one sentence with “${t(1)}”.`,
        vi: khuon ? `Dùng cấu trúc trong sách: “${khuon}”. Viết câu của bạn.`
                  : `Viết một câu có từ “${t(1)}”.`,
        tu: khuon ? [] : [t(1)], loai: "tra_loi",
        meo: "Giữ nguyên cấu trúc, chỉ đổi từ bên trong." },
      { hoi: `Write one sentence with “${t(2)}”. It must have a subject and a verb.`,
        vi: `Viết một câu có từ “${t(2)}”. Câu phải có chủ ngữ và động từ.`,
        tu: [t(2)], loai: "tra_loi",
        meo: "Đủ chủ ngữ + động từ mới là một câu: I go to school by bus." },
      { hoi: `Do you like this unit? Why? Use “because”.`,
        vi: "Bạn có thích bài này không? Vì sao? Dùng “because”.",
        tu: [t(3), "because"], loai: "tra_loi",
        meo: "I like it because it's fun / easy / interesting." },
      { hoi: `Ask me a question with “${t(4)}”. Start with Do, Does, Is or Where.`,
        vi: `Bạn hỏi mình một câu có từ “${t(4)}”, mở đầu bằng Do / Does / Is / Where.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Câu hỏi phải có trợ động từ ở đầu và dấu ? ở cuối." },
    ];
  } else if (bac === 3) {
    /* SM5–SM6: quá khứ, hiện tại hoàn thành, so sánh, nêu lý do */
    ds = [
      { hoi: `Tell me about “${ten}”. What did you learn, and what did you do yesterday? Two sentences.`,
        vi: "Kể về bài này và việc bạn làm hôm qua — hai câu.",
        tu: [t(0)], loai: "tra_loi",
        meo: "Câu 1 nói bài học, câu 2 dùng quá khứ: I played / I went / I watched." },
      { hoi: `Have you ever learned about “${t(1)}”? Answer with “I have” or “I have never”.`,
        vi: `Bạn đã từng học về “${t(1)}” chưa? Trả lời bằng “I have…” hoặc “I have never…”.`,
        tu: [t(1)], loai: "tra_loi",
        meo: "Hiện tại hoàn thành: have/has + V3 (used, seen, tried)." },
      { hoi: khuon ? `Use “${khuon}” to write a sentence about yourself.` : `Write one sentence with “${t(2)}” in the past simple.`,
        vi: khuon ? `Dùng cấu trúc “${khuon}” viết một câu về bạn.` : `Viết một câu ở thì quá khứ với “${t(2)}”.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Quá khứ đơn: chủ ngữ + động từ thêm -ed hoặc bất quy tắc." },
      { hoi: `Which is better for you: ${chu(t(2))} or ${chu(t(3))}? Give one reason.`,
        vi: `Với bạn cái nào tốt hơn: ${t(2)} hay ${t(3)}? Nêu một lý do.`,
        tu: [t(2), t(3)], loai: "tra_loi",
        meo: "So sánh hơn: better than / more useful than + because." },
      { hoi: `What will you do next weekend? Use “going to”, and say why.`,
        vi: "Cuối tuần sau bạn sẽ làm gì? Dùng “going to” và nói lý do.",
        tu: [t(3)], loai: "tra_loi",
        meo: "I'm going to … because …" },
      { hoi: `Ask me two questions using “${t(4)}” — one Yes/No question and one Wh-question.`,
        vi: `Hỏi mình hai câu có từ “${t(4)}”: một câu Yes/No, một câu có từ hỏi.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Yes/No mở đầu bằng Do/Is/Can; Wh-question mở đầu bằng What/Where/Why." },
    ];
  } else if (bac === 4) {
    /* A2 / KET: trả lời 2 câu, có lý do, kể trải nghiệm, nói kế hoạch */
    ds = [
      { hoi: `Let's talk about “${ten}”. Tell me about your week — three things you did.`,
        vi: "Kể về tuần của bạn — ba việc bạn đã làm.",
        tu: [t(0)], loai: "tra_loi",
        meo: "Dùng quá khứ đơn và từ nối: first, then, after that." },
      { hoi: `Have you ever had a problem with ${chu(t(1))}? What happened?`,
        vi: `Bạn đã từng gặp rắc rối với ${t(1)} chưa? Chuyện gì đã xảy ra?`,
        tu: [t(1)], loai: "tra_loi",
        meo: "Kể 2 câu: chuyện gì + bạn làm gì tiếp theo." },
      { hoi: khuon ? `Use “${khuon}” in a sentence about your own life.` : `Make a sentence about your plans with “${t(2)}”.`,
        vi: khuon ? `Dùng “${khuon}” đặt câu về chính bạn.` : `Đặt câu nói về kế hoạch của bạn với “${t(2)}”.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Kế hoạch: I'm going to / I'm planning to / I'd like to." },
      { hoi: `Do you agree that ${chu(t(2))} is important? Give two reasons.`,
        vi: `Bạn có đồng ý ${t(2)} quan trọng không? Nêu hai lý do.`,
        tu: [t(2)], loai: "tra_loi",
        meo: "I agree / I don't agree … because … Also, …" },
      { hoi: `${chu(t(3))} or ${chu(t(4))} — which would you choose, and why?`,
        vi: `${t(3)} hay ${t(4)} — bạn chọn cái nào, vì sao?`,
        tu: [t(3), t(4)], loai: "tra_loi",
        meo: "I'd choose … because … (so sánh: cheaper, easier, more interesting)." },
      { hoi: `Now ask me a question about “${ten}” that I have to answer with more than one sentence.`,
        vi: `Bạn hỏi mình một câu về bài “${ten}” mà mình phải trả lời dài hơn một câu.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Dùng What / Why / How + trợ động từ, tránh câu Yes/No." },
    ];
  } else {
    /* B1 / PET: ý kiến + lý do, so sánh, giả định, phản biện */
    ds = [
      { hoi: `What's your opinion on “${ten}”? Give your view and one example.`,
        vi: "Bạn nghĩ gì về bài này? Nêu ý kiến và một ví dụ.",
        tu: [t(0)], loai: "tra_loi",
        meo: "In my opinion … For example …" },
      { hoi: `Some people say ${chu(t(1))} is not useful. Do you agree? Explain in two or three sentences.`,
        vi: `Có người nói ${t(1)} không hữu ích. Bạn đồng ý không? Giải thích 2–3 câu.`,
        tu: [t(1)], loai: "tra_loi",
        meo: "I partly agree … However … On the other hand …" },
      { hoi: khuon ? `Use “${khuon}” to describe how things have changed for you.` : `How has ${chu(t(2))} changed in your life? Use the present perfect.`,
        vi: khuon ? `Dùng “${khuon}” nói về điều đã thay đổi với bạn.` : `${t(2)} đã thay đổi thế nào trong đời bạn? Dùng hiện tại hoàn thành.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Hiện tại hoàn thành + so sánh với quá khứ: used to …, but now …" },
      { hoi: `Imagine you had to solve a problem with ${chu(t(3))}. What would you do?`,
        vi: `Giả sử bạn phải giải quyết một vấn đề với ${t(3)}. Bạn sẽ làm gì?`,
        tu: [t(3)], loai: "tra_loi",
        meo: "Câu điều kiện loại 2: If I had …, I would …" },
      { hoi: `Compare ${chu(t(3))} and ${chu(t(4))}: which matters more today, and why?`,
        vi: `So sánh ${t(3)} và ${t(4)}: cái nào quan trọng hơn hiện nay, vì sao?`,
        tu: [t(3), t(4)], loai: "tra_loi",
        meo: "Whereas / while / although + so sánh hơn hoặc so sánh bằng." },
      { hoi: `Ask me a challenging question about “${ten}” — something you really want to know.`,
        vi: `Hỏi mình một câu khó về bài “${ten}” — điều bạn thật sự muốn biết.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Câu hỏi hay thường có What do you think about…? / How would you…?" },
    ];
  }
  return ds.map((x, i) => Object.assign({}, x, { phan: phanCuaBai(b, i) }));
}

/* ---------- chat ---------- */
function themBong(vai, noiDung, phan, vi) {
  const d = document.createElement("div");
  d.className = "bong " + vai;
  if (vai === "ai") {
    d.innerHTML = `<div class="nhan"><span class="av"><img src="/logo.png" alt="Buddy"></span>Buddy</div>`
      + (phan ? `<span class="phan">${esc(phan)}</span><br>` : "")
      + esc(noiDung)
      + (vi ? `<div class="vi">🇻🇳 ${esc(vi)}</div>` : "");
  } else {
    d.textContent = noiDung;
  }
  const hop = $("#chat");
  hop.appendChild(d);
  hop.scrollTop = hop.scrollHeight;
  return d;
}
function cuoiChat() { const hop = $("#chat"); if (hop) hop.scrollTop = hop.scrollHeight; }

function capNhatDiem() {
  $("#dem").textContent = I >= VONG.length ? "Xong 6 lượt" : `Lượt ${I + 1}/6`;
  $("#diem").textContent = `Đúng ${DUNG}/6`;
  $("#tiLe").style.width = Math.round((I / 6) * 100) + "%";
}

function hoiTiep() {
  if (I >= VONG.length) return ketThuc();
  const v = VONG[I];
  DA_THU = false;
  capNhatDiem();
  themBong("ai", v.hoi, v.phan, coGoiYVi() ? v.vi : "");
  if (v.meo && I === 0) {
    const m = document.createElement("div");
    m.className = "meo";
    m.textContent = "Mẹo: " + v.meo;
    $("#chat").appendChild(m);
    cuoiChat();
  }
  $("#ta").value = "";
  $("#ta").focus({ preventScroll: true });
}

async function cham(v, cau) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sach: SACH, unit: String(UNIT), hoi: v.hoi, tra_loi: cau, tu: v.tu, loai: v.loai }),
  });
  const j = await r.json();
  if (!r.ok || j.loi) throw new Error(j.loi || ("lỗi " + r.status));
  return j;
}

async function gui() {
  if (DANG_CHO) return;
  const cau = $("#ta").value.trim();
  if (!cau) { $("#ta").focus({ preventScroll: true }); return; }
  const v = VONG[I];
  themBong("hs", cau);
  $("#ta").value = "";
  DANG_CHO = true; $("#gui").disabled = true;

  const cho = document.createElement("div");
  cho.className = "bong ai";
  cho.innerHTML = '<span class="hint">Buddy đang chấm…</span>';
  $("#chat").appendChild(cho);
  cuoiChat();

  let kq = null, loi = "";
  try { kq = await cham(v, cau); } catch (e) { loi = String(e.message || e); }
  cho.remove();
  DANG_CHO = false; $("#gui").disabled = false;

  if (!kq) {
    themBong("ai", "Mình chưa chấm được câu này (" + loi + "). Bạn thử gửi lại giúp mình nhé.");
    $("#ta").value = cau;
    $("#ta").focus({ preventScroll: true });
    return;
  }

  const fb = document.createElement("div");
  fb.className = "fb";
  let html = kq.dat
    ? `<span class="ok">✅ Đúng rồi.</span> ${esc(kq.goi_y || "")}`
    : `<span class="loi">Chưa đúng.</span> ${esc(kq.goi_y || "")}`;
  if (kq.sua) html += `<div class="sua">Cách nói tốt hơn: <b>${esc(kq.sua)}</b></div>`;
  fb.innerHTML = html;
  $("#chat").appendChild(fb);
  cuoiChat();

  try { GAME.ghi({ tu: (v.tu && v.tu[0]) || "", ok: !!kq.dat }); } catch (e) {}

  if (kq.dat) {
    DUNG++;
    capNhatDiem();
    setTimeout(() => { I++; hoiTiep(); }, 1200);
    return;
  }

  if (!DA_THU) {
    DA_THU = true;
    $("#goiY").textContent = "Sửa theo gợi ý rồi gửi lại — bạn còn một lượt cho câu này.";
    $("#ta").focus({ preventScroll: true });
    capNhatDiem();
    return;
  }
  $("#goiY").textContent = "Enter để gửi · Shift+Enter để xuống dòng";
  setTimeout(() => { I++; hoiTiep(); }, 2000);
}

async function ketThuc() {
  $("#tiLe").style.width = "100%";
  $("#vungTraLoi").style.display = "none";
  capNhatDiem();
  if (HS.khopBai() !== false) { try { await GAME.ketThuc(); } catch (e) {} }
  const dat = DUNG >= 4;
  const khop = HS.khopBai();
  const nhac = khop === false
    ? "Bạn đang chơi khác Unit đang học nên lần này <b>không cộng điểm</b>. Chọn đúng Unit rồi chơi lại nhé."
    : (khop === null ? "Chưa xác định được bài đang học — điểm tính theo Unit bạn đã chọn." : "Đúng bài đang học — điểm đã cộng.");
  $("#ketThuc").innerHTML = `
    <div class="ketqua">Trả lời đạt ${DUNG}/6 lượt</div>
    <div class="hint" style="margin-bottom:12px">${dat ? nhac : "Cần đạt ít nhất 4/6 lượt. Đọc lại từ và cấu trúc của bài rồi chơi lại nhé."}</div>
    <div class="row">
      <button class="nut" id="lai">Chơi lại</button>
      <button class="ghost" id="doi">Đổi Unit</button>
      <button class="ghost" id="ve">Về sảnh</button>
    </div>`;
  if (dat) { try { GAME.phaoHoa(5); } catch (e) {} }
  $("#lai").onclick = () => batDau();
  $("#doi").onclick = () => location.reload();
  $("#ve").onclick = () => { location.href = "sanh.html"; };
}

function batDau() {
  const b = HS.bank(SACH, UNIT);
  VONG = b ? taoKichBan(b) : [];
  I = 0; DUNG = 0;
  $("#chat").innerHTML = "";
  $("#ketThuc").innerHTML = "";
  $("#vungTraLoi").style.display = "";
  $("#goiY").textContent = "Enter để gửi · Shift+Enter để xuống dòng";
  if (VONG.length < 6) {
    $("#chat").innerHTML = '<div class="hint">Unit này chưa đủ từ để luyện nói. Chọn Unit khác nhé.</div>';
    return;
  }
  try {
    GAME.batDau({ game: "noi-chuyen", sach: SACH, unit: UNIT, soCau: 6, nac: 6, khoaNac: true });
    const c = document.querySelector(".gcore-nac"); if (c) c.value = "6";
  } catch (e) {}
  hoiTiep();
}

$("#gui").onclick = gui;
$("#bo").onclick = () => {
  if (DANG_CHO) return;
  try { GAME.ghi({ tu: (VONG[I].tu && VONG[I].tu[0]) || "", ok: false }); } catch (e) {}
  I++; hoiTiep();
};
$("#ta").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gui(); }
});

(async () => {
  await HS.nap();
  BAR = HS.thanh($("#hsBar"), { onChange: (s, u) => { SACH = s; UNIT = u; batDau(); } });
  SACH = BAR.sach(); UNIT = BAR.unit();
  const c = HS.chonTruoc(); if (c.sach) { SACH = c.sach; UNIT = c.unit; }
  batDau();
})();
</script>
<!-- KICH-BAN-HAT-GIONG -->
<script>
/* Buddy = hạt giống vàng. Viết lại toàn bộ 6 câu hỏi mỗi bậc.
   Luật: 1 câu đùa / lượt · đùa bằng thông tin vô lý nhưng ĐÚNG ngữ pháp · không đùa vào câu trả lời của trẻ. */
taoKichBan = function (b) {
  const tuAll = (b.tu || []).filter((w) => w && String(w).length > 1);
  if (!tuAll.length) return [];
  const tuDem = tuAll.filter(laTuDem);
  const dung = tuDem.length >= 2 ? tuDem : tuAll;
  const khuon0 = (b.khuon || [])[0] || "";
  const khuon = (khuon0.split(/\s+/).length >= 4 && !/^(connectors?|vocabulary|grammar|pronunciation)$/i.test(khuon0.trim()))
    ? khuon0.trim() : "";
  const t = (i) => dung[i % dung.length];
  const ten = (b.ten || "").trim();
  const chu = (w) => String(w || "").toLowerCase();
  const A = (w) => mangA(w);
  const bac = bacCuaSach();
  const sach = String(SACH || "").toUpperCase();
  const vn = /^SM\s*-?\s*[123]/.test(sach) || (!/^SM|^A2|^B1|^OW/.test(sach));  // SM1–SM3 (và lớp chưa rõ sách): có tiếng Việt
  let ds = [];

  if (bac === 1) {
    /* SM1–SM2 (6–8 tuổi): câu ngắn, tiếng Anh + tiếng Việt */
    ds = [
      { hoi: `Hi! I'm Buddy. I'm a seed. A golden seed. What's your name?`,
        vi: "Chào bạn! Mình là Buddy, một hạt giống vàng. Bạn tên là gì? (My name is ...)",
        tu: [], loai: "tra_loi",
        meo: "Nghe “What's your name?” thì trả lời “My name is …”." },
      { hoi: `Do you know the word “${t(0)}”? Yes or No. I know it. I'm small, but I know things.`,
        vi: `Bạn có biết từ “${t(0)}” không? Yes hoặc No. Mình nhỏ, nhưng mình biết nhiều thứ.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "Trả lời ngắn: Yes, I do. / No, I don't." },
      { hoi: `Which one do you like: “${t(1)}” or “${t(2)}”? I like both. I'm a seed. I like everything.`,
        vi: `Bạn thích cái nào hơn: “${t(1)}” hay “${t(2)}”? Mình thích cả hai. Mình là hạt giống, mình thích mọi thứ.`,
        tu: [t(1), t(2)], loai: "tra_loi",
        meo: "Trả lời: I like … (một từ hoặc một câu ngắn)." },
      { hoi: `Say a short sentence with “${t(2)}”. For example: I like ${chu(t(2))}. My sentence is: I am a seed.`,
        vi: `Nói một câu ngắn có từ “${t(2)}”. Ví dụ: I like ${chu(t(2))}. Câu của mình là: I am a seed.`,
        tu: [t(2)], loai: "tra_loi",
        meo: "Câu ngắn cũng được: I like … / This is … / Look at …" },
      { hoi: `Do you like this unit? Yes or No. Be honest. I'm only three millimetres tall.`,
        vi: "Bạn có thích bài này không? Yes hoặc No. Cứ nói thật nhé — mình chỉ cao 3 mi-li-mét.",
        tu: [t(3)], loai: "tra_loi",
        meo: "Trả lời ngắn: Yes, I do. / No, I don't." },
      { hoi: `Now you ask me: “${t(4)}”? Ask slowly. I'm underground. The wifi is very bad down here.`,
        vi: `Giờ bạn hỏi mình một câu có từ “${t(4)}”. Hỏi chậm thôi — mình đang ở dưới đất, wifi ở đây rất tệ.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Câu hỏi phải có dấu ? ở cuối." },
    ];
  } else if (bac === 2) {
    /* SM3–SM4: câu đơn hoàn chỉnh. SM3 còn tiếng Việt, SM4 chỉ tiếng Anh. */
    ds = [
      { hoi: `Hi! I'm Buddy. What's your name, and how are you today? I'm fine. I'm a little wet. I'm a seed.`,
        vi: vn ? "Chào bạn! Bạn tên gì, hôm nay thế nào? Mình khoẻ, chỉ hơi ướt — mình là hạt giống." : undefined,
        tu: [], loai: "tra_loi",
        meo: vn ? "Trả lời hai ý: tên + “I'm fine, thank you.”" : "Answer two things: your name + “I'm fine, thank you.”" },
      { hoi: `Where can you see “${t(0)}”? Answer with in, on or at. Not in my pot. I checked.`,
        vi: vn ? `Bạn có thể thấy “${t(0)}” ở đâu? Trả lời dùng in / on / at.` : undefined,
        tu: [t(0)], loai: "tra_loi",
        meo: vn ? "in the classroom · on the table · at school." : "in the classroom · on the table · at school." },
      { hoi: khuon ? `Use the structure from your book: “${khuon}”. Write your own sentence. Mine is: I ride a dog to school.`
                  : `Write one sentence with “${t(1)}”. Mine is: I ride a dog to school.`,
        vi: vn ? (khuon ? `Dùng cấu trúc trong sách: “${khuon}”. Viết câu của bạn.` : `Viết một câu có từ “${t(1)}”.`)
              : undefined,
        tu: khuon ? [] : [t(1)], loai: "tra_loi",
        meo: vn ? "Giữ nguyên cấu trúc, chỉ đổi từ bên trong." : "Keep the structure, change the words inside." },
      { hoi: `Write one sentence with “${t(2)}”. It must have a subject and a verb. “Because I'm a seed” is not a sentence. I tried.`,
        vi: vn ? `Viết một câu có từ “${t(2)}”. Phải có chủ ngữ và động từ. “Because I'm a seed” không phải là câu — mình thử rồi.` : undefined,
        tu: [t(2)], loai: "tra_loi",
        meo: vn ? "Đủ chủ ngữ + động từ mới là một câu: I go to school by bus." : "Subject + verb makes a sentence: I go to school by bus." },
      { hoi: `Do you like this unit? Why? Use “because”. I like it because the sun is warm.`,
        vi: vn ? "Bạn có thích bài này không? Vì sao? Dùng “because”." : undefined,
        tu: [t(3), "because"], loai: "tra_loi",
        meo: vn ? "I like it because it's fun / easy / interesting." : "I like it because it's fun / easy / interesting." },
      { hoi: `Ask me a question with “${t(4)}”. Start with Do, Does, Is or Where. Ask where my roots are. I don't know either.`,
        vi: vn ? `Bạn hỏi mình một câu có từ “${t(4)}”, mở đầu bằng Do / Does / Is / Where.` : undefined,
        tu: [t(4)], loai: "cau_hoi",
        meo: vn ? "Câu hỏi phải có trợ động từ ở đầu và dấu ? ở cuối." : "Start with a helping verb and finish with a question mark." },
    ];
  } else if (bac === 3) {
    /* SM5–SM6: chỉ tiếng Anh */
    ds = [
      { hoi: `Tell me about “${ten}”. What did you learn, and what did you do yesterday? Two sentences. Yesterday I grew one millimetre. That was my whole day.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "Sentence 1: what you learned. Sentence 2: past simple (I played / I went / I watched)." },
      { hoi: `Have you ever learned about “${t(1)}”? Answer with “I have” or “I have never”. I have never left this pot.`,
        tu: [t(1)], loai: "tra_loi",
        meo: "Present perfect: have/has + V3 (used, seen, tried)." },
      { hoi: khuon ? `Use “${khuon}” to write a sentence about yourself. I was a very small seed last year. I still am.`
                  : `Write one sentence with “${t(2)}” in the past simple. I was a very small seed last year. I still am.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Past simple: subject + verb with -ed, or an irregular form." },
      { hoi: `Which is better for you: “${t(2)}” or “${t(3)}”? Give one reason. I prefer water. My reason is simple: I am a plant.`,
        tu: [t(2), t(3)], loai: "tra_loi",
        meo: "Comparative + because: better than / more useful than … because …" },
      { hoi: `What will you do next weekend? Use “going to”, and say why. I'm going to grow roots, because one day I want to be a tree.`,
        tu: [t(3)], loai: "tra_loi",
        meo: "I'm going to … because …" },
      { hoi: `Ask me two questions using “${t(4)}” — one Yes/No question and one Wh-question. Ask me why I am so short. It is a sensitive topic.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Yes/No questions start with Do/Is/Can; Wh-questions start with What/Where/Why." },
    ];
  } else if (bac === 4) {
    /* A2 / KET: chỉ tiếng Anh */
    ds = [
      { hoi: `Let's talk about “${ten}”. Tell me about your week — three things you did. I planted myself on Monday. That was the highlight.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "Past simple + linkers: first, then, after that." },
      { hoi: `Have you ever had a problem with ${chu(t(1))}? What happened? I once grew into a shoe. The shoe was not happy.`,
        tu: [t(1)], loai: "tra_loi",
        meo: "Two sentences: what happened, then what you did next." },
      { hoi: khuon ? `Use “${khuon}” in a sentence about your own life. I'm planning to become a tree, but first I'm planning to survive the bird.`
                  : `Make a sentence about your plans with “${t(2)}”. I'm planning to become a tree, but first I'm planning to survive the bird.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Plans: I'm going to / I'm planning to / I'd like to." },
      { hoi: `Do you agree that ${chu(t(2))} is important? Give two reasons. I agree. Without water I am a very dry seed. Without roots, a very lost one.`,
        tu: [t(2)], loai: "tra_loi",
        meo: "I agree / I don't agree … because … Also, …" },
      { hoi: `${chu(t(3))} or ${chu(t(4))} — which would you choose, and why? I'd choose the sunny spot. I'm a seed, not a philosopher.`,
        tu: [t(3), t(4)], loai: "tra_loi",
        meo: "I'd choose … because … (cheaper, easier, more interesting)." },
      { hoi: `Now ask me a question about “${ten}” that I have to answer with more than one sentence. Careful: I only know two things — water and waiting.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Use What / Why / How + auxiliary; avoid Yes/No questions." },
    ];
  } else {
    /* B1 / PET: chỉ tiếng Anh */
    ds = [
      { hoi: `What's your opinion on “${ten}”? Give your view and one example. In my opinion, patience is underrated. For example: I have been underground for three weeks.`,
        tu: [t(0)], loai: "tra_loi",
        meo: "In my opinion … For example …" },
      { hoi: `Some people say ${chu(t(1))} is not useful. Do you agree? Explain in two or three sentences. Some people also say a seed is not a tree. They are technically right and completely missing the point.`,
        tu: [t(1)], loai: "tra_loi",
        meo: "I partly agree … However … On the other hand …" },
      { hoi: khuon ? `Use “${khuon}” to describe how things have changed for you. I have grown two roots and one opinion.`
                  : `How has ${chu(t(2))} changed in your life? Use the present perfect. I have grown two roots and one opinion.`,
        tu: khuon ? [] : [t(2)], loai: "tra_loi",
        meo: "Present perfect + contrast: used to …, but now …" },
      { hoi: `Imagine you had to solve a problem with ${chu(t(3))}. What would you do? If I had hands, I would write a letter. If I had legs, I would leave this pot.`,
        tu: [t(3)], loai: "tra_loi",
        meo: "Second conditional: If I had …, I would …" },
      { hoi: `Compare ${chu(t(3))} and ${chu(t(4))}: which matters more today, and why? Branches get the photos. Roots get the water.`,
        tu: [t(3), t(4)], loai: "tra_loi",
        meo: "Whereas / while / although + comparative." },
      { hoi: `Ask me a challenging question about “${ten}” — something you really want to know. Ask me what I will be. I don't know yet. That is the whole point.`,
        tu: [t(4)], loai: "cau_hoi",
        meo: "Strong questions: What do you think about …? / How would you …?" },
    ];
  }
  return ds.map((x, i) => Object.assign({}, x, { phan: phanCuaBai(b, i) }));
};
</script>
<!-- /KICH-BAN-HAT-GIONG -->
