<!doctype html>
<meta charset="utf-8">
<title>Kiểm tra web quản lý</title>
<pre id="out" style="font:13px/1.5 monospace;white-space:pre-wrap">…</pre>
<iframe id="f" src="../index.html" style="width:1200px;height:600px;border:0;visibility:hidden"></iframe>
<script>
/* Bộ kiểm tra 5 luồng chính: điểm danh · học phí · lưu trữ · đặt sách · ngày thi */
const out = document.getElementById("out");
const f = document.getElementById("f");
const kq = [];
function ok(ten, dieu, chiTiet) { kq.push((dieu ? "PASS " : "FAIL ") + ten + (chiTiet ? "  [" + chiTiet + "]" : "")); }
function bang(ten, thuc, mong) { ok(ten, String(thuc) === String(mong), "được " + thuc + " · mong " + mong); }

f.onload = () => setTimeout(chayHet, 600);

function chayHet() {
  const w = f.contentWindow, d = f.contentDocument;
  try {
    /* mở cửa vào ruột ứng dụng: script chèn vào iframe chạy cùng phạm vi toàn cục */
    const sc = d.createElement("script");
    sc.textContent = `window.__T = {
      setS(v){ S = v; }, getS(){ return S; },
      hvDangHoc, hvTatCa, hocVienCuaLop, tinhHV, ddDat, ddLay, roiLop,
      veHocVien, veLuuTru, veCongNo, hvKhoiPhuc,
      ddsGhiNhan, ddsBoGhiNhan, ddsLopXong, ddsNgayCua,
      thiCua, thiXong, dsLopSapThi, iso, THANG_NAY,
      gop3, layXd(){ return __xungDot.slice(); }, xoaXd(){ __xungDot=[]; },
      ghiNhatKy, moNhatKy,
      buoiTuan, buoiTuLop, chotTuanCu, chotMotTuan, doiTenLop, cong, t2CuaNgay, veLuoi, datGhiDe, veDangKy, doiTuan,
      moTatCaTuan(){ moTatCaTuan = true; },
      datTuan(i){ tuanDangXem = i; S.tuan_hien_tai = i; }
    };`;
    d.head.appendChild(sc);
    const T = w.__T;

    /* máy không có hộp thoại: confirm luôn đồng ý */
    w.confirm = () => true;
    w.alert = () => {};

    const T0 = T.THANG_NAY();
    const HS = [
      { ma_hv: "HV01", ho_ten: "An", lop: "SM3 Juny", trang_thai: "đang học", hoc_phi_thang: 600000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0 - 1, lich_su_thu: [] },
      { ma_hv: "HV02", ho_ten: "Bình", lop: "SM3 Juny", trang_thai: "đang học", hoc_phi_thang: 600000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0, lich_su_thu: [] },
      { ma_hv: "HV03", ho_ten: "Dũng", lop: "SM3 Juny", trang_thai: "nghỉ", hoc_phi_thang: 600000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0, lich_su_thu: [] },
      { ma_hv: "HV04", ho_ten: "Vũ Em", lop: "SM1a", trang_thai: "bảo lưu", hoc_phi_thang: 500000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0, no_chot_thang: 0, lich_su_thu: [] },
      { ma_hv: "HV05", ho_ten: "Chi", lop: "SM3 Juny", trang_thai: "đang học", hoc_phi_thang: 600000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0, lich_su_thu: [] },
      { ma_hv: "HV06", ho_ten: "Khang", lop: "SM1a", trang_thai: "đang học", hoc_phi_thang: 500000, km_kieu: "khong", km_tri: 0, da_dong_den_thang: T0, lich_su_thu: [] }
    ];
    const LOP = [
      { id: "L1", ten: "SM3 Juny", gv: "Harvey", gio: [{ thu: 2, ca: "15:00" }], ghi: "" },
      { id: "L2", ten: "SM1a", gv: "Huỳnh", gio: [{ thu: 2, ca: "19:00" }], ghi: "" }
    ];
    const trong = { hoc_vien: HS, lop: LOP, buoi: [], giao_vien: [{ ten: "Harvey" }], buoi_them: {}, nghi: {}, lop_sach: {},
      sach_nhac: {}, tien_do: {}, diem: {}, diem_danh: {}, nhan_xet: {}, sticker: {}, lich_thi: {}, dat_sach: {},
      anh: {}, muc_them: {}, ghi_chu: [], buoi_day: [], trang_muc: {}, lich_su: [] };
    T.setS(JSON.parse(JSON.stringify(trong)));
    d.getElementById("dn").hidden = true;

    /* ───── 1. ĐIỂM DANH ───── */
    bang("1.1 học sinh đang học = 4", T.hvDangHoc().length, 4);
    bang("1.2 lớp SM3 Juny chỉ còn 3 em đang học", T.hocVienCuaLop("L1").map(x => x.ma_hv).join(","), "HV01,HV02,HV05");
    const hom = T.iso(new Date());
    T.ddDat(hom, "SM3 Juny", "HV01", "co");
    bang("1.3 ghi điểm danh rồi đọc lại", T.ddLay(hom, "SM3 Juny", "HV01"), "co");
    bang("1.4 em chưa ghi trả về rỗng", T.ddLay(hom, "SM3 Juny", "HV02"), "");
    T.ddDat(hom, "SM3 Juny", "HV01", "");
    bang("1.5 xoá điểm danh", T.ddLay(hom, "SM3 Juny", "HV01"), "");
    const roi = T.roiLop("SM3 Juny");
    ok("1.6 danh sách lớp không có em đã nghỉ", roi.indexOf("HV03") < 0 && roi.indexOf("HV04") < 0);

    /* ───── 2. HỌC PHÍ / CÔNG NỢ ───── */
    const s = T.getS();
    const h1 = T.tinhHV(s.hoc_vien[0]);
    const h2 = T.tinhHV(s.hoc_vien[1]);
    bang("2.1 nợ 1 tháng = 600.000", h1.no_tien, 600000);
    bang("2.2 đóng đủ tháng này = 0", h2.no_tien, 0);
    const tongNo = s.hoc_vien.map(T.tinhHV).filter(h => h.trang_thai === "đang học").reduce((n, h) => n + h.no_tien, 0);
    bang("2.3 tổng nợ chỉ tính em đang học", tongNo, 600000);

    /* ───── 3. LƯU TRỮ ───── */
    T.veHocVien(); T.veLuuTru();
    bang("3.1 tổng sĩ số trên đầu trang = 4", d.getElementById("hvTong").textContent.trim(), "4");
    const khuvuc = d.getElementById("hvSubNghi").textContent;
    ok("3.2 mục lưu trữ có em nghỉ + bảo lưu", khuvuc.indexOf("Dũng") >= 0 && khuvuc.indexOf("Vũ Em") >= 0);
    ok("3.3 mục lưu trữ không có em đang học", khuvuc.indexOf("Bình") < 0);
    try { T.hvKhoiPhuc("HV03"); } catch (e) { /* giao diện phụ có thể thiếu trong khung test */ }
    bang("3.4 đưa lại lớp → đang học", T.getS().hoc_vien.find(x => x.ma_hv === "HV03").trang_thai, "đang học");
    bang("3.5 sau khi đưa lại, sĩ số = 5", T.hvDangHoc().length, 5);
    T.getS().hoc_vien.find(x => x.ma_hv === "HV03").trang_thai = "nghỉ";

    /* ───── 4. ĐẶT SÁCH ───── */
    bang("4.1 chưa đặt sách", T.ddsLopXong("SM3 Juny"), false);
    const ngayDat = T.ddsGhiNhan("SM3 Juny");
    bang("4.2 ghi nhận đã đặt sách", T.ddsLopXong("SM3 Juny"), true);
    bang("4.3 ngày đặt = hôm nay", T.ddsNgayCua("SM3 Juny"), ngayDat);
    T.ddsBoGhiNhan("SM3 Juny");
    bang("4.4 bỏ ghi nhận", T.ddsLopXong("SM3 Juny"), false);

    /* ───── 5. NGÀY THI ───── */
    T.getS().lich_thi = { "SM3 Juny": { ngay: "2026-11-20", xong: false } };
    bang("5.1 đọc ngày thi", T.thiCua("SM3 Juny").ngay, "2026-11-20");
    ok("5.2 lớp sắp thi có trong danh sách nhắc", T.dsLopSapThi().indexOf("SM3 Juny") >= 0);
    T.thiXong("SM3 Juny");
    bang("5.3 xác nhận thi xong", T.thiCua("SM3 Juny").xong, true);
    bang("5.4 ngày xác nhận = hôm nay", T.thiCua("SM3 Juny").ngay_xong, hom);
    ok("5.5 thi xong thì thôi nhắc", T.dsLopSapThi().indexOf("SM3 Juny") < 0);

    /* ───── 6. ĐỒNG BỘ NHIỀU MÁY (gộp 3 chiều) ───── */
    T.xoaXd();
    let r = T.gop3({ a: 1 }, { a: 2 }, { a: 3 }, "");
    ok("6.1 máy này sửa, máy kia cũng sửa → giữ bản máy này", r.a === 2, "a=" + r.a);
    ok("6.2 có báo xung đột", T.layXd().length === 1, JSON.stringify(T.layXd()));
    T.xoaXd();
    r = T.gop3({ a: 1, b: 1 }, { a: 2, b: 1 }, { a: 1, b: 9 }, "");
    ok("6.3 hai máy sửa hai chỗ khác nhau → gộp đủ cả hai", r.a === 2 && r.b === 9, JSON.stringify(r));
    ok("6.4 không báo xung đột khi không trùng", T.layXd().length === 0, JSON.stringify(T.layXd()));
    T.xoaXd();
    const goc = [{ id: "HV01", hoc_phi_thang: 600000 }];
    const mayNay = [{ id: "HV01", hoc_phi_thang: 700000 }];
    const mayKia = [{ id: "HV01", hoc_phi_thang: 650000 }];
    r = T.gop3(goc, mayNay, mayKia, "hoc_vien");
    ok("6.5 sửa cùng một học viên ở hai máy → giữ bản máy này", r[0].hoc_phi_thang === 700000);
    ok("6.6 báo đúng chỗ xung đột", T.layXd().length === 1 && T.layXd()[0].indexOf("hoc_phi_thang") >= 0, JSON.stringify(T.layXd()));
    T.xoaXd();
    r = T.gop3([{ id: "A", x: 1 }, { id: "B", x: 1 }], [{ id: "A", x: 2 }, { id: "B", x: 1 }], [{ id: "A", x: 1 }, { id: "B", x: 3 }], "ds");
    ok("6.7 mảng: mỗi máy sửa một em → gộp đủ", r.find(z => z.id === "A").x === 2 && r.find(z => z.id === "B").x === 3);
    ok("6.8 mảng: không báo xung đột", T.layXd().length === 0, JSON.stringify(T.layXd()));

    /* ───── 7. NHẬT KÝ THAO TÁC ───── */
    T.getS().nhat_ky = [];
    T.ddDat(hom, "SM3 Juny", "HV02", "vang");
    const nk = T.getS().nhat_ky;
    ok("7.1 điểm danh có ghi nhật ký", nk.length === 1 && nk[0].viec === "điểm danh", JSON.stringify(nk[0] || {}));
    ok("7.2 nhật ký ghi tên người làm", !!(nk[0] && nk[0].ai), nk[0] && nk[0].ai);
    ok("7.3 nhật ký ghi đúng em và lớp", nk[0] && nk[0].mo_ta.indexOf("HV02") >= 0 && nk[0].mo_ta.indexOf("SM3 Juny") >= 0, nk[0] && nk[0].mo_ta);
    T.ddsGhiNhan("SM3 Juny");
    ok("7.4 đặt sách có ghi nhật ký", T.getS().nhat_ky.some(x => x.viec === "đặt sách"));
    for (let i = 0; i < 1005; i++) T.ghiNhatKy("thử", "mục " + i);
    bang("7.5 nhật ký giữ tối đa 1000 mục", T.getS().nhat_ky.length, 1000);
    ok("7.6 mục mới nhất còn nguyên", T.getS().nhat_ky[T.getS().nhat_ky.length - 1].mo_ta === "mục 1004");
    T.getS().nhat_ky = [{ id: "nk1", luc: new Date().toISOString(), ai: "Harvey", vai: "quan_ly", viec: "điểm danh", mo_ta: "HV01 · SM3 Juny · có mặt" },
                        { id: "nk2", luc: new Date().toISOString(), ai: "Huỳnh", vai: "giao_vien", viec: "học phí", mo_ta: "thu 600.000 đ" }];
    try { T.moNhatKy(); } catch (e) { kq.push("LỖI mở nhật ký: " + e.message); }
    const hopNk = d.getElementById("nkDs");
    ok("7.7 hộp nhật ký hiện đủ 2 mục", hopNk && /HV01/.test(hopNk.textContent) && /600\.000/.test(hopNk.textContent));
    const sel = d.getElementById("nkAi");
    if (sel) { sel.value = "Huỳnh"; sel.dispatchEvent(new w.Event("change")); }
    ok("7.8 lọc theo người dùng", hopNk && !/HV01/.test(hopNk.textContent) && /600\.000/.test(hopNk.textContent));
    const mo = d.getElementById("bdModal"); if (mo) mo.style.display = "none";

    /* ───── 8. TOÀN VẸN DỮ LIỆU ───── */
    let json = "";
    try { json = JSON.stringify(T.getS()); } catch (e) { json = ""; }
    ok("8.1 dữ liệu lưu được thành JSON", json.length > 100, json.length + " ký tự");

    /* ───── 9. LƯƠNG THÁNG: chỉ xét tuần thuộc tháng đang xem ───── */
    const S9 = T.getS();
    S9.lop = [{ id: "L1", ten: "SM3 Juny", gv: "Harvey", gio: [{ thu: "T6", ca: "18:00" }, { thu: "CN", ca: "09:00" }], ghi: "" }];
    S9.giao_vien = [{ ten: "Harvey", don_gia: 100000 }];
    S9.buoi = {};
    S9.tuan = ["2026-10-05", "2026-10-12", "2026-10-19", "2026-10-26", "2026-11-02", "2026-11-09", "2026-11-16", "2026-11-23", "2026-11-30"]
      .map(b => ({ bat_dau: b }));
    const luong = w.luongChiTiet("2026-11", "Harvey");
    ok("9.1 không còn tuần của tháng 10", luong.tuan.every(t => t.bat_dau.slice(0, 7) !== "2026-10" || t.bat_dau === "2026-10-26"), luong.tuan.map(t => t.bat_dau).join(" "));
    ok("9.2 mọi tuần đều có buổi trong tháng", luong.tuan.every(t => t.trongThang > 0), JSON.stringify(luong.tuan.map(t => t.trongThang)));
    bang("9.3 số buổi trong tháng 11", luong.tongThang, 9);
    bang("9.4 nếu đếm cả tuần (chỉ tuần vắt qua tháng)", luong.tongCaTuan, 10);
    bang("9.5 chênh lệch", luong.tongCaTuan - luong.tongThang, 1);

    /* ───── 10. TUẦN CŨ ĐÓNG BĂNG: sửa hôm nay không đổi quá khứ ───── */
    const hom10 = T.iso(new Date());
    const tuanNay = T.t2CuaNgay(hom10);
    const tuanCu = T.t2CuaNgay(T.cong(hom10, -14));
    const S10 = T.getS();
    S10.lop = [{ id: "L1", ten: "SM3 Juny", gv: "Harvey", gio: [{ thu: "T2", ca: "15:00" }], ghi: "" }];
    S10.giao_vien = [{ ten: "Harvey", don_gia: 100000 }, { ten: "Huỳnh", don_gia: 100000 }];
    S10.ca = ["15:00", "19:00"]; S10.buoi_them = {}; S10.nghi = {}; S10.nhat_ky = [];
    S10.buoi = {}; S10.tuan_chot = {}; S10.diem_danh = {}; S10.dat_sach = {}; S10.lich_thi = {}; S10.sach_nhac = {};
    S10.tuan = [{ id: "w1", bat_dau: tuanCu }, { id: "w2", bat_dau: tuanNay }];

    bang("10.1 chốt được 1 tuần cũ", T.chotTuanCu(), 1);
    ok("10.2 tuần đang chạy không bị chốt", !S10.tuan_chot[tuanNay]);
    const buoiCu0 = T.buoiTuan({ bat_dau: tuanCu });
    bang("10.3 tuần cũ có 1 buổi", buoiCu0.length, 1);
    ok("10.4 tuần cũ đánh dấu đã chốt", buoiCu0[0].chot === true);

    /* điểm danh buổi cũ trước khi đổi tên */
    const ngayCu = T.cong(tuanCu, 1);
    T.ddDat(ngayCu, "SM3 Juny", "HV01", "co");

    /* hôm nay: đổi tên lớp + đổi giáo viên */
    T.doiTenLop("SM3 Juny", "SM3 Mới");
    S10.lop[0].ten = "SM3 Mới"; S10.lop[0].gv = "Huỳnh";

    ok("10.5 tuần cũ vẫn giữ tên lớp cũ", T.buoiTuan({ bat_dau: tuanCu })[0].lop.ten === "SM3 Juny");
    ok("10.6 tuần cũ vẫn giữ giáo viên cũ", T.buoiTuan({ bat_dau: tuanCu })[0].gv === "Harvey");
    ok("10.7 tuần hiện tại theo tên mới", T.buoiTuan({ bat_dau: tuanNay })[0].lop.ten === "SM3 Mới");
    bang("10.8 điểm danh cũ chuyển theo tên mới", T.ddLay(ngayCu, "SM3 Mới", "HV01"), "co");

    /* sửa tay một buổi của tuần đã chốt: phải ghi được vào bản chốt */
    T.datGhiDe(tuanCu + "|L1|T2|15:00", { ghi: "học bù vì lũ" });
    bang("10.8b sửa buổi trong tuần đã chốt", T.buoiTuan({ bat_dau: tuanCu })[0].ghi, "học bù vì lũ");

    /* lưới lịch: tuần cũ giữ tên cũ, tuần này theo tên mới */
    T.datTuan(1); T.veLuoi();
    ok("10.9 lưới tuần này hiện tên mới", /SM3 Mới/.test(d.getElementById("grid").textContent));
    T.datTuan(0); T.veLuoi();
    const luoiCu = d.getElementById("grid").textContent.replace(/\s+/g, " ");
    ok("10.10 lưới tuần cũ hiện tên lớp cũ", /SM3 Juny/.test(luoiCu) && !/SM3 Mới/.test(luoiCu), luoiCu.slice(-60));
    ok("10.11 có nhãn «tuần đã chốt»", (d.getElementById("nhanChot") || {}).hidden === false);

    /* xoá lớp hôm nay: quá khứ vẫn còn */
    S10.lop = [];
    ok("10.12 xoá lớp không làm mất lịch quá khứ", T.buoiTuan({ bat_dau: tuanCu }).length === 1);
    T.datTuan(0); T.veLuoi();
    ok("10.13 lưới tuần cũ vẫn còn lớp sau khi xoá", /SM3 Juny/.test(d.getElementById("grid").textContent));
    bang("10.14 lương tháng cũ vẫn còn buổi của Harvey", w.luongChiTiet(ngayCu.slice(0, 7), "Harvey").tongThang >= 1, true);

    /* ───── 11. DANH SÁCH TUẦN GỌN: 8 tuần gần nhất + mở rộng ───── */
    const S11 = T.getS();
    const moc11 = T.t2CuaNgay(T.cong(hom10, -7 * 19));
    S11.tuan = Array.from({ length: 20 }, (_, i) => ({ id: "w" + i, bat_dau: T.cong(moc11, 7 * i) }));
    S11.tuan_hien_tai = 19; S11.lop = []; S11.tuan_chot = {};
    T.datTuan(19); T.veDangKy();
    const so11 = d.querySelectorAll("#selTuan option").length;
    ok("11.1 danh sách tuần mặc định không quá 10 mục", so11 <= 10, so11 + " mục");
    ok("11.2 có mục «Tuần cũ hơn»", !!d.querySelector('#selTuan option[value="__more"]'));
    T.moTatCaTuan(); T.veDangKy();
    bang("11.3 mở rộng ra đủ 20 tuần", d.querySelectorAll("#selTuan option").length, 20);
    T.doiTuan(18);
    ok("11.4 nút tuần trước/sau đổi tuần", T.getS().tuan_hien_tai === 18);

  } catch (e) {
    kq.push("LỖI " + (e && e.message ? e.message : e));
  }
  const hong = kq.filter(x => x.indexOf("PASS ") !== 0).length;
  out.textContent = kq.join("\n") + "\n\n" + (hong ? "❌ " + hong + "/" + kq.length + " mục lỗi" : "✅ Đạt tất cả " + kq.length + " mục");
}
</script>
