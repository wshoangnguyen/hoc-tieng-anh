<title>Chốt điểm tích luỹ theo bảng giáo viên</title>
<style>
  :root{--nen:#f6f7f9;--vien:#dfe3e8;--xanh:#0f766e;--do:#b91c1c;--vang:#fef3c7}
  *{box-sizing:border-box}
  body{margin:0;padding:18px;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--nen);color:#111}
  h1{font-size:19px;margin:0 0 4px}
  .phu{color:#555;margin:0 0 14px;font-size:13px}
  .card{background:#fff;border:1px solid var(--vien);border-radius:10px;padding:14px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--vien);padding:6px 4px;text-align:left;vertical-align:middle}
  th{background:#f1f5f9;font-weight:600;position:sticky;top:0}
  td.so{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.ok td{background:#f0fdf4}
  tr.can td{background:#fff7ed}
  tr.loi td{background:#fef2f2}
  select{max-width:260px;font-size:12px;padding:3px}
  button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--xanh);background:var(--xanh);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.phu{background:#fff;color:var(--xanh)}
  .hang{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tong{font-size:13px;color:#444}
  .badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:#e2e8f0}
  .badge.ok{background:#dcfce7;color:#166534}
  .badge.can{background:#ffedd5;color:#9a3412}
  .badge.loi{background:#fee2e2;color:#991b1b}
  .ghi{font-size:12px;color:#666}
  #log{white-space:pre-wrap;font-size:13px}
</style>

<h1>Chốt điểm tích luỹ theo bảng giáo viên</h1>
<p class="phu">Bảng 36 học viên · ngày chốt 26/10/2026. Trang này chỉ cộng phần <b>điều chỉnh</b> để tổng khớp bảng, không xoá điểm cũ.</p>

<div class="card" id="khoi-trang-thai"><span id="tt">Đang mở dữ liệu…</span></div>

<div class="card" id="khoi-bang" style="display:none">

    <button id="nut-ap">Cập nhật điểm</button>
    <button class="phu" id="nut-tai">Tải lại dữ liệu</button>
    <span class="tong" id="tong-ket"></span>
  </div>
  <div style="overflow:auto;max-height:70vh">
    <table id="bang">
      <thead><tr><th>Tên trên bảng</th><th>Lớp</th><th class="so">Điểm</th><th>Học viên trong sổ</th><th class="so">Hiện tại</th><th class="so">Điều chỉnh</th><th class="so">Sau khi lưu</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="card" id="log-card" style="display:none"><div id="log"></div></div>

<script type="module">
const SB_URL = "https://xtfusgawjlrcreiphwur.supabase.co";
const SB_KEY = "sb_publishable_3MiuAFrEEH_ZBEAg7fqTvw_CLC0OxK3";

const BANG = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob("W3sidGVuIjogIk5n4buNYyBIw6JuIiwgImxvcCI6ICJTTTJjIDI0NiA4OjAwIiwgImRpZW0iOiAxOTB9LCB7InRlbiI6ICJBbmggVGjGsCIsICJsb3AiOiAiU00yYyAyNDYgODowMCIsICJkaWVtIjogMTg2fSwgeyJ0ZW4iOiAiTWluaCBRdcOibiIsICJsb3AiOiAiU00yYyAyNDYgODowMCIsICJkaWVtIjogODB9LCB7InRlbiI6ICJNaW5oIMSQ4bupYyIsICJsb3AiOiAiU00zYjIgMzU3IDc6MDAiLCAiZGllbSI6IDU2NH0sIHsidGVuIjogIkhvw6BpIEzDom0iLCAibG9wIjogIlNNM2IyIDM1NyA3OjAwIiwgImRpZW0iOiAyODd9LCB7InRlbiI6ICJUcmFuZyBBbmgiLCAibG9wIjogIlNNM2IyIDM1NyA3OjAwIiwgImRpZW0iOiAyNTV9LCB7InRlbiI6ICJOZ2hpIMSQw6xuaCIsICJsb3AiOiAiU00zYSAzNTcgODowMCIsICJkaWVtIjogMjA4fSwgeyJ0ZW4iOiAiQuG6o28gQW4gLSBFbW1hIiwgImxvcCI6ICJTTTNhIDM1NyA4OjAwIiwgImRpZW0iOiAyOTR9LCB7InRlbiI6ICJUw7luZyIsICJsb3AiOiAiU00zYSAzNTcgODowMCIsICJkaWVtIjogNDM5fSwgeyJ0ZW4iOiAiTGluaCIsICJsb3AiOiAiU00zYiAyNDYgODowMCIsICJkaWVtIjogNDI1fSwgeyJ0ZW4iOiAiSHV54buBbiIsICJsb3AiOiAiU00zYiAyNDYgODowMCIsICJkaWVtIjogNDIwfSwgeyJ0ZW4iOiAiS2jDtGkgLSBCZW4iLCAibG9wIjogIlNNNGEgMjQ2IDg6MDAiLCAiZGllbSI6IDM3N30sIHsidGVuIjogIkh1eSAtIEFsZXgiLCAibG9wIjogIlNNM2QgMjM1IDg6MDAiLCAiZGllbSI6IDMwM30sIHsidGVuIjogIk5hbSBBbmgiLCAibG9wIjogIlNNNGYgMzU3IDc6MDAiLCAiZGllbSI6IDEwfSwgeyJ0ZW4iOiAiUXXhu7NuaCBBbmgiLCAibG9wIjogIlNNNGYgMzU3IDc6MDAiLCAiZGllbSI6IDI4NH0sIHsidGVuIjogIkFuIEtow6FuaCAtIEVtbWEiLCAibG9wIjogIlNNNGUgMjQ2IDY6MDAiLCAiZGllbSI6IDQ0N30sIHsidGVuIjogIlRoYW5oIFRoxrAgLSBOYW5jeSIsICJsb3AiOiAiU000ZSAyNDYgNjowMCIsICJkaWVtIjogMzAxfSwgeyJ0ZW4iOiAiSOG6oSBWeSAtIExpbHkiLCAibG9wIjogIlNNNGUgMjQ2IDY6MDAiLCAiZGllbSI6IDM4Nn0sIHsidGVuIjogIkNo4bq/IE5n4buNYyBIw6JuIC0gTGlzYSIsICJsb3AiOiAiU001YyAyNDYgNjowMCIsICJkaWVtIjogOTczfSwgeyJ0ZW4iOiAiUXVhbmcgLSBQYXVsIiwgImxvcCI6ICJTTTVjIDI0NiA2OjAwIiwgImRpZW0iOiA4NTN9LCB7InRlbiI6ICJKdWxpZSIsICJsb3AiOiAiU001YyAyNDYgNjowMCIsICJkaWVtIjogMzM4fSwgeyJ0ZW4iOiAiVHXhu4cgLSBBbWFuZGEiLCAibG9wIjogIlNNNWIgMzU3IDY6MDAiLCAiZGllbSI6IDExNzB9LCB7InRlbiI6ICJZ4bq/biAtIE1hcmlhIiwgImxvcCI6ICJTTTViIDM1NyA2OjAwIiwgImRpZW0iOiAxMTcwfSwgeyJ0ZW4iOiAiVHLhu41uZyBOaMOibiIsICJsb3AiOiAiU001Y const $ = s => document.querySelector(s);
const tt = s => { $("#tt").textContent = s; };
const log = s => { $("#log-card").style.display = "block"; $("#log").textContent = s; };

function boDau(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function maLop(s){ const m = boDau(s).match(/^(sm\s*\d\s*[a-z]?|a2\s*[a-z]?)/); return m ? m[1].replace(/\s+/g,"") : ""; }
function demCua(S, ma){
  const ngay = (S.diem_ngay||{})[ma] || {};
  return Object.values(ngay).reduce((s,x)=>s + (Number(x && x.diem)||0), 0);
}
function thuongCua(S, ma){ return Number((((S.diem||{})[ma]||{}).diem_thuong))||0; }
function hienTai(S, ma){ return Math.round((demCua(S,ma) + thuongCua(S,ma) + (Number((((S.diem||{})[ma]||{}).dieu_chinh))||0))*10)/10; }

function chamDiem(row, h){
  const ten = boDau(row.ten), lop = maLop(row.lop);
  const phan = row.ten.split(/\s*-\s*/).map(boDau);
  const ho = boDau(h.ho_ten), goi = boDau(h.ten_goi_trong_lop);
  let d = 0;
  if (ho === ten) d = 100;
  else if (goi && (goi === ten || phan.includes(goi))) d = 92;
  else if (ho === phan[0] && phan.length > 1) d = 88;
  else if (ho && ten.startsWith(ho + " ")) d = 70;
  else if (ho && ten.includes(ho)) d = 62;
  else if (goi && ten.includes(goi)) d = 55;
  if (!d) return 0;
  if (lop && maLop(h.lop) === lop) d += 25;
  else if (lop && boDau(h.lop).includes(lop)) d += 20;
  if (h.trang_thai === "bảo lưu" || h.trang_thai === "nghỉ") d -= 15;
  return d;
}

let SB = null, S = null, PHIEN = null, DONG = [];

async function mo(){
  try {
    const m = await import("https://esm.sh/@supabase/supabase-js@2");
    SB = m.createClient(SB_URL, SB_KEY);
  } catch(e) {
    const m2 = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    SB = m2.createClient(SB_URL, SB_KEY);
  }
  const { data:{ session } } = await SB.auth.getSession();
  if (!session) {
    tt("Chưa đăng nhập. Mở hoctienganhdelam.com/quan-ly, đăng nhập rồi quay lại trang này.");
    return;
  }
  await tai();
}

async function tai(){
  tt("Đang tải dữ liệu lớp…");
  const { data, error } = await SB.from("kho_lop").select("du_lieu,phien_ban").eq("id","main").maybeSingle();
  if (error) { tt("Không đọc được dữ liệu: " + error.message); return; }
  if (!data || !data.du_lieu) { tt("Kho lớp đang trống."); return; }
  S = data.du_lieu; PHIEN = data.phien_ban;
  const hv = S.hoc_vien || [];
  tt("Đã tải " + hv.length + " học viên · phiên bản " + PHIEN);
  dungBang(hv);
}

function dungBang(hv){
  DONG = BANG.map(r => {
    const ds = hv.map(h => ({h, d: chamDiem(r, h)})).filter(x => x.d > 0).sort((a,b) => b.d - a.d);
    const chon = ds[0] && (ds.length === 1 || ds[0].d - ds[1].d >= 10) ? ds[0].h : null;
    return {r, ds, chon};
  });

  const tbody = $("#bang tbody");
  tbody.innerHTML = DONG.map((x, i) => {
    const ma = x.chon ? x.chon.ma_hv : null;
    const ht = ma ? hienTai(S, ma) : null;
    const dieu = ma ? Math.round((x.r.diem - ht)*10)/10 : null;
    const sau = ma ? Math.round((ht + dieu)*10)/10 : null;
    const lop = (cls) => `<tr class="${cls}" data-i="${i}">
      <td>${x.r.ten}</td><td class="ghi">${x.r.lop}</td><td class="so">${x.r.diem}</td>
      <td>${oChon(x, i)}</td>
      <td class="so">${ht==null?"—":ht}</td>
      <td class="so">${dieu==null?"—":(dieu>0?"+":"")+dieu}</td>
      <td class="so">${sau==null?"—":sau}</td></tr>`;
    const cls = !x.chon ? (x.ds.length ? "can" : "loi") : (Math.abs(dieu) < 0.01 ? "ok" : "");
    return lop(cls);
  }).join("");

  tbody.querySelectorAll("select").forEach(sel => sel.addEventListener("change", e => {
    const i = Number(e.target.dataset.i);
    const ma = e.target.value;
    DONG[i].chon = ma ? (S.hoc_vien||[]).find(h => h.ma_hv === ma) : null;
    dungBang(S.hoc_vien || []);
  }));

  const khop = DONG.filter(x => x.chon).length;
  const lech = DONG.filter(x => x.chon && Math.abs(x.r.diem - hienTai(S, x.chon.ma_hv)) >= 0.05).length;
  $("#tong-ket").innerHTML = `Khớp <b>${khop}/${BANG.length}</b> · cần điều chỉnh <b>${lech}</b>`;
  $("#khoi-bang").style.display = "block";
  $("#nut-ap").disabled = khop === 0;
}

function oChon(x, i){
  const opts = [`<option value="">— chọn học viên —</option>`].concat(
    (S.hoc_vien||[]).slice().sort((a,b)=>String(a.ho_ten).localeCompare(String(b.ho_ten),"vi"))
      .map(h => `<option value="${h.ma_hv}" ${x.chon && x.chon.ma_hv===h.ma_hv?"selected":""}>${h.ma_hv} · ${h.ho_ten}${h.ten_goi_trong_lop?" ("+h.ten_goi_trong_lop+")":""} · ${h.lop||"?"}</option>`)
  );
  return `<select data-i="${i}">${opts.join("")}</select>`;
}

async function apDung(){
  $("#nut-ap").disabled = true;
  tt("Đang lưu…");
  try {
    const { data, error } = await SB.from("kho_lop").select("du_lieu,phien_ban").eq("id","main").maybeSingle();
    if (error) throw new Error(error.message);
    const moi = data.du_lieu; const phien = data.phien_ban;
    let doi = 0;
    for (const x of DONG) {
      if (!x.chon) continue;
      const ma = x.chon.ma_hv;
      if (!moi.diem) moi.diem = {};
      if (!moi.diem[ma]) moi.diem[ma] = {nghe:null,noi:null,doc:null,viet:null,tuong_tac:"",ho_tro:"",nhan_xet:"",diem_thuong:0,dieu_chinh:0};
      const ht = hienTai(moi, ma);
      const dc = Math.round((x.r.diem - ht)*10)/10;
      moi.diem[ma].dieu_chinh = Math.round(((Number(moi.diem[ma].dieu_chinh)||0) + dc)*10)/10;
      doi++;
    }
    const json = JSON.stringify(moi);
    let gui = moi, boAnh = false;
    if (json.length > 3_500_000 && moi.anh) { gui = Object.assign({}, moi); delete gui.anh; boAnh = true; }
    const r = await SB.rpc("luu_kho", { p_du_lieu: gui, p_phien_ban: phien });
    if (r.error) throw new Error(r.error.message);

    const kiem = await SB.from("kho_lop").select("du_lieu").eq("id","main").maybeSingle();
    const S2 = kiem.data.du_lieu;
    const sai = DONG.filter(x => x.chon && Math.abs(x.r.diem - hienTai(S2, x.chon.ma_hv)) > 0.05);
    log("Đã cập nhật " + doi + " học viên." + (boAnh ? " (bỏ ảnh cache trong gói lưu)" : "") + "\nKiểm lại: " + (sai.length ? "CÒN LỆCH " + sai.length + " dòng: " + sai.map(x=>x.r.ten).join(", ") : "tất cả khớp bảng ✓")
        + "\nMở lại hoctienganhdelam.com/quan-ly để xem điểm mới.");
    tt("Xong · phiên bản mới " + (r.data ?? phien));
    S = S2; dungBang(S.hoc_vien||[]);
  } catch(e) {
    log("Lỗi: " + e.message + "\nChưa ghi gì hoặc chỉ ghi một phần — bấm Tải lại dữ liệu rồi thử lại.");
    tt("Lỗi khi lưu");
  } finally {
    $("#nut-ap").disabled = false;
  }
}

$("#nut-ap").addEventListener("click", apDung);
$("#nut-tai").addEventListener("click", () => location.reload());
mo();
</script>
